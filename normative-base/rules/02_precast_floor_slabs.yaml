checked_at: 2026-09-30
target_profile: RU_2027_PLUS
primary_documents: [GOST_26434_2025, GOST_9561_2025]
scope_note: "ГОСТ 26434-2025 относится к плитам для несущей части перекрытий жилых зданий. Для общественных/производственных зданий не переносить его область применения автоматически."

slab_types:
  source: GOST_26434_2025
  clause: "4.1"
  solid:
    - {type: "1P", thickness_mm: 120}
    - {type: "2P", thickness_mm: 160}
  hollow_core:
    - {type: "1PK", thickness_mm: 220, void: "round 159 mm", bearing: "2 sides"}
    - {type: "1PKT", thickness_mm: 220, void: "round 159 mm", bearing: "3 sides"}
    - {type: "1PKK", thickness_mm: 220, void: "round 159 mm", bearing: "4 sides"}
    - {type: "2PK", thickness_mm: 220, void: "round 140 mm", bearing: "2 sides"}
    - {type: "2PKT", thickness_mm: 220, void: "round 140 mm", bearing: "3 sides"}
    - {type: "2PKK", thickness_mm: 220, void: "round 140 mm", bearing: "4 sides"}
    - {type: "3PK", thickness_mm: 220, void: "round 127 mm", bearing: "2 sides"}
    - {type: "3PKT", thickness_mm: 220, void: "round 127 mm", bearing: "3 sides"}
    - {type: "3PKK", thickness_mm: 220, void: "round 127 mm", bearing: "4 sides"}
    - {type: "7PK", thickness_mm: 160, void: "round 114 mm", bearing: "do_not_infer_without_applicable_product_data"}
  continuous_forming:
    - {type: "1.5PB", thickness_mm: 150, bearing: "2 sides"}
    - {type: "1.6PB", thickness_mm: 160, bearing: "2 sides"}
    - {type: "1.8PB", thickness_mm: 180, bearing: "2 sides"}
    - {type: "2.2PB", thickness_mm: 220, bearing: "2 sides"}
    - {type: "2.65PB", thickness_mm: 265, bearing: "2 sides"}
    - {type: "3PB", thickness_mm: 300, bearing: "2 sides"}
    - {type: "3.2PB", thickness_mm: 320, bearing: "2 sides"}
    - {type: "3.3PB", thickness_mm: 330, bearing: "2 sides"}
    - {type: "4PB", thickness_mm: 400, bearing: "2 sides"}
    - {type: "4.5PB", thickness_mm: 450, bearing: "2 sides"}
    - {type: "5PB", thickness_mm: 500, bearing: "2 sides"}

coordination_rules:
  - id: slab.table_membership
    automation: conditional
    source_clause: "4.4, table 1"
    statement: "Для нормативного типа ПК/П/ПБ проверять координационные размеры по соответствующим строкам и примечаниям ГОСТ 26434-2025; не генерировать любую комбинацию длины/ширины только потому, что она кратна 300 мм."
  - id: slab.PB_widths
    automation: auto
    source_clause: "table 1 note 4"
    applies_to: ["1.5PB","1.6PB","1.8PB","2.2PB","2.65PB","3PB","3.2PB","3.3PB","4PB","4.5PB","5PB"]
    coordination_widths_mm: [1000,1200,1500]
  - id: slab.PB_length_manufacturer
    automation: forbidden_to_infer
    source_clause: "table 1 note 4; 4.7"
    applies_to: ["1.5PB","1.6PB","1.8PB","2.2PB","2.65PB","3PB","3.2PB","3.3PB","4PB","4.5PB","5PB"]
    statement: "Координационная длина плит ПБ определяется возможностями формовочного оборудования изготовителя/рабочими чертежами; универсальный нормативный ряд длин ПБ не создавать."
    requires_manufacturer_data: true
  - id: slab.PKT_ranges
    automation: conditional
    source_clause: "table 1 note 2"
    statement: "Для 1PKT/2PKT/3PKT координационная длина 3600..6600 мм шагом 300 мм, а также 7200 и 7500 мм; ширина 2400..3600 мм шагом 300 мм."
  - id: slab.PKK_ranges
    automation: conditional
    source_clause: "table 1 note 3"
    statement: "Для 1PKK/2PKK/3PKK координационная длина 2400..6600 мм шагом 300 мм; ширина 4800..6600 мм шагом 300 мм, а также 7200 мм."
  - id: slab.1PK_9000_only
    automation: validation_only
    source_clause: "table 1 note 1"
    statement: "Координационная длина 9000 мм предусмотрена только для плит типа 1PK в области таблицы 1."
  - id: slab.1PK_span_direction
    automation: validation_only
    source_clause: "table 1 note 7"
    statement: "Для плит 1PK расчетный пролет может быть направлен параллельно длине или ширине согласно предусмотренной стандартом схеме; агент не должен всегда считать длинную сторону направлением пролета."

size_semantics:
  rule: "Хранить отдельно coordination_length/width, constructive_product_length/width, фактические монтажные зазоры и опорную геометрию. Координационный размер не равен автоматически физическому габариту изделия."

modeling_logic:
  - "Не создавать произвольную длину/ширину сборной плиты, если выбран нормативный тип: валидировать конкретную комбинацию по таблице или рабочим чертежам производителя."
  - "Не путать координационный размер с конструктивным размером изделия; зазоры и допуски учитывать отдельно."
  - "Не подрезать пустотную/преднапряженную плиту в BIM как обычный прямоугольник без подтверждения ГОСТ/ТУ/рабочих чертежей изготовителя и КР."
  - "Не назначать несущую способность, класс бетона, армирование и расчетную нагрузку только по геометрическому типу плиты."
  - "Не назначать глубину опирания универсальным числом: она определяется расчетом, материалом опоры, конструктивной схемой и документацией конкретной системы."
  - "При выборе многопустотной плиты дополнительно применять ГОСТ 9561-2025 с поправкой ИУС 6-2026."
  - "Раскладка плит должна оптимизировать число доборных/нестандартных элементов только после проверки расчетной схемы и допустимых изделий."

