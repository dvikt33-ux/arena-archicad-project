  - {node_id: ROOF_AR_006_WALL_ABUTMENT, family: wall_abutment, recipe: 16_wall_abutment_node.yaml}
  - {node_id: ROOF_AR_007_GABLE_VERGE, family: gable_verge, recipe: roof_gable_verge_node.yaml}
  - {node_id: ROOF_AR_008_PENETRATION, family: roof_penetration, recipe: roof_penetration_node.yaml}
  - {node_id: ROOF_KR_001_RAFTER_TO_WALL_SUPPORT, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_002_RAFTER_PAIR_APEX, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_003_RAFTER_TO_STRUCTURAL_RIDGE_BEAM, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_004_RAFTER_TO_PURLIN, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_005_PURLIN_TO_POST, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_006_JACK_TO_HIP_OR_VALLEY, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}
  - {node_id: ROOF_KR_007_TRUSS_TO_SUPPORT, family: structural_roof_connection, recipe: roof_rafter_connection_nodes.yaml}

selection_rules:
  - id: roof.catalog.topology_drives_nodes
    automation: true
    statement: "Node instances выводятся из topology graph крыши, structural variant и covering adapter, а не выбираются вручную по похожему названию."
  - id: roof.catalog.no_generic_detail_fallback
    automation: true
    statement: "Если подходящего узла нет или blockers не разрешены, запрещено подставлять ближайший типовой узел по аналогии."
    result_on_missing: roof_node_scope_unresolved

usage_map:
  roof_wall_support: "каждая расчетная линия опирания крыши на стену/ригель"
  eaves: "каждый нижний свободный край ската"
  ridge: "каждое верхнее выпуклое пересечение двух скатов"
  hip: "каждое наклонное выпуклое пересечение двух скатов"
  valley: "каждое вогнутое пересечение двух скатов"
  wall_abutment: "каждое пересечение ската с вертикальной стеной, шахтой или парапетом"
  gable_verge: "каждый наклонный свободный торец ската у фронтона"
  roof_penetration: "каждая проходка, окно крыши, дымоход или инженерное пересечение кровельного пирога"
  structural_roof_connection: "каждый конец или расчетная точка соединения несущих элементов стропильной системы"
