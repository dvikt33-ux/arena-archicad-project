must_calculate_or_receive_from_KR:
  - "несущая способность и минимально допустимая ширина несущего простенка"
  - "размер, армирование и опирание перемычки"
  - "сечение колонны, пилона, балки, ригеля"
  - "толщина и армирование монолитной плиты"
  - "расчетная несущая способность и армирование сборной плиты"
  - "глубина/длина опирания сборной плиты, балки, перемычки, если она зависит от расчетной схемы/материала/серии"
  - "марка/класс бетона, раствора, кирпича/камня по прочности, арматуры или стали"
  - "тип, габариты и отметка подошвы фундамента"
  - "деформационные, температурные, осадочные и сейсмические швы"
  - "допустимый вылет консоли и отверстия/проемы в несущих элементах"
  - "любое ослабление пустотной/преднапряженной плиты отверстием или подрезкой"

architect_can_coordinate:
  - "координационные оси и модульную сетку"
  - "предварительное расположение несущих стен/колонн при наличии принятой конструктивной схемы"
  - "положение архитектурных проемов с проверкой коллизий"
  - "раскладку нормативных типоразмеров сборных изделий как вариант, подлежащий проверке КР"
  - "чистые высоты, уровни полов и потолков и требуемые архитектурные габариты"
  - "геометрию лестниц/эвакуационных путей в части функциональных и пожарных требований"

agent_fail_closed_logic:
  - "Если необходимое решение входит в must_calculate_or_receive_from_KR и расчетных исходных данных нет — не назначать значение, поставить unresolved/needs_structural_calculation."
  - "Не использовать 'типовые 120/150/200 мм опирания' как универсальную норму."
  - "Не считать кратность модулю доказательством несущей способности."
  - "Не менять несущую систему ради удобной кирпичной или плитной раскладки без нового расчета."
  - "Если архитектурный проем конфликтует с расчетной конструкцией — фиксировать коллизию, а не автоматически уменьшать конструктивный элемент."

