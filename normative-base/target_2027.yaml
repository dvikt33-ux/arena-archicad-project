agent_gate:
  before_model_generation:
    - "load target_2027.yaml"
    - "load revision_watch_2027.yaml"
    - "load revision_watch_adjacent_2027.yaml"
    - "reject rules superseded by confirmed_transitions"
    - "reject expired documents without an officially adopted replacement"
    - "verify object_function and special_code applicability"
    - "verify requirements_registry applicability"
  fail_closed: true
