mixed_function_algorithm:
  steps:
    - "1. Classify every major functional block and fire compartment, not only the marketing name of the whole building."
    - "2. Load base general documents plus every applicable special functional SP."
    - "3. Check the stated scope limits of each SP: height, depth, type of use, new/reconstruction, special exclusions."
    - "4. Resolve conflicts by legal/applicability hierarchy and specific scope; do not simply choose the numerically stricter value when the rules describe different objects."
    - "5. For mixed-use/ТРК additionally load applicable fire-safety SP for multifunctional buildings/atriums/galleries and special functions such as cinema/sport/hotel/parking."
    - "6. If the object's parameters exceed a special SP scope, return needs_special_technical_conditions_or_additional_basis rather than extrapolating the SP."

BIM_required_parameters:
  - building_primary_function
  - functional_zones
  - functional_fire_classes
  - fire_compartment_assignments
  - building_height_definition_and_value
  - underground_depth
  - occupancy_categories
  - special_room_types
  - applicable_special_codes
  - code_scope_validation_status

agent_logic:
  - "Название проекта 'ТРК', 'школа', 'больница' или 'жилой дом' должно преобразовываться в набор нормативных профилей до генерации помещений."
  - "Одноквартирный дом должен быть явно классифицирован в профиль IZHS/SP55; профиль МКД SP54 не применяется к нему только по общему слову 'жилой'."
  - "Не применять таблицы площадей/высот/санузлов/лестниц из СП 118, если специальный СП объекта задает собственное требование."
  - "Не использовать замененный СП 278.1325800.2016 для вузов; профиль 2027 использует СП 278.1325800.2024."
  - "Не использовать замененный СП 257.1325800.2016 для гостиниц; использовать СП 257.1325800.2020 с Изм. №1."
  - "Для школ использовать СП 251 с Изм. №1-7; сборка до Изм. №7 считается устаревшей для профиля 2027."
  - "Для медорганизаций использовать СП 158 с Изм. №1-7; сборка до Изм. №7 считается устаревшей для профиля 2027."
  - "Для высотного объекта использовать СП 267 с Изм. №1-3; более ранние сборки считать устаревшими."

