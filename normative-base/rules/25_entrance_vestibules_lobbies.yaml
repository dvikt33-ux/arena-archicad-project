checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Входные площадки, тамбуры и тамбур-шлюзы: геометрия доступного маршрута, эвакуации и границы между МГН и пожарными требованиями."

revision_dependencies:
  - {document: SP_59_13330_2020, verified_changes: [1,2,3,4]}
  - {document: SP_1_13130_2020, verified_changes: [1,2,3]}
  - {document: SP_118_13330_2022, verified_changes: [1,2,3,4,5]}

accessible_entrance_platforms:
  source: SP_59_13330_2020
  rules:
    - id: entrance.platform.with_ramp
      clause: "6.1.4"
      automation: conditional
      dimension_semantics: clear
      statement: "Размер входной площадки при наличии пандуса должен быть не менее 2,2 x 2,2 м."
      values: {min_width_mm: 2200, min_depth_mm: 2200}

    - id: entrance.platform.new_without_ramp
      clause: "6.1.4"
      automation: conditional
      dimension_semantics: clear
      statement: "При новом строительстве входная площадка без пандуса должна быть не менее 1,6 x 2,2 м."
      values: {min_width_mm: 1600, min_depth_mm: 2200}

    - id: entrance.platform.automatic_sliding
      clause: "6.1.4"
      automation: conditional
      dimension_semantics: clear
      statement: "При автоматических раздвижных дверях входная площадка должна быть не менее 1,9 x 1,2 м в области применения пункта."
      values: {min_width_mm: 1900, min_depth_mm: 1200}

accessible_door:
  source: SP_59_13330_2020
  rules:
    - id: entrance.door.accessible_clear_width
      clause: "6.1.5"
      automation: conditional
      dimension_semantics: clear
      statement: "Доступный входной дверной проем для пользователя кресла-коляски при новом строительстве должен обеспечивать не менее 0,9 м в свету."
      values: {min_clear_width_mm: 900}
      conflict_policy: "Если вход одновременно эвакуационный, применять совместно с СП 1.13130.2020 и специальными требованиями объекта."

    - id: entrance.door.double_leaf_accessible_leaf
      clause: "6.1.5"
      automation: conditional
      dimension_semantics: clear
      statement: "Для двустворчатой входной двери одна створка должна обеспечивать требуемую доступную ширину 0,9 м в свету."
      values: {accessible_leaf_clear_width_mm: 900}

accessible_vestibules:
  source: SP_59_13330_2020
  rules:
    - id: vestibule.accessible.straight_one_way_swing
      clause: "6.1.8"
      amendment: 3
      automation: conditional
      dimension_semantics: clear
      statement: "При прямом движении и одностороннем открывании дверей глубина тамбура или тамбур-шлюза должна быть не менее 2,45 м, ширина — не менее 1,60 м."
      values: {min_depth_mm: 2450, min_width_mm: 1600}

    - id: vestibule.accessible.alternative_geometry
      clause: "6.1.8"
      amendment: 3
      automation: validation_only
      statement: "Иные габариты тамбура допускаются только при обеспечении требуемых зон маневрирования пользователя кресла-коляски и зон открывания дверей."
      values:
        wheelchair_180_turn_min_diameter_mm: 1400
        manoeuvre_before_pull_door_min_depth_mm: 1500
        manoeuvre_before_pull_door_min_width_mm: 1500
        handle_side_clearance_pull_door_min_mm: 600
      conflict_policy: "Зона разворота не должна пересекаться с зоной открывания двери внутрь тамбура."

    - id: vestibule.no_mirror_surfaces_on_egress_access
      clause: "6.1.8"
      automation: validation_only
      statement: "В тамбурах, лестничных клетках и у эвакуационных выходов не применять зеркальные стены/поверхности и зеркальные стекла в дверях в области требований СП 59."

fire_egress_vestibules:
  source: SP_1_13130_2020
  rules:
    - id: vestibule.egress.clear_width
      clause: "4.3.11"
      automation: conditional
      dimension_semantics: clear
      statement: "Ширина тамбура или тамбур-шлюза, расположенного на пути эвакуации, должна превышать ширину дверного проема в свету не менее чем на 0,5 м."
      formula: "vestibule_clear_width >= door_clear_opening_width + 500 mm"
      values: {door_width_addition_mm: 500}
      note: "ВНИИПО МЧС отдельно разъяснил, что ширина дверного проема в контексте п. 4.3.11 измеряется в свету."

    - id: vestibule.egress.clear_depth
      clause: "4.3.11"
      automation: conditional
      dimension_semantics: clear
      statement: "Глубина тамбура или тамбур-шлюза на пути эвакуации должна превышать ширину дверного полотна не менее чем на 0,5 м и быть не менее 1,5 м."
      formula: "vestibule_clear_depth >= max(door_leaf_width + 500 mm, 1500 mm)"
      values: {leaf_width_addition_mm: 500, absolute_min_depth_mm: 1500}

    - id: vestibule.egress.multiple_door_swing_no_intersection
      clause: "4.3.11"
      automation: validation_only
      statement: "Если в тамбур или тамбур-шлюз выходят две и более двери, взаимное пересечение траекторий их открывания не допускается."

  conflict_resolution:
    - "Если тамбур одновременно находится на доступном маршруте МГН и на пути эвакуации, требования СП 59 п. 6.1.8 и СП 1 п. 4.3.11 выполняются одновременно."
    - "Не выбирать между 2450x1600 и формулами СП 1 как взаимоисключающими вариантами: построить фактическую геометрию и проверить оба применимых набора требований."
    - "Для двух и более дверей проверять реальные траектории каждого полотна; достаточная площадь помещения сама по себе не доказывает соответствие."

fire_and_egress_intersection:
  - id: vestibule.egress.swing_direction
    source: {document: SP_1_13130_2020, clause: "4.2.22"}
    automation: validation_only
    statement: "Двери на путях эвакуации в общем случае открываются по направлению выхода; исключения пункта 4.2.22 проверять по классификации помещения/здания."

  - id: vestibule.fire_tambour_no_universal_plan_size
    automation: forbidden_to_infer
    statement: "Габарит пожарного тамбур-шлюза нельзя назначать только по правилам СП 59 или п. 4.3.11 СП 1: пожарный тамбур-шлюз дополнительно проверяется по требованиям пожарной безопасности, подпору воздуха, классу функциональной опасности и защищаемому проему."
    requires_calculation: true

BIM_required_parameters:
  - entrance_accessible_status
  - entrance_egress_status
  - entrance_platform_clear_width_mm
  - entrance_platform_clear_depth_mm
  - vestibule_clear_width_mm
  - vestibule_clear_depth_mm
  - door_1_clear_width_mm
  - door_2_clear_width_mm
  - door_1_leaf_width_mm
  - door_2_leaf_width_mm
  - door_1_swing_direction
  - door_2_swing_direction
  - each_door_swing_envelope
  - wheelchair_turning_zone_geometry
  - handle_side_clearance_mm
  - ramp_presence
  - automatic_door_type
  - fire_tambour_status
  - fire_pressurization_requirement

layout_algorithm:
  steps:
    - "1. Определить, является ли вход/тамбур доступным для МГН, эвакуационным, пожарным тамбур-шлюзом или сочетанием этих функций."
    - "2. Сначала назначить требуемые размеры дверей в свету по СП 59 и СП 1."
    - "3. Для доступного входа проверить входную площадку по 6.1.4 СП 59."
    - "4. Для доступного тамбура проверить п. 6.1.8 СП 59; для эвакуационного — отдельно п. 4.3.11 СП 1."
    - "5. Построить реальные траектории всех полотен; при двух и более дверях в эвакуационном тамбуре траектории не должны пересекаться."
    - "6. Не считать наружный габарит коробки размером в свету и не считать размер помещения между стенами достаточным, если полотна нарушают требуемые зоны."
    - "7. Если это пожарный тамбур-шлюз, выполнить отдельную пожарную проверку; доступность и обычная эвакуационная геометрия не заменяют специальных пожарных требований."

agent_logic:
  - "Не рисовать тамбур 1,5 x 1,5 м по памяти, если он входит в доступный маршрут нового здания."
  - "Не проверять тамбур только по размерам стен: учитывать размер дверного проема в свету, ширину полотен и траектории открывания."
  - "Если альтернативная геометрия проходит по площади, но зона разворота или траектории дверей конфликтуют, решение отклонить."
  - "При коллизии размеров входа не уменьшать доступную/эвакуационную ширину ради модульной сетки фасада."

sources:
