  - {document: GOST_26607_85, status: superseded_in_RF, effective_until: 2020-12-31, replaced_in_RF_by: GOST_R_58944_2020}
  - {document: GOST_26433_1_89, status: superseded_in_RF, effective_until: 2020-12-31, replaced_in_measurement_domain_by: GOST_R_58939_2020}

semantics:
  - id: accuracy.nominal_not_tolerance
    automation: auto
    statement: "Номинальный/координационный проектный размер не должен содержать технологический допуск. В BIM хранить базовое значение размера отдельно от допустимого отклонения."

  - id: accuracy.functional_vs_technological
    automation: auto
    statement: "Функциональный допуск и технологический допуск являются разными сущностями: первый связан с требуемой работоспособностью/взаимным положением, второй — с изготовлением, разбивкой и монтажом. Не использовать одно поле tolerance_mm для всех случаев."

  - id: accuracy.actual_measurement_separate
    automation: auto
    statement: "Фактически измеренный размер/отклонение хранить отдельно от проектного допуска. Контроль соответствия выполняется сравнением измеренного значения с применимым допуском, а не изменением номинальной геометрии проекта."

  - id: accuracy.no_design_error_from_tolerance
    automation: forbidden_to_infer
    statement: "Запрещено намеренно смещать ось, проем, стену, плиту или другой элемент в проектной модели на величину допуска, считая это допустимым проектным решением. Допуск описывает допустимое отклонение реализации/изготовления, а не альтернативную проектную геометрию."

  - id: accuracy.product_standard_priority
    automation: conditional
    statement: "Если конкретный ГОСТ изделия или СП конструкции задает собственные предельные отклонения, использовать их в области применения изделия/работы; общая система точности не подменяет специальные значения."

assembly_and_dimension_chains:
  - id: accuracy.chain.requires_accuracy_calculation
    source: {document: GOST_21780_2006, clause: "scope/general method"}
    automation: manual_calculation
    statement: "Для критической размерной цепи, где собираемость зависит от нескольких отклонений изготовления/разбивки/монтажа, выполнять расчет точности; нельзя складывать все максимальные допуски как произвольный запас без расчетной схемы."
    requires_calculation: true

  - id: accuracy.mounting_gap_not_residual
    automation: forbidden_to_infer
    statement: "Монтажный зазор окна, двери, панели, фасадной системы или сборного элемента нельзя определять как случайный остаток после округления модульной сетки и допусков. Он задается нормой/системой/проектным узлом и проверяется отдельно."
    requires_manufacturer_data: true

BIM_parameter_model:
  required_fields:
    - nominal_dimension
    - coordination_dimension_if_applicable
    - functional_tolerance_plus
    - functional_tolerance_minus
    - technological_tolerance_plus
    - technological_tolerance_minus
    - actual_measured_dimension_if_asbuilt
    - source_document
    - source_clause_or_table
    - tolerance_scope
    - inspection_method_if_required

agent_logic:
  - "Сначала строить идеальную проектную геометрию по нормативному/координационному размеру."
  - "После этого назначать допуски как метаданные контроля, если они подтверждены специальным стандартом или расчетом точности."
  - "Не увеличивать автоматически проем на сумму всех известных допусков; монтажный узел рассчитывается отдельно."
  - "Не использовать устаревшие ГОСТ 21779-82 и 26607-85 как текущие источники профиля 2027."
  - "При выпуске исполнительной/as-built модели фактические измерения не должны перезаписывать нормативные номинальные параметры без сохранения обоих значений."

