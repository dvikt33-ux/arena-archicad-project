findings:
  - id: GLOBAL_RULE_GLOB_SCOPE_RISK
    severity: high
    result: confirmed
    evidence:
      manifest: "../manifest.yaml"
      behavior: "rules/*.yaml are loaded globally before izh/manifest.yaml"
      validator_before_fix: "tools/validate.py did not validate object-class applicability"
    consequence: >-
      A machine consumer could theoretically evaluate an SP54/SP118 rule for IZHS merely because
      the YAML file is globally loaded, unless scope routing is enforced separately.

  - id: MKD_ONLY_GLOBAL_RULE_CLUSTER
    severity: high
    result: confirmed
    files:
      - 35_residential_planning_minima.yaml
      - 36_residential_wet_zone_stacking.yaml
      - 37_residential_balconies_loggias.yaml
      - 40_residential_vertical_transport.yaml
      - 53_garant_residential_planning_verification.yaml
      - 61_residential_entrance_vestibules_climate.yaml
      - 65_timber_apartment_fire_2026.yaml
    normative_bases: [SP_54_13330_2022, SP_549_1311500_2026]
    required_scope: MKD_only
    IZHS_action: not_applicable

  - id: MIXED_RULE_07_GUARDRAILS
    severity: high
    result: section_scope_required
    common_product_standard: GOST_25772_2025
    MKD_section: residential_project_requirements
    PUBLIC_section: public_project_requirements
    IZHS_rule: >-
      Product type/geometry may be used when applicable, but SP54 project heights are forbidden
      for IZHS; an IZHS project requirement must come from an applicable IZHS/common source.

  - id: MIXED_RULE_100_SP402
    severity: high
    result: section_scope_required
    file_scope: [IZHS, MKD]
    forbidden_classes: [PUBLIC, TRK, INDUSTRIAL]
    MKD_only_sections: [multifamily_residential, locator_5_16]

scope_hardening:
  router: "../rules/28_functional_code_router.yaml"
  registry_mode: hard_gate_before_rule_evaluation
  high_risk_files_registered: 10
  MKD_only_files_hard_forbidden_for_IZHS: 7
  section_scoped_files: [04_architectural_baseline.yaml, 07_guardrails_roofs.yaml, 100_residential_gas_architectural_interfaces_2027.yaml]
  CI_validator: "../tools/validate.py"
  CI_behavior: >-
    Lint fails if required scope entries disappear, expected allowed classes change, MKD-only files
    allow IZHS, or critical section overrides lose their narrower object-class gates.

