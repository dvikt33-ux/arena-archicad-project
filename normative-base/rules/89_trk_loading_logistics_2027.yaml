additional_dispatch_places:
  - id: trk.loading.nonfood_full_dispatch_up_to_1000
    source: {document: SP_464_1325800_2019, appendix: "В", table: "В.1 note 1"}
    automation: conditional
    category: specialized_nonfood_full_assortment
    sales_area_m2: {max: 1000}
    additional_loading_places_for_customer_goods_dispatch: 1
  - id: trk.loading.nonfood_full_dispatch_over_1000
    source: {document: SP_464_1325800_2019, appendix: "В", table: "В.1 note 1"}
    automation: conditional
    category: specialized_nonfood_full_assortment
    sales_area_m2: {min_exclusive: 1000}
    additional_loading_places_for_customer_goods_dispatch: 2

shared_loading_reduction:
  - id: trk.loading.shared_places_reduction_cap
    source: {document: SP_464_1325800_2019, appendix: "В", clause: "В.1"}
    automation: requires_justification
    max_reduction_percent: 15
    condition: "multiple_trade_enterprises_share_loading_places"
    statement: >-
      Совместное использование разгрузочных мест несколькими предприятиями торговли может
      уменьшить их суммарное расчетное число не более чем на 15%. Применять только после
      моделирования графика и совместимости грузопотоков.

  - id: trk.loading.cargo_turnover_alternative_calculation
    source: {document: SP_464_1325800_2019, appendix: "В", table: "В.1 note 2, Change 1"}
    automation: requires_calculation
    statement: >-
      Допускается принимать число разгрузочных мест по расчету с учетом планируемого грузооборота
      торговли и общепита, технологического оборудования, механизации и графика работы мест,
      исключающего час-пик. Этот расчет не генерируется из одной площади помещения.
    required_inputs:
      - cargo_turnover_schedule
      - vehicle_classes
      - unloading_equipment
      - mechanization_scheme
      - peak_hour_exclusion_schedule

platform_geometry:
  source: {document: SP_464_1325800_2019, appendix: "В", clause: "В.2"}
  rules:
    - id: trk.loading.platform_standard_height
      automation: conditional
      condition: "ordinary_delivery_vehicle_platform"
      platform_above_vehicle_area_m: [1.1, 1.2]
    - id: trk.loading.platform_light_vehicle_height
      automation: conditional
      condition: "small_tonnage_or_passenger_delivery_vehicle"
      platform_above_vehicle_area_m: [0.6, 0.8]
    - id: trk.loading.platform_lifting_equipment_level
      automation: conditional
      condition: "project_brief_has_loading_lifting_equipment"
      platform_relation: same_level_as_vehicle_area
    - id: trk.loading.platform_rectangular_depth
      automation: true
      shape: rectangular
      min_depth_m: 4.0
    - id: trk.loading.platform_sawtooth_depth
      automation: true
      shape: sawtooth
      min_depth_at_narrowest_m: 2.5

closed_dead_end_loading_room:
  source: {document: SP_464_1325800_2019, appendix: "В", clause: "В.3"}
  rules:
    - id: trk.loading.deadend_depth_small_vehicle
      automation: conditional
      vehicle_class: small_tonnage_or_passenger
      dimension_from_gate_to_platform_min_m: 8.0
    - id: trk.loading.deadend_depth_large_vehicle
      automation: conditional
      vehicle_class: heavy_refrigerated_or_trailer
      dimension_from_gate_to_platform_min_m: 12.0
    - id: trk.loading.clear_height
      automation: conditional
      applies_to: [closed_loading_room, covered_loading_space]
      clear_height_from_carriageway_to_projection_min_m: 4.2
    - id: trk.loading.entry_gate_width
      automation: conditional
      min_clear_width_m: 3.6
    - id: trk.loading.entry_gate_height
      automation: conditional
      min_clear_height_m: 4.2

logistics_flow_gates:
  - id: trk.loading.vehicle_swept_path_required
    automation: mandatory_validation
    statement: >-
      Нормативный габарит помещения не заменяет проверку траектории расчетного автомобиля.
      Перед фиксацией геометрии проверить въезд, поворот, постановку к платформе и выезд выбранного
      класса транспорта без конфликтов с колоннами, воротами, парковкой, пожарным доступом и МГН.

  - id: trk.loading.goods_to_freight_vertical_transport
    automation: mandatory_validation
    statement: >-
      Разгрузочную зону связывать с грузовыми лифтами/товарными маршрутами без использования
      посетительских эвакуационных путей как постоянного грузового коридора. Число грузовых
      лифтов определяется расчетом грузопотоков и заданием.

  - id: trk.loading.food_flow_separation
    automation: mandatory_router
    condition: "food_retail_or_foodservice_present"
    downstream_rules:
      - rules/87_trk_children_foodservice_2027.yaml
      - rules/88_food_retail_sanitary_2027.yaml
    statement: >-
      Для продуктов и общепита дополнительно проверять санитарную поточность, раздельность
      несовместимых потоков и технологические зоны; число разгрузочных мест СП 464 не заменяет эти проверки.

BIM_required_parameters:
  - enterprise_id
  - enterprise_trade_category
  - sales_area_m2
  - loading_place_count
  - loading_place_shared_group
  - loading_zone_type
  - design_vehicle_class
  - vehicle_swept_path
  - platform_shape
  - platform_level_m
  - vehicle_area_level_m
  - loading_room_clear_height_m
  - loading_gate_clear_width_m
  - loading_gate_clear_height_m
  - service_yard_id
  - freight_route_id
  - freight_lift_ids
  - cargo_turnover_calculation_reference

agent_logic:
  - "Сначала классифицировать каждое предприятие по таблице В.1, затем суммировать; не считать весь ТРК одной торговой площадью."
  - "Сокращение на 15% — верхний предел при совместном использовании, не коэффициент по умолчанию."
  - "Для общепита, специальных арендаторов и нестандартного грузооборота использовать расчет и задание, а не придумывать строку таблицы."
  - "Не применять старое правило обязательного закрытого дебаркадера ко всем предприятиям после Изменения №1."
  - "Все размеры ворот/высоты проверять как чистые габариты после конструкций, инженерии и оборудования."

