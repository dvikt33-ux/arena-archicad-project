checked_at: 2026-09-30
purpose: "Не допускать проектирование кладки по замененным стандартам и отделять каталог изделия от расчетной несущей схемы."

AAC_autoclaved:
  document: GOST_31360_2024
  status: active
  effective_from: 2025-01-01
  replaces: GOST_31360_2007
  corrections: ["ИУС 10-2024","ИУС 11-2025","ИУС 9-2025"]
  scope: "неармированные блоки из автоклавного ячеистого конструкционно-теплоизоляционного бетона для несущих и самонесущих наружных/внутренних стен и перегородок в неагрессивной среде; для влажных/мокрых помещений наружные ограждения требуют защиты от переувлажнения"
  maximum_product_dimensions_mm:
    source_clause: "4.2.2"
    note: "как правило, не должны превышать"
    length: 1500
    width: 650
    height: 1000
  agent_logic:
    - "Не использовать ГОСТ 31360-2007 как текущий."
    - "Не выбирать толщину газобетонной стены только по каталожной ширине блока: проверить прочность по СП 15.13330.2020 и теплотехнику по СП 50.13330.2024."
    - "Размеры конкретного блока брать из документации изготовителя в пределах действующего ГОСТ; не создавать вымышленный типоразмер."
    - "Шов кладки назначать по технологии и требованиям СП 70.13330.2012 для конкретного изделия/раствора, а не переносить автоматически 12/10 мм из обычной кирпичной кладки."

silicate_masonry:
  document: GOST_379_2025
  status: active
  effective_from: 2026-05-01
  replaces: GOST_379_2015
  correction: "ИУС 6-2026"
  standard_nominal_products:
    - {type: "single_silicate_brick", length_mm: 250, width_mm: 120, height_mm: 65}
    - {type: "thickened_silicate_brick", length_mm: 250, width_mm: 120, height_mm: 88}
    - {type: "silicate_stone", length_mm: 250, width_mm: 120, height_mm: 138}
    - {type: "euro_silicate_brick", length_mm: 250, width_mm: 85, height_mm: 65, note: "ГОСТ также приводит вариант высоты 60 мм; перед созданием библиотечного типа проверить конкретное изделие"}
  other_product_families:
    - "силикатные блоки"
    - "силикатные укрупненные блоки"
    - "силикатные U-образные (лотковые) блоки"
    - "силикатные перегородочные плиты"
    - "силикатные перегородочные укрупненные плиты"
  note: "Приложение А ГОСТ 379-2025 содержит ряд номинальных размеров. Для пазогребневых блоков и перегородочных плит в таблице указана системная длина изделия. Полный ряд должен быть занесен отдельной таблицей после машинной сверки исходника; не реконструировать его из плохо распознанного PDF."
  agent_logic:
    - "Не использовать ГОСТ 379-2015 как текущий."
    - "Различать одинарный кирпич, утолщенный кирпич, камень, блок и перегородочную плиту — это разные семейства элементов."
    - "Не выводить прочность стены из геометрии изделия; марку/класс и расчет проверять отдельно."

