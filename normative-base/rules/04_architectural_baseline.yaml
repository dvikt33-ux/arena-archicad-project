checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Базовый набор документов, которые архитектурный агент обязан определить до детализации модели."

working_documentation:
  - document: GOST_R_21_101_2026
    role: "общие требования СПДС к проектной и рабочей документации"
    effective_from: 2026-04-01
  - document: GOST_21_501_2018
    role: "рабочая документация архитектурных и конструктивных решений"
  - document: GOST_R_21_514_2025
    role: "правила выполнения проектной документации по инсоляции и естественному освещению"
    effective_from: 2025-08-01

building_height_rules:
  residential_apartments:
    source: SP_54_13330_2022
    verified_changes: [1,2]
    clause: "5.12"
    dimension_type: clear_floor_to_ceiling
    auto_rule: true
    cases:
      - {climatic_subdistricts: ["IA","IБ","IГ","IД","IVА"], min_mm: 2700}
      - {climatic_subdistricts: "other", min_mm: 2500}
    secondary_spaces:
      intra_apartment_corridors_halls_anterooms_mezzanine:
        min_mm: 2100
        note: "Применять только в области п. 5.12."
    attic_note: "Уменьшение высоты под наклонными ограждениями допускается только при выполнении условий полного пункта; не автоматизировать по одной цифре."
  public_buildings:
    source: SP_118_13330_2022
    verified_changes: [1,2,3,4,5]
    clause: "4.26"
    dimension_type: clear_floor_to_ceiling_including_suspended_ceiling
    auto_rule: conditional
    general_min_mm: 3000
    applies_to: "new public-building rooms with permanent and/or mass occupancy"
    note: "Пункт содержит специальные исключения. Проверять полный текст и профильный СП объекта."

climate_dependency:
  current_document: SP_131_13330_2025
  target_2027_status: use
  rule: "Климатический подрайон и расчетные климатические параметры получать из СП 131.13330.2025; старые таблицы СП 131.13330.2020 не использовать."

thermal_envelope:
  current_document: SP_50_13330_2024
  target_2027_status: use
  rule: "Толщину стены и утеплителя определять расчетом по СП 50.13330.2024 с климатическими данными СП 131.13330.2025 и характеристиками конкретных материалов; универсальная толщина запрещена."

acoustics_daylight_insolation:
  - document: SP_51_13330_2011
    topic: "защита от шума"
    verified_changes: [1,2,3,4]
  - document: SP_52_13330_2016
    topic: "естественное и искусственное освещение"
    verified_changes: [1,2]
  - document: GOST_R_21_514_2025
    topic: "оформление проектной документации по инсоляции и естественному освещению"
    note: "Стандарт задает правила выполнения документации; сам расчет должен опираться на применимые санитарные и светотехнические требования."

floors_finishes_roofs:
  - document: SP_29_13330_2011
    topic: "полы"
    verified_effective_changes: [1,2,3]
    pending_change: 4
    pending_change_note: "Изменение №4 опубликовано, но на карточке Росстандарта дата введения отсутствует; не считать его действующим автоматически."
  - document: SP_71_13330_2017
    topic: "изоляционные и отделочные покрытия"
  - document: SP_17_13330_2017
    topic: "кровли"
    verified_changes: [1,2,3,4,5]
  - rule: "Состав пола, кровли и отделки не назначать только из библиотеки BIM: проверять назначение, влажностный режим, нагрузки, пожарные, акустические и теплотехнические требования."

site_and_parking:
  - document: SP_42_13330_2026
    status: active_for_target_2027
    effective_from: 2026-07-12
    replaces: SP_42_13330_2016
  - document: SP_113_13330_2023
    topic: "стоянки автомобилей"
    verified_changes: [1,2,3]
    target_2027_status: use

mixed_use:
  - document: SP_160_1325800_2014
    topic: "многофункциональные здания и комплексы"
    scope_note: "Перед применением проверить область действия и все актуальные изменения."

agent_logic:
  - "Высота этажа не равна высоте помещения в чистоте. Хранить отдельно отметки перекрытий, толщину конструкций, пол/потолок и чистую высоту."
  - "Не принимать 3000 мм как универсальную высоту этажа или помещения."
  - "До назначения ограждающих конструкций определить климатический подрайон, влажностный режим и функциональное назначение помещения."
  - "Перед общей нормой проверять специальный СП для функционального назначения объекта."
  - "Генплан в профиле 2027 проверять по СП 42.13330.2026."
  - "Для каждой нормы дополнительно применять переходы из target_2027.yaml."

sources:
