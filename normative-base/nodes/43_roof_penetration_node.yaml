checked_at: 2026-10-02
target_profile: RU_2027_PLUS
package: ROOF_NODE_ENGINEERING
node_family: penetration
purpose: executable_node_for_verified_roof_penetrations_without_invented_openings_or_flashings

applicability:
  host: roof_plane_or_roof_build_up
  penetration_classes:
    - ventilation_duct
    - smoke_exhaust
    - plumbing_vent
    - flue_or_chimney
    - cable_or_pipe_service
    - roof_hatch
    - skylight_or_roof_window
    - other_verified_system

required_inputs:
  - roof_plane_guid
  - penetration_class
  - penetration_host_and_axis
  - approved_opening_geometry
  - structural_opening_approval_reference
  - covering_system_id
  - penetration_product_or_project_detail_reference
  - fire_separation_requirement_if_applicable
  - thermal_air_vapor_contours
  - underroof_water_control_layer
  - ventilation_mode

routing:
  - id: roof.penetration.structural_opening_gate
    automation: true
    when: {penetration_cuts_structural_member_or_panel: true}
    result: require_KR_opening_and_trimmer_detail
  - id: roof.penetration.product_route
    automation: true
    when: {penetration_has_manufacturer_system: true}
    select: manufacturer_verified_penetration_adapter
  - id: roof.penetration.project_detail_route
    automation: true
    when: {penetration_has_manufacturer_system: false, verified_project_detail_present: true}
    select: verified_project_penetration_detail

rules:
  - id: roof.penetration.no_unapproved_cut
    automation: true
    statement: "Не создавать отверстие, подрезку стропил, ферм, прогонов, панелей, ЛСТК-профилей или обрешетки, влияющей на несущую работу, без утвержденного КР решения."
    result_on_missing: structural_penetration_not_approved
  - id: roof.penetration.no_generic_flashing
    automation: true
    statement: "Размеры фартука, манжеты, проходного элемента, прижимной планки, крепежа и уплотнений не выводятся из типовой практики; требуется проверенная система изделия или проектный узел."
    result_on_missing: roof_required_manufacturer_detail_missing
  - id: roof.penetration.water_diversion
    automation: true
    statement: "Над проходкой должен существовать подтвержденный путь отвода наружной и подкровельной воды вокруг проема с возвратом на водоотводящую поверхность ниже проходки."
    result_on_failure: roof_water_path_unresolved
  - id: roof.penetration.envelope_seal
    automation: validation_only
    statement: "Воздухо-, паро- и теплоизоляционный контуры должны быть согласованно замкнуты на проходку; наружная гидроизоляция не считается автоматически воздухонепроницаемым или парорегулирующим слоем."
  - id: roof.penetration.fire_gate
    automation: conditional
    when: {penetration_requires_fire_separation_or_combustible_clearance: true}
    statement: "Противопожарная разделка, расстояния до горючих материалов и огнезаделка принимаются только из применимого нормативного/сертифицированного решения для конкретной проходки; универсальное значение не подставлять."
    result_on_missing: roof_fire_gate_unresolved
  - id: roof.penetration.ventilation_path
    automation: validation_only
    statement: "Проходка не должна перекрывать требуемый подкровельный вентиляционный канал без подтвержденного обхода или отдельного решения."
    result_on_failure: roof_ventilation_mode_unresolved

geometry_operations:
  - validate_penetration_class_and_host
  - create_opening_only_from_approved_geometry
  - reference_KR_trimmer_or_local_reinforcement_if_required
  - apply_verified_penetration_adapter
  - divert_covering_and_underroof_water_paths
  - join_air_vapor_thermal_contours_to_penetration_system
  - preserve_or_reroute_ventilation_path
  - attach_fire_detail_reference_if_applicable

postconditions:
  - opening_geometry_matches_approved_reference
  - no_structural_member_cut_without_KR
  - penetration_adapter_verified
  - water_path_resolved
  - envelope_contours_checked
  - ventilation_path_resolved
  - fire_gate_resolved_when_applicable
