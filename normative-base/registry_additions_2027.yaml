checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Дополнения и уточнения к registry.yaml для документов, введенных в rule-файлы после первого прохода. Загружается после registry.yaml; при совпадении id уточняет revision metadata, но не меняет идентичность документа."

policy:
  - "Добавлять запись только после проверки официальной карточки Росстандарта."
  - "verified_changes означает подтвержденный состав изменений на дату checked_at, а не утверждение, что каждый пункт документа изменен."
  - "Если изменение утверждено, но дата введения отсутствует и нельзя доказать действительность, не переводить его числовые правила в auto."
  - "Если новый СП официально заменил старый, старую редакцию помечать superseded и запрещать как текущий источник для профиля 2027+."
  - "Этот файл должен быть позже механически слит с registry.yaml после проверки на дубли идентичности."

