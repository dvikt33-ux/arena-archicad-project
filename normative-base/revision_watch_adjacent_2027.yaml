checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Контроль официальных ревизий смежных КР/ПОС/инженерных/пожарных СП, которые архитектурный агент не рассчитывает самостоятельно, но обязан учитывать при координации модели 2027+."

policy:
  - "Этот файл не дает архитектурному агенту права рассчитывать конструкции или инженерные системы."
  - "Если смежный раздел проекта использует revision_level ниже указанного, соответствующая координация BIM блокируется до актуализации профильным специалистом."
  - "Отложенные части изменений, официально вводимые 01.03.2027, считаются применимыми для целевого профиля 2027+."
  - "Если новый СП заменил прежний документ, совпадение номера изменения старого СП не считается достаточным: проверяется document identity."
  - "Поправка без нового номера изменения может быть обязательной частью текущего текста и должна храниться отдельно от revision_level."

