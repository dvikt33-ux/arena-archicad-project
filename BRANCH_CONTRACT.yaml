contract_version: 1
branch: pd-expertise-v1
role: project_documentation_and_expertise_readiness
baseline:
  branch: normative-base-v1
  commit: b99fba7449d4338924c5ef0761a2b59eb3890592
  policy: "Normative rules and NODE_ID definitions are inherited from the baseline; do not silently diverge."

allowed_scope:
  - project_documentation_model
  - architectural_and_planning_decisions
  - normative_compliance_traceability
  - fire_accessibility_sanitary_and_functional_checks
  - cross_discipline_coordination_requirements
  - design_input_register
  - expertise_comment_tracking
  - PD_release_package

forbidden_scope:
  - construction_detail_invention_without_approved_project_inputs
  - reinforcement_or_structural_dimension_guessing
  - manufacturer_system_geometry_without_verified_source
  - claiming_positive_expertise_conclusion_without_actual_external_conclusion
  - branch_specific_rewrite_of_common_normative_rules_without_sync_to_normative_base_v1

required_inputs_for_release:
  - current_normative_baseline_revision
  - approved_project_brief_and_site_inputs
  - current_AR_revision
  - current_KR_revision_where_structural_geometry_is_used
  - current_engineering_coordination_revisions_where_interfaces_exist
  - fire_and_accessibility_checks
  - unresolved_issue_register

release_states:
  - draft
  - coordinated
  - PD_preflight_passed
  - ready_for_expertise_submission
  - expertise_comments_received
  - expertise_comments_resolved
  - positive_expertise_conclusion_recorded

hard_fail:
  - normative_baseline_stale
  - required_design_input_missing
  - unresolved_blocking_normative_issue
  - unresolved_cross_discipline_collision
  - AR_KR_or_engineering_revision_mismatch
  - undocumented_manual_override

sync_policy:
  normative_source_of_truth: normative-base-v1
  pull_normative_changes_before_release: true
  breaking_NODE_ID_change_requires_explicit_migration: true
  PD_changes_that_modify_common_normative_logic_must_be_upstreamed: true

handoff_to_RD:
  target_branch: rd-working-docs-v1
  require:
    - PD_release_revision
    - approved_or_current_AR_geometry
    - approved_KR_and_engineering_inputs_for_executed_interfaces
    - issue_register_with_zero_blocking_items_for_transferred_scope
  output:
    - PD_revision_id
    - model_reference
    - approved_node_and_system_references
    - unresolved_nonblocking_items
