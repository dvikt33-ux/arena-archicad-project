coordination_rules:
  - id: slab.table_membership
    auto_rule: true
    source_clause: "4.4, table 1"
    statement: "Координационные длина и ширина сборной плиты должны выбираться из рядов/типоразмеров ГОСТ 26434-2025 для соответствующего типа."
  - id: slab.PB_widths
    auto_rule: true
    source_clause: "table 1 note 4"
    applies_to: ["1.5PB","1.6PB","1.8PB","2.2PB","2.65PB","3PB","3.2PB","3.3PB","4PB","4.5PB","5PB"]
    coordination_widths_mm: [1000,1200,1500]
  - id: slab.PKT_ranges
    auto_rule: false
    source_clause: "table 1 note 2"
    statement: >-
      Для 1PKT/2PKT/3PKT координационная длина: 3600..6600 мм с шагом 300 мм,
      а также 7200 и 7500 мм; координационная ширина: 2400..3600 мм с шагом 300 мм.
  - id: slab.PKK_ranges
    auto_rule: false
    source_clause: "table 1 note 3"
    statement: >-
      Для 1PKK/2PKK/3PKK координационная длина: 2400..6600 мм с шагом 300 мм;
      координационная ширина: 4800..6600 мм с шагом 300 мм, а также 7200 мм.

modeling_logic:
  - "Не создавать произвольную длину/ширину сборной плиты, если выбран нормативный тип: валидировать по таблице ГОСТ."
  - "Не путать координационный размер с конструктивным размером изделия; зазоры и допуски должны учитываться отдельно."
  - "Не 'подрезать' пустотную плиту в BIM как обычный прямоугольник без подтверждения стандарта/ТУ изготовителя и конструктивного решения."
  - "Не назначать несущую способность, класс бетона, армирование и расчетную нагрузку только по геометрическому типу плиты."
  - "Не назначать глубину опирания универсальным числом: она зависит от конструкции, материала опоры, расчетов и требований конкретной системы."
  - "При выборе многопустотной плиты дополнительно применять действующий ГОСТ 9561-2025 с поправкой ИУС 6-2026."

