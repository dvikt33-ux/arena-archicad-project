document: GOST_28984_2011
checked_at: 2026-09-30
target_profile: RU_2027_PLUS
scope: buildings_and_structures_general

modules:
  rules:
    - id: modular.base_module
      automation: auto
      source_clause: "5.1"
      statement: "Основной модуль M = 100 мм."
      values: {M_mm: 100}
      dimension_semantics: coordination

    - id: modular.multimodules
      automation: auto
      source_clause: "5.2.1"
      statement: "Укрупненные модули: 60M, 30M, 15M, 12M, 6M, 3M."
      values_mm: [6000,3000,1500,1200,600,300]
      dimension_semantics: coordination

    - id: modular.submodules
      automation: conditional
      source_clause: "5.2.2"
      statement: "Когда основной модуль невозможно применить для размеров меньше M, стандарт предусматривает субмодули 1/2M, 1/4M, 1/5M."
      values_mm: [50,25,20]
      dimension_semantics: coordination

    - id: modular.compatible_groups
      automation: validation_only
      source_clause: "5.9.1-5.9.2"
      statement: >-
        Для совместимых модульных сеток стандарт задает полные группы M-3M-6M-12M-60M и
        M-3M-15M-30M-60M; неполные группы 3M-6M-12M и 15M-30M-60M выбирают в зависимости
        от характера планировки и конструктивной системы.

preferred_uses:
  rules:
    - id: modular.frames_preferred
      automation: validation_only
      source_clause: "5.11"
      statement: >-
        Шаги каркасных зданий и соответствующие длины плит, балок и ферм рекомендуется
        преимущественно принимать кратными 60M и 30M, для отдельных видов зданий также 12M и 15M.
      note: "Это предпочтительная координация, а не разрешение выбирать пролет без расчета КР."

    - id: modular.openings_piers_preferred
      automation: validation_only
      source_clause: "5.12"
      statement: >-
        Мультимодули 3M и 6M предназначены преимущественно для членения конструктивных элементов,
        размеров проемов и простенков наружных стен, размещения перегородок и некоторых шагов.
      conflict_policy: "Пожарный/конструктивный/доступный/светотехнический минимум имеет приоритет над модульным округлением."

    - id: modular.sections_M_halfM
      automation: validation_only
      source_clause: "5.13"
      statement: >-
        Основной модуль M и субмодуль 1/2M являются предпочтительными для координационных размеров
        сечений колонн, балок, толщин стен и плит перекрытий, членения фасадов/интерьеров,
        облицовочных изделий и оборудования.
      dimension_semantics: coordination

    - id: modular.partitions_internal_doors
      automation: validation_only
      source_clause: "5.14"
      statement: >-
        Для расстановки и размеров ненесущих перегородок и проемов внутренних дверей, а также
        некоторых доборных/крайних элементов допускается применять M и 1/2M при условии
        экономической целесообразности и совместимости примыкающих элементов.

vertical_coordination:
  rules:
    - id: modular.storey_height
      automation: validation_only
      source_clause: "6.6"
      statement: >-
        Модульные координационные высоты этажей, а также соответствующие вертикальные размеры
        колонн, стеновых панелей, больших проемов и ворот назначают по 3M/6M; малые проемы,
        окна и двери — кратными M.
      dimension_semantics: coordination
      conflict_policy: "Не смешивать координационную высоту этажа с минимальной чистой высотой помещения по функциональному СП."

    - id: modular.service_ceiling_zone
      automation: conditional
      source_clause: "6.8"
      statement: >-
        Минимальную координационную высоту от низа подвесного потолка до низа перекрытия при
        размещении в этой зоне инженерных коммуникаций/оборудования принимают 3M; больший размер
        назначают с использованием M.
      values: {coordination_min_mm: 300}
      dimension_semantics: coordination
      conflict_policy: "Фактическая требуемая инженерная зона может быть больше по ОВ/ВК/ЭОМ; 300 мм не является универсальной достаточной высотой коммуникационного пространства."

modular_grid_breaks:
  rules:
    - id: modular.grid_break_nonmodular_element
      automation: conditional
      source_clause: "5.8"
      statement: >-
        Модульную сетку допускается прерывать для размещения немодульного элемента, например
        разделительного элемента/противопожарной преграды; вставка может быть модульной или немодульной.
      conflict_policy: "Не деформировать обязательную противопожарную/деформационную зону ради сохранения непрерывной модульной сетки."

axis_binding:
  rules:
    - id: axis.binding_definition
      automation: validation_only
      source_clause: "7.1-7.3"
      statement: >-
        Привязка конструктивного элемента определяется расстоянием от координационной оси до
        координационной плоскости элемента либо геометрической оси его сечения. Конструктивная
        грань и координационная плоскость не обязаны совпадать.

    - id: axis.internal_bearing_wall
      automation: conditional
      source_clause: "7.5.1"
      statement: "Геометрическую ось внутренней несущей стены, как правило, совмещают с координационной осью."
      dimension_semantics: axis

    - id: axis.external_bearing_wall
      automation: conditional
      source_clause: "7.5.2"
      statement: >-
        Внутреннюю координационную плоскость наружной несущей стены смещают внутрь здания от
        координационной оси на половину координационного размера толщины параллельной внутренней
        несущей стены либо на размер, кратный M, 1/2M или 1/5M. При опирании плит на всю толщину
        несущей стены допускается совмещение наружной координационной плоскости стены с осью.
      dimension_semantics: coordination
      note: "Не превращать это правило в одну универсальную привязку 100/200/250 мм без выбранной конструктивной схемы."

    - id: axis.nonmodular_wall_adjustment
      automation: validation_only
      source_clause: "7.5.3"
      statement: >-
        Для стен из немодульных материалов допускается корректировать привязку ради применения
        унифицированных типоразмеров плит, лестниц, окон, дверей и других элементов модульной системы.

    - id: axis.external_selfbearing_curtain_wall
      automation: conditional
      source_clause: "7.6"
      statement: >-
        Внутреннюю координационную плоскость наружной самонесущей/навесной стены совмещают с
        координационной осью либо смещают с учетом привязки несущих конструкций и примыканий.

    - id: axis.frame_middle_columns
      automation: conditional
      source_clause: "7.7.1"
      statement: "В каркасных зданиях геометрические оси колонн средних рядов, как правило, совмещают с координационными осями; специальные зоны являются исключениями."
      dimension_semantics: axis

    - id: axis.frame_edge_columns
      automation: conditional
      source_clause: "7.7.2"
      statement: >-
        Для крайних рядов колонн выбор привязки определяется унификацией крайних и рядовых
        элементов: допускается совмещение с координационной осью геометрической оси колонны либо
        внешней координационной плоскости колонны.

    - id: axis.frame_end_offset
      automation: conditional
      source_clause: "7.7.3"
      statement: "В торцах здания допускается смещать геометрические оси колонн внутрь на k, кратное 3M и при необходимости M или 1/2M."
      dimension_semantics: coordination

    - id: axis.double_grid_special_zones
      automation: conditional
      source_clause: "7.8"
      statement: >-
        В зонах перепада высот, деформационных швов и вставок расстояния между парными осями или
        смещения к одинарной оси принимают кратными 3M и при необходимости M или 1/2M в случаях,
        установленных п.7.8.
      dimension_semantics: coordination

agent_logic:
  - "НЕ округлять все размеры модели к 100 мм автоматически."
  - "Сначала определить конструктивную систему и изделия, затем выбрать совместимую модульную сетку."
  - "Различать координационную ось, геометрическую ось сечения, координационную плоскость и фактическую грань элемента."
  - "Если изделие имеет собственный нормативный ряд размеров, проверять его по стандарту изделия, а не только по M."
  - "Разрыв модульной сетки допустим и иногда необходим; немодульная вставка сама по себе не является ошибкой."
  - "Для проемов/простенков 3M/6M являются предпочтительной координацией, но не отменяют пожарные, конструктивные, светотехнические и доступные размеры."
  - "Не использовать учебную фиксированную привязку стены/колонны, если она не следует из выбранной конструктивной системы и п.7 ГОСТ 28984."

source_url: https://protect.gost.ru/gost/details/1c17643f-bf43-456f-a27c-dab6875a1514
