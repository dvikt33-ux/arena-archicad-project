checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Точный каталог номинальных размеров керамического кирпича, камней и доборных камней по ГОСТ 530-2012 для BIM-библиотеки и кладочной раскладки, без подмены конструктивного расчета и технологии шва."

