routing_rules:
  - id: sanitary.route.service_facilities_2027
    statement: "Для объектов и услуг, входящих в область СП 2.1.4284-26, санитарную проверку проекта 2027+ маршрутизировать на СП 2.1.4284-26, а не на СП 2.1.3678-20."
    automation: validation_only

  - id: sanitary.route.food_retail_2027
    statement: "Для торговли пищевой продукцией в профиле 2027 использовать СП 2.3.6.4281-26, а не утративший силу СП 2.3.6.3668-20."
    automation: validation_only

  - id: sanitary.route.foodservice_2027
    statement: "Для предприятий общественного питания в профиле 2027 использовать СанПиН 2.3/2.4.4282-26. Ссылки СП 464 и иных строительных СП на СанПиН 3590-20 не являются основанием применять отмененный акт."
    automation: validation_only

  - id: sanitary.block.repealed_3678
    statement: "Любая машинная норма, которая в целевом профиле 2027 использует СП 2.1.3678-20 как действующий источник, должна быть заблокирована до повторной привязки к действующему санитарному акту."
    automation: auto

  - id: sanitary.block.repealed_food_retail_3668
    statement: "Любая машинная норма профиля 2027 со ссылкой на СП 2.3.6.3668-20 как действующий источник блокируется и маршрутизируется на СП 2.3.6.4281-26."
    automation: auto

  - id: sanitary.block.repealed_foodservice_3590
    statement: "Любая машинная норма профиля 2027 со ссылкой на СанПиН 2.3/2.4.3590-20 как действующий источник блокируется и маршрутизируется на СанПиН 2.3/2.4.4282-26."
    automation: auto

  - id: sanitary.block_3685_after_2027_03_01
    statement: "После 01.03.2027 СанПиН 1.2.3685-21 не может использоваться как действующее основание числового архитектурного правила. До появления утвержденного преемника такие правила получают blocked_pending_sanitary_replacement."
    automation: auto

  - id: sanitary.draft_replacement_not_authoritative
    statement: "Проект СанПиН 1.2.-26 от 31.07.2026 хранится только как watch item и не является источником проектных чисел."
    automation: auto

