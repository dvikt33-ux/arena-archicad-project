checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Система точности геометрических параметров: отделить проектный размер, функциональный допуск, технологический допуск, фактическое измерение и расчет собираемости."

current_documents:
  - {document: GOST_R_58938_2020, title: "Система обеспечения точности геометрических параметров в строительстве. Основные положения", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58939_2020, title: "Правила выполнения измерений. Элементы заводского изготовления", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58941_2020, title: "Правила выполнения измерений. Общие положения", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58942_2020, title: "Технологические допуски", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58943_2020, title: "Контроль точности", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58944_2020, title: "Функциональные допуски", status: active, effective_from: 2021-01-01}
  - {document: GOST_R_58945_2020, title: "Правила выполнения измерений параметров зданий и сооружений", status: active, effective_from: 2021-01-01}
  - {document: GOST_21780_2006, title: "Расчет точности", status: active, effective_from: 2008-01-01}

