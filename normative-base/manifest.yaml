manifest_version: 6
checked_at: 2026-09-30
target_profile: RU_2027_PLUS

load_order:
  - priority: 1
    file: target_2027.yaml
    role: future confirmed transitions and 2027 overrides
  - priority: 2
    file: revision_watch_2027.yaml
    role: official latest revision levels
  - priority: 3
    file: registry.yaml
    role: document identity and audit-date status
  - priority: 4
    file: schema/dimension_selection_policy.yaml
    role: dimension semantics and conflict policy
  - priority: 5
    files: rules/*.yaml
    role: verified architectural and BIM rules
  - priority: 6
    file: AUDIT.md
    role: human-readable audit trail

precedence_rules:
  - target_2027.yaml overrides current-date status when an officially confirmed transition applies to 2027.
  - revision_watch_2027.yaml invalidates a rule file whose claimed revision is below official_latest_change.
  - Special functional, fire or accessibility requirements apply within their explicit scope before general rules.
  - Direct numeric requirements cannot be replaced by modular rounding.
  - Calculation requirements cannot be replaced by typical values.
  - Manufacturer or product geometry cannot be invented from common market sizes.
  - Draft or unapproved future documents never become active rules.
  - Expired rules without official replacement produce blocked or unresolved state.

rule_files:
  - 00_modular_coordination.yaml
  - 01_masonry.yaml
  - 02_precast_floor_slabs.yaml
  - 03_egress_and_accessibility.yaml
  - 04_architectural_baseline.yaml
  - 05_openings_windows_doors.yaml
  - 06_masonry_units_current.yaml
  - 07_guardrails_roofs.yaml
  - 08_structural_design_boundaries.yaml
  - 09_engineering_coordination.yaml
  - 10_accessibility.yaml
  - 11_lighting_insolation_2027.yaml
  - 12_floors_wet_zones.yaml
  - 13_fire_site_access.yaml
  - 14_parking_geometry.yaml
  - 15_roofs.yaml
  - 16_stair_geometry.yaml
  - 17_vertical_transport.yaml
  - 18_facade_fire_openings.yaml
  - 19_reinforced_concrete_lintels.yaml

hard_fail_states:
  - yaml_parse_error
  - duplicate_rule_id
  - missing_target_profile
  - source_status_unknown
  - rule_revision_below_official_latest
  - rule_expired_for_target
  - future_replacement_is_only_draft
  - required_calculation_missing
  - required_manufacturer_data_missing
  - dimension_semantics_unknown
  - object_classification_missing

release_gate:
  require:
    - all YAML files parse successfully
    - no duplicate machine rule ids across rules
    - no automatic rule references a superseded clause for target 2027
    - numeric automatic rules have source document and clause or table
    - future transitions have official effective dates
    - core rule files match revision_watch_2027.yaml
    - draft normative documents are never marked active
    - clear dimensions are validated as clear dimensions
    - pending topics remain fail-closed
