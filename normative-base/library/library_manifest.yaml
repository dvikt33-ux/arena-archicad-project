known_safety_gaps:
  - id: SP20_10_2_CURRENT_TEXT_CONFLICT
    status: open
    severity: high
    statement: >-
      Current public renderings used in the 2026-10-03 audit conflict on the operative text
      of SP 20.13330.2016 clause 10.2. Official revision metadata is verified, but clause 10.2
      remains blocked until the actual current locator is read directly.
    effect: no_automatic_snow_value_from_clause_10_2
  - id: SP55_9_18_DIRECT_TEXT_NOT_VERIFIED
    status: open
    severity: high
    statement: >-
      Official amendment metadata is verified, while secondary current copies are insufficient
      under project evidence policy to prove the exact current text of clause 9.18.
    effect: no_production_daylight_ratio_from_SP55_9_18
  - id: SP402_LOCATOR_DURABLE_TRACEABILITY
    status: open
    severity: high
    statement: >-
      Exact SP402 numeric production rules exist in rules/100_residential_gas_architectural_interfaces_2027.yaml,
      but clauses 5.1, 5.5, 5.9-5.12 and 5.16 are not yet linked to a durable locator-level evidence audit.
      Library state is existing_rule_traceability_pending and must not be interpreted as PASS.
    effect: no_new_library_promotion_from_SP402_until_durable_evidence_migration
  - id: GOST25772_TABLE_TRACEABILITY_AND_CORRECTION_EFFECT
    status: open
    severity: high
    statement: >-
      rules/07_guardrails_roofs.yaml contains exact Table 1/Table 3 values from GOST 25772-2025.
      Rosstandart confirms a correction effective 2026-06-17 but its public card does not reveal
      the correction text. These tables remain existing_rule_traceability_pending in the library.
    effect: no_new_library_promotion_from_GOST25772_tables_until_correction_and_locator_text_are_verified
