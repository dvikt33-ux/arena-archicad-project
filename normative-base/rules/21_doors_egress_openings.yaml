checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Эвакуационные двери и выходы: размер в свету, высота, ширина, направление открывания, двупольные двери, турникеты и конфликт с доступностью."

revision_dependencies:
  - {document: SP_1_13130_2020, verified_changes: [1,2,3]}
  - {document: SP_59_13330_2020, verified_changes: [1,2,3,4]}
  - {document: GOST_475_2026, effective_from: 2026-10-01, scope: "wood and combined non-special doors"}

semantics:
  - id: door.egress.dimensions_are_clear
    source: {document: SP_1_13130_2020, clause: "4.1.4"}
    automation: auto
    dimension_semantics: clear
    statement: "Размеры эвакуационных путей и выходов по СП 1, если специально не оговорено иное, задаются в свету. Размер в свету — минимальное расстояние между выступающими конструкциями измеряемого элемента."

exit_height:
  source: SP_1_13130_2020
  rules:
    - id: door.egress.general_clear_height
      clause: "4.2.18"
      automation: conditional
      dimension_semantics: clear
      statement: "Высота эвакуационного выхода в свету, как правило, не менее 1,9 м."
      values: {general_min_mm: 1900}

    - id: door.egress.nonoccupied_clear_height_exception
      clause: "4.2.18"
      automation: conditional
      dimension_semantics: clear
      statement: "Для помещений без постоянного пребывания людей и помещений с одиночными рабочими местами допускается высота эвакуационного выхода не менее 1,8 м."
      values: {min_mm: 1800}
      requires_object_classification: true

    - id: door.egress.reconstruction_height_exception
      clause: "4.2.18"
      automation: manual_calculation
      dimension_semantics: clear
      statement: "Для реконструируемых объектов, когда работы не затрагивают выход, и для памятников допускается сохранение меньшей высоты, но не менее 1,5 м, только с предусмотренным нормой обоснованием."
      values: {absolute_exception_min_mm: 1500}
      requires_calculation: true
      conflict_policy: "Не применять к новому строительству."

exit_width:
  source: SP_1_13130_2020
  rules:
    - id: door.egress.general_clear_width
      clause: "4.2.19"
      automation: conditional
      dimension_semantics: clear
      statement: "Ширина эвакуационного выхода в свету, как правило, не менее 0,8 м."
      values: {general_min_mm: 800}

    - id: door.egress.small_service_room_exception
      clause: "4.2.19"
      automation: conditional
      dimension_semantics: clear
      statement: "Из технических помещений и кладовых площадью не более 20 м² без постоянных рабочих мест, туалетных и душевых кабин, санузлов, а также помещений с одиночными рабочими местами допускается выход не менее 0,6 м."
      values: {min_mm: 600, max_service_room_area_m2: 20}
      requires_object_classification: true
      conflict_policy: "Если действует более строгое требование МГН или специального функционального раздела, применять его."

    - id: door.egress.fifty_or_more
      clause: "4.2.19"
      amendment: 1
      automation: conditional
      dimension_semantics: clear
      statement: "При числе эвакуирующихся через выход 50 человек и более минимальная ширина эвакуационного выхода из помещения — 1,2 м."
      values: {trigger_people_min: 50, min_clear_width_mm: 1200}
      requires_calculation: true
      audit_note: "Формулировка '50 человек и более' подтверждена текстом Изменения №1 к СП 1.13130.2020."

stair_exit_width:
  source: SP_1_13130_2020
  rules:
    - id: door.egress.stair_exit_width
      clause: "4.2.20"
      automation: conditional
      dimension_semantics: clear
      statement: "Ширина выхода из лестничной клетки наружу или в вестибюль должна быть не менее требуемой ширины пути по маршу лестницы; для Ф2.1, Ф2.2 и Ф4.1 действует специальное условие пункта."
      requires_object_classification: true
      requires_calculation: true

    - id: door.egress.multiple_stair_exits_each_min
      clause: "4.2.20"
      automation: conditional
      dimension_semantics: clear
      statement: "Если требуемая ширина выхода из лестничной клетки 1,2 м и более и предусмотрено несколько выходов, их суммарная ширина должна быть не меньше требуемой, а каждый выход — не менее 0,9 м."
      values: {trigger_required_width_mm: 1200, each_exit_min_mm: 900}

external_landing:
  - id: door.egress.external_landing_plan_dimensions
    source: {document: SP_1_13130_2020, clause: "4.2.21", amendment: 1}
    automation: conditional
    dimension_semantics: clear
    statement: "Перед наружной дверью-эвакуационным выходом предусматривать горизонтальную входную площадку, у которой и длина, и ширина не менее 1,5 ширины полотна наружной двери."
    formula:
      min_landing_length: "1.5 * exterior_door_leaf_width"
      min_landing_width: "1.5 * exterior_door_leaf_width"
    notes:
      - "Изменение №1 специально дополнило исходную формулировку словами 'длиной и'; проверять обе плановые размерности площадки."
      - "Ширина полотна двери не тождественна ширине прохода в свету; оба параметра должны храниться отдельно."
      - "Если площадка входит в доступный маршрут МГН, дополнительно проверять СП 59.13330.2020 и принимать все применимые ограничения одновременно."

opening_direction:
  - id: door.egress.opening_direction
    source: {document: SP_1_13130_2020, clause: "4.2.22"}
    automation: validation_only
    statement: "Двери эвакуационных выходов и двери на путях эвакуации в общем случае открываются по направлению выхода из здания; исключения пункта 4.2.22 проверять по классификации помещения и здания."

self_closing_and_smoke_control:
  - id: door.egress.smoke_control_self_closing
    source: {document: SP_1_13130_2020, clause: "4.2.24"}
    automation: conditional
    statement: "Двери эвакуационных выходов из помещений и коридоров, защищаемых противодымной вентиляцией, а также двери в перегородках, разделяющих коридоры, должны иметь самозакрывание и уплотнение в притворах в области применения пункта."
    requires_object_classification: true

  - id: door.egress.held_open_fire_release
    source: {document: SP_1_13130_2020, clause: "4.2.24"}
    automation: validation_only
    statement: "Если дверь с требуемым самозакрыванием должна эксплуатироваться открытой, предусматривать устройство автоматического закрывания при пожаре."

leaf_logic:
  - id: door.egress.double_leaf_passive_leaf
    source: {document: SP_1_13130_2020, clause: "4.2.27"}
    automation: auto
    dimension_semantics: clear
    statement: "У двупольной двери с зафиксированной пассивной створкой ширина эвакуационного выхода определяется только шириной прохода через активную створку."
    conflict_policy: "Нельзя суммировать ширину пассивной створки с активной."

  - id: door.egress.double_leaf_two_active
    source: {document: SP_1_13130_2020, clause: "4.2.27"}
    automation: conditional
    dimension_semantics: clear
    statement: "У двупольной двери с двумя активными створками ширина эвакуационного выхода определяется проходом через обе активные створки; требуется координация последовательного закрывания полотен."

  - id: door.egress.antipanic_active_leaf
    source: {document: SP_1_13130_2020, clause: "4.2.27"}
    automation: validation_only
    statement: "Если требуется устройство типа «Антипаника», оно устанавливается на активных дверных полотнах."

turnstiles:
  - id: door.egress.turnstile_clear_width
    source: {document: SP_1_13130_2020, clause: "4.2.28"}
    automation: conditional
    dimension_semantics: clear
    statement: "Проход через управляемое преграждающее устройство в вестибюле/холле — не менее 0,7 м, а при эвакуации МГН — не менее 0,9 м; суммарная ширина проходов должна быть не меньше требуемой ширины пути эвакуации."
    values: {general_min_mm: 700, mgn_min_mm: 900}

  - id: door.egress.turnstile_gate_over_50
    source: {document: SP_1_13130_2020, clause: "4.2.28"}
    automation: conditional
    statement: "При эвакуации через турникеты более 50 человек перед эвакуационными выходами предусматривать распашные калитки шириной не менее ширины соответствующих выходов."
    values: {trigger_people_over: 50}
    requires_calculation: true

accessibility_intersection:
  - id: door.accessible.route_clear_width
    source: {document: SP_59_13330_2020, clause: "6.2.4"}
    automation: conditional
    dimension_semantics: clear
    statement: "На доступном маршруте внутренний дверной проем для МГН в общем случае должен обеспечивать не менее 0,9 м в свету."
    values: {general_min_clear_width_mm: 900}
    conflict_policy: "Если дверь одновременно эвакуационная и доступная, выполнять одновременно СП 1 и СП 59; использовать применимое более строгое ограничение после фильтрации области действия."

BIM_required_parameters:
  - door_type
  - structural_opening_width
  - structural_opening_height
  - frame_outer_width
  - frame_outer_height
  - leaf_count
  - each_leaf_width
  - active_leaf_flags
  - clear_opening_width_at_normal_use
  - clear_opening_height
  - threshold_height
  - swing_direction
  - self_closer_required
  - hold_open_device
  - smoke_seal_required
  - antipanic_required
  - room_occupancy
  - calculated_evacuating_people
  - accessible_route_status
  - stair_exit_status
  - exterior_landing_clear_length_mm
  - exterior_landing_clear_width_mm

agent_logic:
  - "Никогда не считать библиотечную дверь с названием D900 автоматически проходом 900 мм в свету."
  - "После установки дверного объекта вычислять фактический свободный проход с учетом коробки, створок и режима эксплуатации."
  - "Строительный проем, наружный габарит коробки, ширина полотна и размер в свету — разные параметры."
  - "Исключение 600 мм не применять к обычным помещениям и не использовать на доступном маршруте, если СП 59 требует 900 мм."
  - "Для двупольной двери хранить состояние каждой створки active/passive; пассивную фиксированную створку не включать в расчет эвакуационной ширины."
  - "Наличие широкой коробки не компенсирует неправильное направление открывания, отсутствие самозакрывания или требуемой фурнитуры."
  - "Для наружного эвакуационного выхода проверять обе размерности входной площадки по п. 4.2.21 после Изменения №1."

sources:
  - "https://protect.gost.ru/sp/details/9fdcb635-708c-4c67-81a7-83e6baad9ab3"
  - "https://protect.gost.ru/sp/changesdetails/4b61ecb6-45d2-4938-8de2-d5bb5712e61d"
  - "https://protect.gost.ru/sp/changesdetails/de574ad5-67fc-4e31-a0a5-a793c94b1cc7"
  - "https://www.consultant.ru/document/cons_doc_LAW_351940/fb41af21ee5160adb0f0158d298622a82c4634f8/"
