checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Архитектурные правила вертикального транспорта: когда нужен лифт, какие параметры нельзя брать из старых методичек и какие габариты являются обязательными/рекомендуемыми."

revision_dependencies:
  - {document: SP_118_13330_2022, verified_changes: [1,2,3,4,5]}
  - {document: SP_59_13330_2020, verified_changes: [1,2,3,4]}
  - {document: SP_54_13330_2022, verified_changes: [1,2]}
  - {document: GOST_33984_1_2023, status: active, effective_from: 2024-11-01, replaces: GOST_33984_1_2016}
  - {document: GOST_33652_2019, status: active, corrections: ["IUS 8-2020", "IUS 5-2026"]}

public_buildings:
  source: SP_118_13330_2022
  rules:
    - id: vertical.public.passenger_lift_threshold
      clause: "5.13"
      automation: conditional
      statement: "Во всех проектируемых общественных зданиях пассажирские лифты предусматривают при отметке пола верхнего этажа 9,9 м и более от уровня пола первого этажа."
      values:
        upper_floor_level_threshold_mm: 9900
      dimension_semantics: level_finished
      exception: "Допускается не предусматривать лифт при надстройке существующего общественного здания мансардным этажом."

    - id: vertical.public.mgn_transport_selection
      clause: "5.13"
      automation: manual_calculation
      statement: >-
        Если помещения для МГН расположены выше или ниже этажа основного входа, выбор средств
        вертикального транспорта и необходимость их сочетания устанавливаются заданием на
        проектирование на основании СП 59.13330.
      requires_object_classification: true

    - id: vertical.public.lift_count
      clause: "5.14"
      automation: manual_calculation
      statement: "Число пассажирских лифтов определяют расчетом с учетом СП 1.13130 и СП 59.13330."
      requires_calculation: true

accessibility:
  source: SP_59_13330_2020
  rules:
    - id: vertical.accessible.cabin_current_rule
      clause: "6.2.14"
      amendment: 3
      automation: conditional
      statement: >-
        Применять пассажирские лифты с размерами кабины, обеспечивающими размещение пользователя
        кресла-коляски с сопровождающим лицом, в соответствии с ГОСТ 33652.
      note: >-
        Это актуальная редакция после Изменения №3. Не подставлять устаревший универсальный размер
        кабины 1100x1400 мм из старых редакций/методичек как действующее требование СП 59.
      requires_manufacturer_data: true

    - id: vertical.residential.recommended_cabins
      clause: "6.2.15"
      automation: validation_only
      statement: >-
        Для многоквартирных жилых зданий грузоподъемность и скорость выбирают по СП 54.13330.
        Для лифтов 630 и 1000 кг размеры кабин 1100x2100 или 2100x1100 мм являются рекомендуемыми,
        а не универсальным обязательным минимумом для каждого лифта.
      values:
        recommended_for_capacity_kg: [630,1000]
        recommended_cabin_sizes_mm:
          - [1100,2100]
          - [2100,1100]
      conflict_policy: "Не повышать рекомендацию до обязательного норматива. Требования доступности по 6.2.14 и ГОСТ 33652 проверять отдельно."

    - id: vertical.sport_wheelchair.cabin
      clause: "6.2.15"
      automation: conditional
      statement: >-
        На маршрутах спортсменов, использующих спортивные кресла-коляски, применять лифты с
        кабиной не менее 2000x1400 мм и шириной дверного проема 1,2 м.
      values:
        min_cabin_width_mm: 2000
        min_cabin_depth_mm: 1400
        min_door_opening_mm: 1200
      dimension_semantics: clear

    - id: vertical.spectator_lifts.calculation
      clause: "6.2.15"
      automation: manual_calculation
      statement: "На путях движения зрителей габариты и число лифтов рассчитывают согласно приложению А СП 59 и указанному в пункте профильному ГОСТ."
      requires_calculation: true
      note: "Не заменять расчет типовой кабиной."

lift_product_standards:
  - id: vertical.standard.general_lift_2023
    automation: validation_only
    statement: "Для новых пассажирских/грузопассажирских лифтов использовать действующий ГОСТ 33984.1-2023; ГОСТ 33984.1-2016 заменен с 01.11.2024."
    source:
      document: GOST_33984_1_2023
      clause: "scope/status"
      url: https://protect.gost.ru/gost/details/cc63967a-4b16-4f7d-bcc3-db74dd0decff

  - id: vertical.standard.accessibility_2019
    automation: validation_only
    statement: "Специальные требования доступности новых лифтов для инвалидов и других МГН проверять по действующему ГОСТ 33652-2019 с актуальными поправками, включая ИУС 5-2026."
    source:
      document: GOST_33652_2019
      clause: "scope/status"
      url: https://protect.gost.ru/gost/details/c476d6a7-a6bb-4dc5-8c2c-e2183e9df95f

BIM_parameters_required:
  - building_function
  - floor_finished_levels
  - top_floor_finished_level_relative_to_first_floor
  - accessible_floors
  - calculated_passenger_flow
  - lift_type
  - cabin_clear_dimensions
  - door_clear_opening
  - shaft_dimensions_from_selected_equipment
  - pit_depth_from_selected_equipment
  - overhead_dimension_from_selected_equipment
  - machine_room_or_machine_room_less_system
  - fire_service_requirement

architectural_coordination:
  - "Шахту, приямок, верхний этаж шахты и машинное помещение не назначать по усредненным библиотечным размерам: после определения требований выбирать реальное лифтовое оборудование/семейство и координировать с КР."
  - "Размер кабины не равен размеру шахты. Хранить их раздельно."
  - "Размер дверного строительного проема не равен чистому дверному проему лифта."
  - "Если требуется лифт для пожарных подразделений, применять отдельные пожарные требования и профильный стандарт; обычный пассажирский лифт не считать автоматически пожарным."
  - "При размещении лифтового холла совместно проверять эвакуацию, МГН, пожарные зоны/тамбур-шлюзы и ограждающие конструкции."

agent_logic:
  - "Не применять старый размер 1100x1400 мм как универсальную норму СП 59."
  - "Не считать рекомендуемые 1100x2100/2100x1100 обязательными для всех жилых лифтов."
  - "Не определять число лифтов только по этажности; выполнять расчет пассажиропотока и специальные проверки."
  - "Для общественного здания порог 9,9 м проверять по чистовым отметкам пола верхнего и первого этажей, а не по общей строительной высоте здания."
  - "Геометрию шахты и технические зоны фиксировать после выбора оборудования и данных производителя."

sources:
  - https://base.garant.ru/404976079/
  - https://e-ecolog.ru/docs/4jVmXiIOENfUb-K-FBdMh/full
  - https://protect.gost.ru/gost/details/cc63967a-4b16-4f7d-bcc3-db74dd0decff
  - https://protect.gost.ru/gost/details/c476d6a7-a6bb-4dc5-8c2c-e2183e9df95f
