execution_policy:
  selector_may_rank_candidates: true
  selector_may_finalize_structural_system_without_KR: false
  assembly_may_create_coordination_placeholder_before_KR: true
  assembly_may_create_approved_structural_geometry_only_from_KR: true
  reinforcement_generation: external_KR_only
  bearing_length_generation: external_KR_or_verified_product_system_only
  foundation_depth_width_thickness_generation: external_geotechnical_KR_only
  frame_joint_geometry_generation: external_KR_only
  stair_structural_geometry_generation: external_KR_only
  facade_anchor_geometry_generation: external_KR_or_verified_product_only
  cantilever_geometry_and_reinforcement_generation: external_KR_only
  railing_anchor_generation: external_KR_or_verified_product_only
  entrance_support_geometry_generation: external_geotechnical_KR_only
  deformation_joint_width_and_movement_generation: external_KR_only
  proprietary_joint_waterstop_sealant_firestop_generation: verified_product_or_project_detail_only
  opening_product_geometry_generation: verified_product_only
  lintel_and_opening_bearing_generation: external_KR_only
  mounting_joint_generation: verified_system_or_project_detail_only
  wall_envelope_component_generation: verified_system_and_calculation_only
  internal_partition_system_generation: verified_system_only
  internal_structural_wall_geometry_generation: external_KR_only
  shaft_geometry_generation: engineering_service_volume_plus_verified_enclosure_only
  engineering_penetration_generation: approved_engineering_geometry_only
  roof_member_geometry_generation: external_KR_only
  roof_connection_fastener_generation: external_KR_or_verified_product_only
  roof_covering_detail_generation: verified_code_and_product_adapter_only
  roof_structural_joint_generation: exact_KR_or_verified_product_only
  roof_wall_material_geometry_generation: verified_product_or_KR_only
  roof_wall_support_family_selection: verified_material_adapter_plus_KR_only
  roof_wall_assembly_package_selection: exact_wall_facade_roof_context_only
  roof_wall_contour_release: all_applicable_contours_must_resolve
  cold_attic_and_insulated_slope_are_not_interchangeable: true
  roof_support_belt_generation: exact_KR_only
  roof_mauerlat_generation: exact_KR_only
  chimney_fire_clearance_generation: verified_fire_and_product_detail_only
  roof_window_geometry_generation: verified_product_plus_KR_only
  archicad_package_execution_requires_readback: true
  working_documentation_release_requires_zero_blockers: true
  external_review_ready_may_not_claim_expertise_approval: true
