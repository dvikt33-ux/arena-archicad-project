<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Книжный трекер"><meta name="theme-color" content="#b46132"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Книжный трекер</title><style>
:root{--paper:#fff9ef;--ink:#54372e;--muted:#896b5b;--rust:#b85b2b;--burg:#843b36;--bg:#c99868}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(#ecd2ad,#c88e5d);min-height:100vh;padding:12px 0 calc(30px + env(safe-area-inset-bottom))}.app{width:min(940px,96vw);margin:auto}.card{background:rgba(255,249,239,.97);border:1px solid #9d735d66;border-radius:28px;box-shadow:0 18px 55px #5a2e1c2b;padding:28px 16px;position:relative}.card:after{content:"";position:absolute;inset:10px;border:1px solid #843b3677;border-radius:22px;pointer-events:none}h1{position:relative;z-index:1;margin:4px 0 6px;text-align:center;font:400 clamp(52px,9vw,80px)/1 "Brush Script MT","Segoe Script",cursive}.quoteBox{position:relative;z-index:2;max-width:720px;margin:0 auto 22px;text-align:center}.quote{min-height:62px;line-height:1.5;color:#725347}.quote small{display:block;margin-top:6px;color:#9a7b6c;font-size:11px}.qbtn,.btn,.heart{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}.qbtn{border:1px solid #6d4c3c33;background:#fff6e8;border-radius:999px;padding:8px 13px;color:#76584a}.form{position:relative;z-index:2;display:grid;gap:16px;background:#fffdf9d9;border:1px solid #8f65502b;border-radius:22px;padding:18px 14px}.field{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:end}.label{display:flex;gap:10px;align-items:center;font:400 26px/1.05 "Brush Script MT","Segoe Script",cursive}.icon{width:42px;height:42px;border:1px solid #6c4b3d33;border-radius:13px;display:grid;place-items:center;background:#fffaf1;font:21px system-ui}input,textarea{width:100%;border:0;border-bottom:1px dotted #95796a;background:transparent;color:var(--ink);outline:none;padding:10px 5px;font:16px Georgia,serif;border-radius:0}textarea{min-height:135px;resize:vertical;line-height:2;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#95796a33 32px)}.dates{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:14px;border-top:1px dotted #73594a55}.rating{padding-top:14px;border-top:1px dotted #73594a55}.hearts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.heart{width:52px;height:52px;border-radius:50%;border:1px solid #843b3655;background:#fffaf3;color:var(--burg);font:32px/1 Georgia}.heart.on{background:var(--burg);color:white}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border-radius:999px;padding:13px 22px;min-height:48px;font-weight:700;border:0}.save{background:var(--rust);color:white}.clear{background:transparent;border:1px solid #68473844;color:var(--ink)}#status{text-align:center;min-height:20px;font-size:13px;font-weight:bold}.runtime{position:relative;z-index:2;margin:12px auto 0;max-width:850px;text-align:center;padding:9px 12px;border-radius:12px;background:#fff0d8;color:#7a4a28;font-size:12px}.runtime.ok{background:#eef4e8;color:#52613c}.decor{text-align:center;font-size:27px;letter-spacing:.13em;padding-top:20px;position:relative;z-index:2}.library{margin-top:20px;background:rgba(255,249,239,.97);border:1px solid #9d735d66;border-radius:28px;box-shadow:0 18px 55px #5a2e1c2b;padding:22px 16px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.library h2{font:400 clamp(42px,7vw,60px)/1 "Brush Script MT","Segoe Script",cursive;margin:0}.count{font-size:13px;color:var(--muted)}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}.empty{text-align:center;grid-column:1/-1;padding:28px;border:1px dashed #72534455;border-radius:16px;color:var(--muted)}.book{border:1px solid #6d4b3b2e;border-radius:18px;padding:16px;background:linear-gradient(#fffaf2,#f0dfcb)}.book h3{margin:0 0 5px;font-size:21px}.meta{font-size:13px;color:var(--muted);line-height:1.5}.score{color:var(--burg);margin:9px 0}.review{white-space:pre-wrap;border-top:1px dotted #72534455;padding-top:9px;line-height:1.5;font-size:14px}.del{margin-top:11px;border:0;background:transparent;color:var(--burg);text-decoration:underline}.ver{text-align:center;color:#745648;font-size:11px;margin-top:12px}@media(max-width:720px){.field,.dates{grid-template-columns:1fr}.books{grid-template-columns:1fr}.hearts{justify-content:space-between}.head{align-items:flex-start;flex-direction:column}.card{padding-left:13px;padding-right:13px}}
</style></head><body><main class="app"><section class="card"><h1>Книжный трекер</h1><div class="quoteBox"><div id="quote" class="quote">🍂 Загружаем осеннюю фразу…</div><button id="qbtn" class="qbtn" type="button">🍁 Другая фраза</button></div><form id="form" class="form"><div class="field"><label class="label" for="title"><span class="icon">📖</span>Название книги</label><input id="title" required placeholder="Введите название…"></div><div class="field"><label class="label" for="author"><span class="icon">✒️</span>Автор</label><input id="author" placeholder="Имя автора…"></div><div class="dates"><div><label class="label" for="start"><span class="icon">🗓️</span>Начало чтения</label><input id="start" type="date"></div><div><label class="label" for="end"><span class="icon">📕</span>Конец чтения</label><input id="end" type="date"></div></div><div class="rating"><div class="label"><span class="icon">♡</span>Общее впечатление</div><div class="hearts" id="hearts"><button type="button" class="heart" data-v="1">♡</button><button type="button" class="heart" data-v="2">♡</button><button type="button" class="heart" data-v="3">♡</button><button type="button" class="heart" data-v="4">♡</button><button type="button" class="heart" data-v="5">♡</button></div></div><div class="field" style="grid-template-columns:1fr"><label class="label" for="review"><span class="icon">☁️</span>Впечатления</label><textarea id="review" placeholder="Запишите мысли, любимые моменты, цитаты, настроение…"></textarea></div><div class="actions"><button class="btn save" type="submit">🍁 Сохранить книгу и отзыв</button><button class="btn clear" id="clear" type="button">Очистить форму</button></div><div id="status"></div></form><div id="runtime" class="runtime">⚠️ JavaScript не запущен.</div><div class="decor">🌿 ☕ 📚 🕯️ 🍂</div></section><section class="library" id="library"><div class="head"><h2>Моя осенняя полка</h2><div id="count" class="count">0 книг</div></div><div id="books" class="books"><div class="empty">Пока здесь пусто.</div></div></section><div class="ver">Safari/PWA build 6.1</div></main><script>
(function(){var K='autumnTracker61',L='autumnQuote61',rating=0,books=[];var Q=[['«Осень, казалось, внезапно наступила в том году.»','— «Гарри Поттер и Дары Смерти»'],['«Утро первого сентября было свежим и золотым.»','— «Гарри Поттер и Дары Смерти»'],['Осень в Хогвартсе пахнет пергаментом, дождём и горячим чаем.','— осенняя фраза в атмосфере Хогвартса'],['За окнами дождь, а в библиотеке самое время для новой тайны.','— осенняя фраза в атмосфере Хогвартса'],['Холодный ветер делает свет Большого зала ещё теплее.','— осенняя фраза в атмосфере Хогвартса'],['Осенний вечер создан для книги, свечи и немного волшебства.','— осенняя фраза в атмосфере Хогвартса'],['Дождь по стеклу — лучший фон для истории о тайных коридорах.','— осенняя фраза в атмосфере Хогвартса'],['Золотые листья и старые книги одинаково хорошо хранят время.','— осенняя фраза в атмосфере Хогвартса'],['Туман над озером делает дорогу к замку ещё загадочнее.','— осенняя фраза в атмосфере Хогвартса'],['Осенью библиотека кажется самым тёплым местом во всём замке.','— осенняя фраза в атмосфере Хогвартса'],['Осеннее небо над башнями будто нарисовано чернилами.','— осенняя фраза в атмосфере Хогвартса'],['Книга у камина — почти такое же волшебство, как хорошее заклинание.','— осенняя фраза в атмосфере Хогвартса']];function $(x){return document.getElementById(x)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function get(k){try{return localStorage.getItem(k)}catch(e){return null}}function set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}function load(){try{var x=JSON.parse(get(K)||'[]');books=Array.isArray(x)?x:[]}catch(e){books=[]}}function word(n){var a=n%10,b=n%100;if(a===1&&b!==11)return'книга';if(a>=2&&a<=4&&!(b>=12&&b<=14))return'книги';return'книг'}function date(v){if(!v)return'—';var p=v.split('-');return p.length===3?p[2]+'.'+p[1]+'.'+p[0]:'—'}function quote(){var last=parseInt(get(L),10),i=Math.floor(Math.random()*Q.length);if(Q.length>1&&!isNaN(last)&&i===last)i=(i+1)%Q.length;$('quote').innerHTML=esc(Q[i][0])+'<small>'+esc(Q[i][1])+'</small>';set(L,String(i))}function rate(v){rating=v;var h=document.querySelectorAll('.heart');for(var i=0;i<h.length;i++){h[i].className=i<v?'heart on':'heart';h[i].textContent=i<v?'♥':'♡'}}function render(){$('count').textContent=books.length+' '+word(books.length);if(!books.length){$('books').innerHTML='<div class="empty">Пока здесь пусто. Сохранённая книга появится здесь сразу.</div>';return}var out='';for(var i=books.length-1;i>=0;i--){var b=books[i],s=parseInt(b.rating,10)||0;out+='<article class="book"><h3>'+esc(b.title)+'</h3><div class="meta">'+esc(b.author||'Автор не указан')+'<br>Чтение: '+date(b.start)+' — '+date(b.end)+'</div><div class="score">'+Array(s+1).join('♥')+Array(6-s).join('♡')+'</div><div class="review"><strong>Впечатления:</strong><br>'+(b.review?esc(b.review):'<span style="opacity:.6">Не добавлены</span>')+'</div><button class="del" type="button" data-i="'+i+'">Удалить</button></article>'}$('books').innerHTML=out}function clearForm(){$('form').reset();rate(0);$('status').textContent=''}$('runtime').className='runtime ok';$('runtime').textContent='✓ Приложение запущено: кнопки и сохранение работают.';load();render();quote();$('qbtn').onclick=quote;$('clear').onclick=clearForm;var hs=document.querySelectorAll('.heart');for(var j=0;j<hs.length;j++)hs[j].onclick=function(){rate(parseInt(this.getAttribute('data-v'),10)||0)};$('form').onsubmit=function(e){e.preventDefault();var t=$('title').value.replace(/^\s+|\s+$/g,'');if(!t){$('status').style.color='#8d4028';$('status').textContent='Введите название книги.';return false}books.push({title:t,author:$('author').value,start:$('start').value,end:$('end').value,rating:rating,review:$('review').value});var ok=set(K,JSON.stringify(books));render();$('status').style.color='#52613c';$('status').textContent=ok?'✓ Книга и отзыв сохранены.':'✓ Книга добавлена на полку; постоянное хранение недоступно.';$('form').reset();rate(0);setTimeout(function(){$('library').scrollIntoView({behavior:'smooth'})},80);return false};$('books').onclick=function(e){var t=e.target||e.srcElement;if(!t||t.getAttribute('data-i')===null)return;var i=parseInt(t.getAttribute('data-i'),10);if(isNaN(i)||!books[i])return;books.splice(i,1);set(K,JSON.stringify(books));render()};window.addEventListener('pageshow',function(e){if(e.persisted){load();render();quote()}});if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}})();
</script></body></html>
