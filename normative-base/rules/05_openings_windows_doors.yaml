checked_at: 2026-09-30
target_profile: RU_2027_PLUS
primary_documents: [GOST_23166_2024, GOST_30971_2012, GOST_30674_2023, GOST_R_56926_2016, GOST_475_2026]

opening_coordination:
  - id: opening.modular_preference
    source: GOST_28984_2011
    auto_rule: false
    statement: "Для размеров проемов и простенков предпочтительно использовать согласованную модульную систему, если это совместимо с конструктивной системой и конкретным изделием."
  - id: opening.not_equal_window_block
    auto_rule: true
    statement: "Размер строительного проема не равен габариту оконного/дверного блока: модель должна хранить отдельные параметры блока, проектного монтажного зазора и проема."

window_mounting_joint:
  source: GOST_30971_2012
  status: active_for_target_2027
  status_history_note: >-
    Приказ Росстандарта от 16.09.2021 №978-ст прекращал с 01.02.2022 применение пунктов 7.1.2,
    7.1.5, 7.1.6, 7.1.8, А.3.5 и таблицы А.2 на территории РФ, однако приказ Росстандарта
    от 25.03.2022 №164-ст отменил приказ №978-ст. Поэтому для целевого профиля 2027 нельзя
    помечать ГОСТ 30971-2012 как частично замененный ГОСТ Р 59599-2021.
  garant_url: "https://base.garant.ru/70815308/"
  rules:
    - id: window.gap.design_required
      clause: "5.2"
      auto_rule: true
      statement: "Монтажный зазор назначать с учетом конструкции блока, температурных деформаций и применяемой системы монтажного шва; не принимать универсальное значение без основания."
    - id: window.gap.long_facade
      auto_rule: false
      statement: "Для ленточного остекления длиной более 6 м и фасадного остекления требуемый зазор назначать по техническому расчету и документации профильной системы."
    - id: window.opening_project_geometry
      source_clause: "5.2.2"
      auto_rule: true
      statement: "Размеры и конфигурация оконных проемов должны соответствовать рабочей проектной документации."
    - id: window.opening_geometry_tolerance
      source_clause: "5.2.3"
      auto_rule: false
      max_deviation_vertical_horizontal_mm_per_m: 4.0
      note: "Это контроль выполненного проема, а не проектное разрешение моделировать отклонение."
    - id: window.gap.max_recommended
      source_clause: "5.2.1"
      auto_rule: false
      recommended_max_mm: 60
      note: "Рекомендуемый предел, а не универсальный проектный монтажный зазор. Максимум зависит от характеристик материала центрального слоя."
    - id: window.joint.layers_and_calculation
      source_clause: "5.1.2-5.1.5"
      auto_rule: false
      statement: "Конструкцию монтажного шва проектировать как систему слоев с учетом материала стены, геометрии проема, эксплуатационных воздействий и расчетов; принцип 'изнутри плотнее, чем снаружи' не заменяет проект узла."

pvc_windows:
  document: GOST_30674_2023
  status: active_for_target_2027
  effective_from: 2024-08-01
  correction: "ИУС 10-2024, действует с 2024-10-10"
  scope_note: "ПВХ оконные и балконные блоки стандарта предназначены для стеновых проемов жилых, общественных и промышленных зданий высотой не более 75 м в области применения стандарта."
  project_rule: "Габариты, архитектурный рисунок, схемы открывания, профили и эксплуатационные характеристики задавать проектом/техническим заданием и документацией изготовителя, а не библиотечным размером по умолчанию."

residential_windows:
  document: GOST_R_56926_2016
  status: active_for_target_2027_subject_to_registry_check
  amendments: [1]
  corrections: ["ИУС 11-2022"]

window_general:
  document: GOST_23166_2024
  status: active_for_target_2027
  effective_from: 2024-04-01
  replaces: GOST_23166_2021
  correction: "ИУС 1-2025, действует с 2025-01-24"
  garant_url: "https://base.garant.ru/408896907/"
  rule: "Габариты, схема открывания, масса и размеры створок проверяются по стандарту и документации изготовителя; библиотечный блок не создавать только из размера строительного проема."

doors:
  target_2027_standard:
    document: GOST_475_2026
    effective_from: 2026-10-01
    replaces: GOST_475_2016
    target_profile_action: apply
    statement: "Для проектов 2027+ не использовать ГОСТ 475-2016 как действующую базу деревянных и комбинированных дверных блоков."
  fire_and_egress_policy:
    - "Размер эвакуационного выхода проверять по СП 1.13130.2020, специальному СП здания и правилам МГН, а не только по каталожному размеру двери."
    - "Хранить отдельно строительный проем, наружный габарит коробки, полотно и фактический размер прохода в свету."

agent_logic:
  - "Не вычислять ширину оконного простенка только как остаток между равными окнами: сначала проверить несущую схему, материал кладки, перемычку, пожарные требования и теплотехнический узел."
  - "Для кирпичной стены согласовывать грань проема с раскладкой кладки, но не превращать производный кладочный шаг в универсальный модуль фасада."
  - "При выборе библиотечного окна или двери сначала определить область применения изделия, затем габарит блока и монтажный узел, затем строительный проем."
  - "Для профиля 2027 выбирать ГОСТ 475-2026, а не переходный ГОСТ 475-2016."
  - "Не считать ГОСТ Р 59599-2021 заменой перечисленных пунктов ГОСТ 30971-2012: приказ о прекращении их применения был отменен приказом Росстандарта №164-ст."

