revision_sources:
  architectural_core: revision_watch_2027.yaml
  adjacent_structural_execution_engineering: revision_watch_adjacent_2027.yaml
  special_functional: functional_revision_audit_2027.yaml
  sanitary: sanitary_registry_2027.yaml
  rule: "Эти файлы являются авторитетными для текущего проверенного уровня изменений; target_2027 не должен содержать противоречащий им более низкий уровень."

agent_gate:
  before_model_generation:
    - "load target_2027.yaml"
    - "load revision_watch_2027.yaml"
    - "load revision_watch_adjacent_2027.yaml"
    - "load functional_revision_audit_2027.yaml when special function applies"
    - "load sanitary_registry_2027.yaml when sanitary requirement applies"
    - "reject rules superseded by confirmed_transitions"
    - "reject expired documents without an officially adopted applicable replacement"
    - "verify object_function and special_code applicability"
    - "verify requirements_registry applicability separately from document status"
  fail_closed: true
