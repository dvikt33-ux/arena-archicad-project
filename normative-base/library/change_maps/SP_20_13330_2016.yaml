change_map_version: 2
checked_at: 2026-10-04
document: SP_20_13330_2016
target_profile: RU_2027_PLUS
production_authority: false
purpose: "Карта изменений СП20 для определения действующего текста locator'ов. Карточки изменений используются только для метаданных; locator-level выводы ниже основаны на прямом чтении полных текстов изменений в ГАРАНТ."

policy:
  - amendment_card_metadata_proves_revision_identity_and_dates_only
  - direct_authorized_amendment_text_may_prove_locator_change_when_full_change_instruction_is_read
  - current_locator_may_be_reconstructed_only_when_a_later_full_replacement_is_read_and_every_subsequent_amendment_is_checked_for_that_locator
  - stale_root_render_must_not_override_verified_amendment_chain
  - appendix_K_values_remain_blocked_until_the_appendix_table_itself_is_directly_read
  - no_geographic_snow_value_without_settlement_or_site_input

authorized_source_observation:
  system: GARANT
  checked_at: 2026-10-04
  session_state: authenticated
  stale_root_url: "https://base.garant.ru/71636070/"
  stale_root_observation: >-
    Корневой рендер показывает доредакционный текст 10.2 только через снеговой район/таблицу 10.1
    и не отображает приложение К в оглавлении. Он конфликтует с прямыми текстами изменений и
    исключен из evidence для определения действующей редакции 10.2.

amendments:
  - number: 1
    approval_order: "402/пр"
    approval_date: 2018-07-05
    effective_from: 2019-01-06
    official_card: "https://protect.gost.ru/sp/changesdetails/ae4e2b57-6316-413c-95df-e6dc33f3e616"
    impact_on_locator_10_2: superseded_by_full_replacement_in_change_2
    impact_on_appendix_K: not_applicable_before_appendix_K_introduction

  - number: 2
    approval_order: "49/пр"
    approval_date: 2019-01-28
    effective_from: 2019-07-29
    official_card: "https://protect.gost.ru/sp/changesdetails/1a5a6ff2-93a4-40b0-bc97-526e12b60445"
    direct_text_url: "https://base.garant.ru/72234458/"
    direct_text_read: true
    locator_10_2_effect: full_replacement
    locator_10_2_proven_text_semantics:
      listed_settlements: use_Appendix_K
      other_Russian_territory: use_snow_region_and_Table_10_1
    appendix_K_effect: appendix_added
    appendix_K_table_directly_read: false

  - number: 3
    approval_order: "897/пр"
    approval_date: 2020-12-30
