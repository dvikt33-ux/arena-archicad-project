checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Пожарные ограничения геометрии оконных/иных проемов, междуэтажных поясов и фасадных простенков по актуальному СП 2.13130.2020. Эти требования накладываются до модульной, кладочной и эстетической раскладки фасада."

revision_dependencies:
  - document: SP_2_13130_2020
    verified_changes: [1,2]
    change_2_effective_from: 2026-01-01
    target_2027_action: apply

terms:
  source: SP_2_13130_2020
  rules:
    - id: facade.fire.interstory_belt_term
      clause: "3.23"
      automation: validation_only
      statement: "Междуэтажный пояс — участок наружной стены с нормируемым пределом огнестойкости между смежными по высоте проемами/светопрозрачными участками; такой пояс выполняется глухим."
    - id: facade.fire.pier_term
      clause: "3.24"
      automation: validation_only
      statement: "Простенок в смысле СП 2 — участок наружной стены с нормируемым пределом огнестойкости между смежными по горизонтали проемами/светопрозрачными участками; такой простенок выполняется глухим."

fire_barrier_junctions:
  source: SP_2_13130_2020
  rules:
    - id: facade.fire.barrier_junction_pier_type2wall_type1partition
      clause: "5.3.6"
      automation: conditional
      statement: "В местах примыкания противопожарных стен 2-го типа и перегородок 1-го типа к наружным стенам предусматривать простенок шириной не менее 1,0 м."
      values: {min_width_mm: 1000}
      dimension_semantics: actual

    - id: facade.fire.barrier_junction_pier_type2partition
      clause: "5.3.6"
      automation: conditional
      statement: "В местах примыкания противопожарных перегородок 2-го типа к наружным стенам предусматривать простенок шириной не менее 0,8 м."
      values: {min_width_mm: 800}
      dimension_semantics: actual

    - id: facade.fire.barrier_junction_transparency
      clause: "5.3.6"
      automation: validation_only
      statement: "Требуемый противопожарный простенок может быть частично/полностью светопрозрачным либо содержать проемы только при выполнении требований пункта к огнестойкости самого простенка и заполнений; обычное окно не является эквивалентом глухого противопожарного простенка."

interfloor_facade_fire_spread:
  source: SP_2_13130_2020
  clause: "5.4.18"
  applicability:
    building_fire_resistance_degrees: [I, II, III]
    trigger: "наружная стена содержит открытые проемы, заполненные проемы/светопрозрачные участки или иные элементы с ненормируемым пределом огнестойкости"
  rules:
    - id: facade.fire.interstory_belt_general
      automation: conditional
      dimension_semantics: actual
      statement: "В местах примыкания наружной стены к перекрытию высота междуэтажного пояса по вертикали должна быть не менее 1,2 м, а его ширина — не менее ширины нижерасположенного проема."
      values: {min_vertical_height_mm: 1200}

    - id: facade.fire.interstory_belt_resistance_openings_up_to_6m2
      automation: conditional
      statement: "Если площадь ненормируемого по огнестойкости участка стены/проема не превышает 6 м², предел огнестойкости междуэтажного пояса по E принимают равным требуемому пределу наружной ненесущей стены. Способ учета нескольких участков зависит от ширины нормируемого простенка между ними."
      conditions: {unrated_opening_area_m2: {max: 6}}
      pier_area_grouping:
        - {condition: "fire_rated_pier_width_mm < 800", rule: "суммарная площадь отдельных ненормируемых участков в пределах соответствующего этажа/группы не должна превышать 6 м²"}
        - {condition: "fire_rated_pier_width_mm >= 800", rule: "допускаются отдельные ненормируемые участки площадью не более 6 м² каждый"}
      values: {area_threshold_m2: 6, pier_grouping_threshold_mm: 800}
      requires_object_classification: true

    - id: facade.fire.interstory_belt_resistance_opening_over_6m2
      automation: conditional
      statement: "Если ненормируемый по огнестойкости участок стены/проем имеет площадь более 6 м², предел огнестойкости междуэтажного пояса принимают равным требуемому пределу огнестойкости перекрытия; если требуемый предел перекрытия выше REI 60, допускается принимать предел пояса E 60."
      conditions: {unrated_opening_area_m2: {greater_than: 6}}
      values: {area_threshold_m2: 6, belt_E_cap_when_floor_above_REI60: "E60"}
      requires_object_classification: true
      conflict_policy: "Порог площади определяет требуемый предел огнестойкости пояса, а не разрешает уменьшать его геометрическую высоту."

    - id: facade.fire.interstory_belt_horizontal_compensation
      automation: conditional
      dimension_semantics: actual
      statement: "Если междуэтажный пояс выполняется высотой менее 1,2 м, в уровне перекрытия предусматривают горизонтальный глухой выступ из НГ материалов в сочетании с поясом; сумма горизонтальной проекции выступа и вертикальной проекции пояса должна быть не менее 1,2 м."
      formula: "horizontal_noncombustible_projection_mm + vertical_belt_projection_mm >= 1200"
      conditions: {vertical_belt_height_mm: {less_than: 1200}}
      note: "Горизонтальный выступ не отменяет требования к огнестойкости пояса и применимости всего п.5.4.18."

    - id: facade.fire.pier_at_fire_rated_internal_wall
      automation: conditional
      dimension_semantics: actual
      statement: "В местах примыкания нормируемых по огнестойкости внутренних стен и перегородок ширина фасадного простенка должна быть не менее 0,8 м с учетом п.5.3.6 и подп. «д» п.5.4.16."
      values: {min_width_mm: 800}
      conflict_policy: "Не применять 800 мм как универсальный минимум каждого межоконного простенка: это специальный пожарный интерфейс."

    - id: facade.fire.transparent_belt_or_pier
      automation: conditional
      statement: "Если требуемые междуэтажные пояса/простенки выполняются частично или полностью светопрозрачными, в пределах нормируемой высоты/ширины они должны быть глухими (неоткрывающимися) и иметь требуемый соответствующим подпунктом предел огнестойкости."

    - id: facade.fire.F1_3_belt_exception
      automation: conditional
      statement: "Для зданий класса Ф1.3 II и III степеней огнестойкости допускается междуэтажный пояс высотой не менее 0,9 м при требуемом для случая пределе огнестойкости и наличии глухой фрамуги высотой не менее 0,3 м с двухкамерным стеклопакетом."
      values: {min_belt_height_mm: 900, min_fixed_transom_height_mm: 300}
      conditions: {functional_fire_class: F1.3, fire_resistance_degree: [II, III]}
      requires_object_classification: true

    - id: facade.fire.belt_exemptions_exact_scope
      automation: validation_only
      statement: "Требования п.5.4.18 к огнестойкости и высоте противопожарных междуэтажных поясов не распространяются на перечисленные самим пунктом случаи; исключение применять только после точной классификации."
      cases:
        - "двери лоджий и балконов с выступом плиты балкона не менее 0,5 м, а также эвакуационные выходы"
        - "наружные ограждения балконов/лоджий, если требованиям соответствует стена, отделяющая их от внутреннего помещения"
        - "одноэтажные здания и места примыкания наружных стен к покрытию здания"
        - "помещения лестничных клеток"
        - "помещения без или с ограниченной пожарной нагрузкой в области пункта, включая санузлы и помещения категорий В4/Д"
        - "надземные автостоянки открытого типа"
      conflict_policy: "Исключение из междуэтажного пояса не отменяет другие пожарные нормы фасада, лестничной клетки, эвакуации и заполнений проемов."

area_semantics:
  - id: facade.fire.unrated_area_within_storey_group
    automation: validation_only
    statement: "Площадь ненормируемых по огнестойкости участков для логики 6 м² оценивают в пределах этажа, выделенного простенками/участками стены с нормируемым пределом огнестойкости."
    audit_basis: "Разъяснение ФГБУ ВНИИПО МЧС России от 12.01.2026 № ИГ-117-5-13-2."

facade_opening_layout_algorithm:
  type: design_procedure
  normative_basis: [GOST_28984_2011, SP_2_13130_2020, SP_15_13330_2020, applicable_functional_SP]
  steps:
    - "1. Определить степень огнестойкости, функциональный класс и положение нормируемых противопожарных стен/перегородок/перекрытий."
    - "2. Классифицировать каждый фасадный участок/проем как нормируемый либо ненормируемый по огнестойкости; вычислить фактические площади."
    - "3. Сгруппировать ненормируемые участки по пожарным простенкам: при простенке <0,8 м учитывать суммарную площадь для порога 6 м², при >=0,8 м проверять каждый отдельный участок."
    - "4. Определить требуемый предел огнестойкости междуэтажного пояса по площади, не смешивая этот выбор с геометрией 1,2 м."
    - "5. Наложить требуемую геометрию пояса/простенка и только затем требования размера проема, естественного освещения, МГН и конструктив."
    - "6. Для несущей кладки получить подтверждение простенка КР по rules/22_masonry_piers_precheck.yaml; пожарный минимум не заменяет расчет несущей способности."
    - "7. После выполнения обязательных ограничений согласовать проемы/простенки с координационными модулями ГОСТ 28984 и реальным размерным рядом изделий."
    - "8. После округления повторно проверить площадь каждого ненормируемого участка, пожарные размеры, размер в свету, КР и оконный узел."

BIM_parameters_required:
  - facade_wall_fire_resistance
  - building_fire_resistance_degree
  - building_functional_fire_class
  - fire_compartment_boundaries
  - fire_rated_internal_wall_junctions
  - floor_slab_levels
  - opening_width_height
  - opening_area_m2
  - opening_fire_rating_or_unrated_status
  - fire_rated_pier_width_between_unrated_areas_mm
  - pier_width_between_openings
  - interstory_belt_vertical_height
  - horizontal_noncombustible_projection
  - transparent_fire_rated_fixed_area
  - F1_3_exception_transom_height_mm

agent_logic:
  - "Не принимать 800 мм как универсальную ширину всех оконных простенков."
  - "Не считать 1200 мм универсальной высотой подоконного/надоконного участка: 1,2 м относится к конкретному противопожарному междуэтажному поясу."
  - "Порог 6 м² влияет прежде всего на требуемый предел огнестойкости пояса и способ группировки ненормируемых участков; он не отменяет геометрию пояса."
  - "Не размещать открывающуюся створку внутри зоны, которая должна выполнять функцию глухого противопожарного пояса/простенка."
  - "Не уменьшать противопожарный пояс/простенок ради кратности 3M/6M; модульная сетка применяется после пожарного ограничения."
  - "Пожарный минимум простенка не доказывает достаточную несущую способность кладки."

