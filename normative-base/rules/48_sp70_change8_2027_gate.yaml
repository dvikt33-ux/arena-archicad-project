checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Блокирующий реестр пунктов СП 70.13330.2012, для которых Изменение №8 имеет отложенную дату введения 2027-03-01. Защищает BIM-агента от применения текста редакции 2026 года к проектам 2027+."

source_change:
  document: SP_70_13330_2012
  amendment: 8
  approved_by: "Приказ Минстроя России от 03.06.2026 № 353/пр"
  base_effective_from: 2026-07-04
  deferred_parts_effective_from: 2027-03-01
  garant_url: "https://base.garant.ru/414672974/"

policy:
  - id: sp70.change8.2027.deferred_clause_gate
    automation: auto
    statement: "Для профиля RU_2027_PLUS правило, основанное на пункте СП 70 из списка deferred_clauses, считается недействительным до отдельной сверки текста этого пункта в редакции Изменения №8, вводимой 01.03.2027."
    effective_from: 2027-03-01
    conflict_policy: "Наличие действующего текста пункта до 2027-02-28 не разрешает использовать его старую формулировку для модели, предназначенной для реализации в 2027+."

  - id: sp70.change8.2027.no_old_numeric_fallback
    automation: forbidden_to_infer
    statement: "Если изменяемый с 01.03.2027 пункт ранее содержал числовой параметр, а новая формулировка еще не прошла отдельный аудит, запрещено сохранять старое число как 'консервативный запас'. Результат — blocked_pending_clause_revalidation."

masonry_and_architectural_deferred_clauses:
  effective_from: 2027-03-01
  clauses:
    - "9.1.1"
    - "9.1.3"
    - "9.2.4"
    - "9.2.8"
    - "9.2.12"
    - "9.2.13"
    - "9.2.14"
    - "9.2.15"
    - "9.3.1"
    - "9.4.1"
    - "9.4.2"
    - "9.4.3"
    - "9.4.5"
    - "9.5.1"
    - "9.5.4"
    - "9.5.5"
    - "9.5.6"
    - "9.5.7"
    - "9.5.8"
    - "9.6.3"
    - "9.6.5"
    - "9.6.6"
    - "9.6.7"
    - "9.7.2"
    - "9.7.4"
    - "9.7.5"
    - "9.7.8"
    - "9.16.1"
    - "9.16.4"
    - "9.17.3"
    - "9.17.4"
    - "9.18.2"
    - "9.18.5"
  note: "Это перечень пунктов раздела 9, явно указанных в официальном тексте Изменения №8 ГАРАНТ как вводимые с 01.03.2027. Другие разделы СП 70 также имеют отложенные изменения, но архитектурный агент маршрутизирует их в смежные КР/ПОС/монтажные проверки."

other_deferred_coordination_groups:
  effective_from: 2027-03-01
  groups:
    - sections: ["1", "3"]
      role: "область применения, общие требования, исполнительная документация"
    - sections: ["4", "5", "6"]
      role: "стальные, бетонные и сборные железобетонные конструкции; смежный КР/монтажный слой"
    - sections: ["7", "8"]
      role: "легкие ограждающие и деревянные конструкции"
    - sections: ["10", "11"]
      role: "прочие строительные конструкции и работы"
    - appendices: ["А", "Б", "В", "Г", "Д", "Е", "И", "Ф"]
      role: "приложения, прямо включенные в отложенную часть изменения"
  rule: "Если другой rule-файл цитирует пункт из этих групп, проверять точный номер по полному перечню Изменения №8 перед использованием в 2027+."

already_revalidated:
  - clause: "9.2.4"
    status: removed_from_2027_profile
    consequence: "Прежние универсальные 12 мм горизонтального и 10 мм вертикального шва не используются как нормативное правило."
    files:
      - "rules/01_masonry.yaml"
      - "rules/24_masonry_opening_layout.yaml"

not_in_deferred_list_and_currently_used:
  - clause: "9.2.1"
    status: "Измененная формулировка введена основной частью Изменения №8 с 04.07.2026; используется после отдельной сверки."
  - clause: "9.2.2"
    status: "Не указан в перечне пунктов с отложенной датой 01.03.2027; при изменении источника повторно проверить."
  - clause: "9.2.3"
    status: "Не указан в перечне пунктов с отложенной датой 01.03.2027; при изменении источника повторно проверить."
  - clause: "9.2.5"
    status: "Не указан в перечне пунктов с отложенной датой 01.03.2027; при изменении источника повторно проверить."

machine_gate:
  hard_fail_state: sp70_change8_2027_clause_not_revalidated
  trigger: "source.document == SP_70_13330_2012 AND source.clause intersects masonry_and_architectural_deferred_clauses AND change8_2027_revalidated != true"
  allowed_resolution_states:
    - revalidated_against_2027_text
    - removed_from_target_profile
    - blocked_pending_clause_revalidation

agent_logic:
  - "Перед применением любого пункта раздела 9 СП 70 сначала проверить его наличие в deferred_clauses."
  - "Не считать, что Изменение №8 целиком действует с 04.07.2026: для перечисленных пунктов официальная дата — 01.03.2027."
  - "Не считать, что отсутствие нового числового правила разрешает использовать старое значение."
  - "После постатейной сверки конкретного пункта добавить change8_2027_revalidated: true и кратко зафиксировать изменение смысла/числа."

sources:
  - "https://base.garant.ru/414672974/"
