checked_at: 2026-10-01
target_profile: RU_2027_PLUS
primary_document: SP_464_1325800_2019
verified_changes: [1]
purpose: >-
  Параметрическая архитектурная схема приемки и разгрузки ТРК: число разгрузочных мест,
  платформы, габариты разгрузочных помещений, открытые площадки и связь с грузопотоками.
  Используется актуальный текст СП 464 после Изменения №1; устаревшее универсальное требование
  о закрытом дебаркадере для каждой торговли/общепита не применяется.

revision_state:
  status: active
  change_1_approved_by: "Приказ Минстроя России от 15.12.2023 №930/пр"
  official_card: https://protect.gost.ru/sp/details/c7f5d95a-b4f1-4265-a83e-5f946f429863

site_loading_location:
  - id: trk.loading.open_area_service_yard
    source_clause: "5.7"
    automation: conditional
    applies_to: open_loading_area
    preferred_location: isolated_service_yard
    statement: "Открытые разгрузочные площадки размещать в изолированных хозяйственных дворах ТРК."

  - id: trk.loading.open_area_orientation_exception
    source_clause: "5.7 note"
    automation: conditional
    statement: >-
      Допускается ориентировать открытую разгрузочную площадку в сторону общественного здания
      либо на глухой торец жилого здания; санитарные, шумовые, пожарные и транспортные требования
      проверяются независимо.

  - id: trk.loading.open_places_canopy
    source_clause: "6.21, Change 1"
    automation: true
    applies_to: open_loading_place
    requirement: canopy

loading_zone_typology:
  - id: trk.loading.zone_forms_current
    source_clause: "6.20, Change 1"
    automation: design_option
    permitted_forms:
      - closed_loading_room
      - open_loading_area
      - heated_loading_zone
      - unheated_loading_zone
      - tunnel_served_loading
      - special_service_yard_loading
      - underground_loading_level
    statement: >-
      Тип разгрузочной зоны выбирается проектом и технологией. Не навязывать всем предприятиям
      закрытый дебаркадер по старой редакции пункта 6.21.

  - id: trk.loading.total_places_by_enterprise
    source_clause: "6.20, Appendix В.1"
    automation: conditional
    statement: >-
      Общее число разгрузочных мест ТРК формировать как сумму расчетных значений по предприятиям
      и учреждениям комплекса с учетом приложения В и задания на проектирование.

