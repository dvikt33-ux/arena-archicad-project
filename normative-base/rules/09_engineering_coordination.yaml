confirmed_2027_transition:
  document: SP_73_13330_2016
  amendment: 3
  deferred_effective_from: 2027-03-01
  affected_clauses: ["6.1.12","7.1.1","7.6.2","Appendix B","Appendix C","Appendix D"]
  architecture_action: "При координации инженерных помещений/проемов учитывать будущую редакцию, но не извлекать из нее инженерные размеры без профильного раздела."

architecture_coordination_rules:
  - id: mep.shafts_not_arbitrary
    automation: validation_only
    statement: "Габариты инженерных шахт и ниш нельзя назначать по универсальному шаблону; они зависят от состава систем, огнестойкости ограждений, монтажных зазоров и обслуживания."
  - id: mep.penetration_structural_gate
    automation: forbidden_to_infer
    statement: "Проемы/отверстия в несущих стенах, плитах, балках и ригелях под инженерные сети должны быть согласованы с КР; агент не вырезает их автоматически после построения несущей схемы."
  - id: mep.fire_compartment_penetration
    automation: validation_only
    statement: "Пересечение противопожарных преград коммуникациями требует отдельной проверки пожарных требований и узла заделки; обычный BIM-проем не является достаточным решением."
  - id: mep.ventilation_architecture
    automation: validation_only
    statement: "Архитектура резервирует места для венткамер, шахт, воздухозабора/выброса и обслуживания по профильному проекту; размеры не выводятся из площади здания простым коэффициентом."
  - id: mep.wet_zones
    automation: conditional
    statement: "Положение санитарных приборов и стояков координировать с конструкциями, гидроизоляцией, шумоизоляцией и трассировкой; стояк не должен появляться постфактум через произвольное отверстие в плите."
  - id: mep.electrical_rooms
    automation: validation_only
    statement: "Электротехнические помещения и трассы определять по профильному разделу; архитектурный агент резервирует подтвержденные габариты, но не рассчитывает их сам."

agent_logic:
  - "Перед выпуском АР выполнять междисциплинарную проверку проемов и шахт с КР/ОВ/ВК/ЭОМ."
  - "Не создавать отверстие в несущей конструкции только потому, что инженерная трасса пересекает ее в модели."
  - "Каждый инженерный проем должен иметь владельца/основание: система, отметка, габарит, огнезаделка при необходимости и согласование КР."
  - "Если инженерные исходные данные отсутствуют, возвращать unresolved или резервировать только явно согласованную зону."
  - "Для реализации 2027+ проверять target_2027.yaml до применения инженерно-координационных правил."

