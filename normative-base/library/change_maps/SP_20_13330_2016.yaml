    impact_on_locator_10_2: none
    note: "Полный текст изменения затрагивает 11.1.7 и приложения Д/Л, но не раздел 10."

locator_evidence:
  - locator: "10.2 routing paragraphs 1-2"
    current_state: authorized_locator_verified
    verification_method: direct_authorized_amendment_chain_reconstruction
    reconstructed_from: change_2_full_replacement
    subsequent_changes_checked: [3, 4, 5, 6]
    current_semantics:
      if_settlement_is_listed_in_Appendix_K: use_Appendix_K
      otherwise: use_snow_region_and_Table_10_1
    numeric_value_proven_by_this_locator: false
    geographic_input_required: true

  - locator: "10.2 paragraph 3"
    current_state: authorized_locator_verified
    verification_method: change_2_text_plus_change_5_direct_edit
    note: >-
      Изм. №5 удаляет из третьего абзаца только слова ', указанные в таблице 10.1,'.
      Это не изменяет территориальный маршрут первых двух абзацев.

  - locator: "Appendix K"
    current_state: blocked_pending_locator
    introduced_by_change: 2
    title_presence_directly_seen: true
    full_table_directly_read: false
    effect: no_automatic_Appendix_K_snow_value

safe_conclusion:
  clause_10_2_territorial_route_proven: true
  appendix_K_numeric_generation: forbidden_until_table_directly_read
  table_10_1_numeric_generation: requires_valid_geographic_route_and_site_input
  geographic_input_required: true
  production_numeric_promotion_from_this_pass: 0
