name: Normative Base Lint

on:
  push:
    branches: [normative-base-v1]
    paths:
      - 'normative-base/**'
      - '.github/workflows/normative-base-lint.yml'
  pull_request:
    paths:
      - 'normative-base/**'
      - '.github/workflows/normative-base-lint.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate normative base
        run: python normative-base/tools/validate.py
