  special_exception_gate: >-
    Примечания и пункты раздела 6.7 содержат специальные возможности/ограничения для отдельных
    видов торговли и противопожарных мероприятий. База не увеличивает табличную площадь автоматически;
    каждое исключение требует отдельного подтвержденного rule id.

special_function_gate:
  - id: fire.compartment.special_function_precedence
    automation: mandatory_validation
    statement: >-
      После выбора базовой таблицы проверить дополнительные требования раздела 6.7 и специальных
      функциональных СП: зрелищные, образовательные, медицинские, спортивные, гостиничные,
      многофункциональные и иные объекты могут иметь дополнительные ограничения или отдельные таблицы.
    if_special_rule_more_strict: apply_special_rule

  - id: fire.compartment.no_automatic_AUPT_area_increase
    automation: forbidden_to_infer
    statement: >-
      Наличие АУПТ само по себе не является универсальным основанием увеличить площадь пожарного
      отсека вдвое или на иной коэффициент. Увеличение допускается только там и в размере,
      где это прямо предусмотрено конкретным пунктом/примечанием для данного типа объекта.

  - id: fire.compartment.multi_functional_split
    automation: mandatory_validation
    statement: >-
      В многофункциональном здании классифицировать функциональные части и пожарные отсеки до
      выбора матрицы. Не считать весь ТРК автоматически Ф3.1 только из-за наличия магазинов.

BIM_required_parameters:
  - functional_fire_class
  - building_or_compartment_function
  - fire_resistance_degree
  - structural_fire_hazard_class
  - fire_height_m
  - aboveground_floor_count_excluding_upper_technical_where_applicable
  - floor_area_within_fire_compartment_m2
  - fire_compartment_id
  - automatic_fire_suppression_status
  - special_function_code_route

agent_logic:
  - "Сначала функциональная классификация, затем таблица; не наоборот."
  - "Строку таблицы проверять как единый design envelope: огнестойкость + конструктивный класс + высота + этажность + площадь."
  - "Прочерк/null означает недопустимость данной этажности по базовой таблице, а не отсутствие ограничения."
  - "Если объект выходит в область СП 550, переключиться на highrise route."
  - "Не подменять пожарную высоту общей архитектурной высотой."
  - "Не увеличивать пожарный отсек из-за наличия спринклеров без точного специального основания."

