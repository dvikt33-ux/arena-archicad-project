profile: RU_2027_PLUS
target_year: 2027
checked_at: 2026-10-01
purpose: "Нормативный профиль для проектов, реализация которых начнется не ранее 2027 года."

source_authority_policy:
  standards_and_codes_status:
    primary: "Федеральный информационный фонд стандартов Росстандарта (protect.gost.ru) и официальный орган, утвердивший СП/ГОСТ."
    use_for:
      - document_identity
      - status
      - replacement
      - amendment_identity
      - approval_and_registration
      - effective_date
      - official_scope_metadata
  legal_applicability:
    primary: "Реестр требований ЕИС «Стройкомплекс.РФ» и действующее законодательство РФ."
    use_for:
      - requirement_applicability_to_expertise
      - legally_relevant_date_logic
      - registered_requirement_status
  consolidated_legal_text_and_cross_check:
    source: GARANT
    role: "Независимая правовая/текстовая сверка, удобный источник консолидированного текста и правовых актов; отсутствие карточки ГОСТ/СП в ГАРАНТ само по себе не отменяет официальную регистрацию Росстандарта."
  manufacturer_and_system_data:
    role: "Дополнительный обязательный источник там, где норматив отсылает к конкретной продукции/системе. Не заменяет норматив и расчет."
  drafts:
    rule: "Проекты изменений, публичные обсуждения, планы стандартизации и документы без официальной даты введения не становятся активными правилами."

selection_policy:
  - "Если новая редакция или изменение официально утверждены и имеют точную дату вступления до или в 2027 году, применять их при проектировании целевого профиля заранее в той части, которая будет действовать в период реализации."
  - "Если изменение имеет разные даты введения для разных пунктов, хранить эти части раздельно и применять каждую по ее официальной дате."
  - "Текущую редакцию, которая будет отменена или изменена до реализации проекта, хранить только как переходную/историческую."
  - "Если будущая редакция исключает числовое правило без универсальной замены, старое число запрещается использовать автоматически; возвращать needs_project_or_manufacturer_data или needs_calculation."
  - "Если действующий документ прекращает действие в 2027 году, а официальная замена еще не введена/не утверждена, правила из него блокируются после даты прекращения; проект замены не использовать как норму."
  - "Статус документа и юридическая применимость конкретного требования — разные проверки."
  - "Для каждого решения проверять область применения, функциональное назначение, материал, высоту, пожарный/МГН статус и специальные нормы объекта."

legal_2027:
  requirements_registry:
    effective_logic_from: 2027-03-01
    basis: "Федеральный закон от 28.12.2025 №507-ФЗ; новая редакция ч. 5.2 ст. 49 ГрК РФ"
    rule: "Для экспертизы учитывать требования, включенные в Реестр требований на релевантную законодательству дату."
    automation: mandatory_validation
    garant_source: "https://www.garant.ru/news/2015759/"

