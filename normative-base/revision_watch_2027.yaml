release_gate:
  - "Перед каждым крупным релизом базы повторно открыть official source_url каждого core_document и каждого functional_document, реально используемого проектом."
  - "Если official_latest_change вырос или документ заменен новой редакцией — найти затронутые пункты и invalidate соответствующие auto/conditional rules до аудита."
  - "Если найдено только draft/public_discussion — записать watch_item, но не менять действующие размеры."
  - "Для проекта загружать и проверять ревизии только применимых специальных СП, но общие core_documents проверять всегда."
