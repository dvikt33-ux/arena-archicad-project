<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Книжный трекер"><meta name="theme-color" content="#b46132"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Книжный трекер</title><style>
:root{--paper:#fff9ef;--ink:#54372e;--muted:#896b5b;--rust:#b85b2b;--burg:#843b36;--bg:#c99868}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(#ecd2ad,#c88e5d);min-height:100vh;padding:12px 0 calc(30px + env(safe-area-inset-bottom))}.app{width:min(940px,96vw);margin:auto}.card{background:rgba(255,249,239,.97);border:1px solid #9d735d66;border-radius:28px;box-shadow:0 18px 55px #5a2e1c2b;padding:28px 16px;position:relative}.card:after{content:"";position:absolute;inset:10px;border:1px solid #843b3677;border-radius:22px;pointer-events:none}h1{position:relative;z-index:1;margin:4px 0 6px;text-align:center;font:400 clamp(52px,9vw,80px)/1 "Brush Script MT","Segoe Script",cursive}.quoteBox{position:relative;z-index:2;max-width:720px;margin:0 auto 22px;text-align:center}.quote{min-height:62px;line-height:1.5;color:#725347}.quote small{display:block;margin-top:6px;color:#9a7b6c;font-size:11px}.qbtn,.btn,.heart{touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}.qbtn{border:1px solid #6d4c3c33;background:#fff6e8;border-radius:999px;padding:8px 13px;color:#76584a}.form{position:relative;z-index:2;display:grid;gap:16px;background:#fffdf9d9;border:1px solid #8f65502b;border-radius:22px;padding:18px 14px}.field{display:grid;grid-template-columns:210px 1fr;gap:12px;align-items:end}.label{display:flex;gap:10px;align-items:center;font:400 26px/1.05 "Brush Script MT","Segoe Script",cursive}.icon{width:42px;height:42px;border:1px solid #6c4b3d33;border-radius:13px;display:grid;place-items:center;background:#fffaf1;font:21px system-ui}input,textarea{width:100%;border:0;border-bottom:1px dotted #95796a;background:transparent;color:var(--ink);outline:none;padding:10px 5px;font:16px Georgia,serif;border-radius:0}textarea{min-height:135px;resize:vertical;line-height:2;background:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,#95796a33 32px)}.dates{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding-top:14px;border-top:1px dotted #73594a55}.rating{padding-top:14px;border-top:1px dotted #73594a55}.hearts{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.heart{width:52px;height:52px;border-radius:50%;border:1px solid #843b3655;background:#fffaf3;color:var(--burg);font:32px/1 Georgia}.heart.on{background:var(--burg);color:white}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border-radius:999px;padding:13px 22px;min-height:48px;font-weight:700;border:0}.save{background:var(--rust);color:white}.clear{background:transparent;border:1px solid #68473844;color:var(--ink)}.newBook{display:none;background:#f1dfc8;border:1px solid #8b5a3c55;color:var(--ink)}#status{text-align:center;min-height:20px;font-size:13px;font-weight:bold}.runtime{position:relative;z-index:2;margin:12px auto 0;max-width:850px;text-align:center;padding:9px 12px;border-radius:12px;background:#fff0d8;color:#7a4a28;font-size:12px}.runtime.ok{background:#eef4e8;color:#52613c}.decor{text-align:center;font-size:27px;letter-spacing:.13em;padding-top:20px;position:relative;z-index:2}.library{margin-top:20px;background:rgba(255,249,239,.97);border:1px solid #9d735d66;border-radius:28px;box-shadow:0 18px 55px #5a2e1c2b;padding:22px 16px}.head{display:flex;justify-content:space-between;align-items:end;gap:12px}.library h2{font:400 clamp(42px,7vw,60px)/1 "Brush Script MT","Segoe Script",cursive;margin:0}.count{font-size:13px;color:var(--muted)}.books{display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px}.empty{text-align:center;padding:24px;border:1px dashed #72534455;border-radius:16px;color:var(--muted)}.bookRow{width:100%;border:1px solid #6d4b3b24;border-radius:14px;padding:11px 14px;background:linear-gradient(#fffaf2,#f3e5d2);color:var(--ink);text-align:left;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.bookRow:active{transform:scale(.995)}.bookTitle{font:700 18px/1.2 Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bookScore{margin-top:4px;color:var(--burg);font-size:15px;letter-spacing:.02em}.ver{text-align:center;color:#745648;font-size:11px;margin-top:12px}.leafRain{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}.fallLeaf{position:absolute;top:-12vh;font-size:22px;opacity:.42;animation:leafFall linear infinite;will-change:transform}.fallLeaf:nth-child(1){left:4%;animation-duration:12s;animation-delay:-3s}.fallLeaf:nth-child(2){left:15%;animation-duration:15s;animation-delay:-11s}.fallLeaf:nth-child(3){left:28%;animation-duration:13s;animation-delay:-7s}.fallLeaf:nth-child(4){left:41%;animation-duration:17s;animation-delay:-14s}.fallLeaf:nth-child(5){left:55%;animation-duration:14s;animation-delay:-4s}.fallLeaf:nth-child(6){left:67%;animation-duration:16s;animation-delay:-9s}.fallLeaf:nth-child(7){left:78%;animation-duration:13.5s;animation-delay:-6s}.fallLeaf:nth-child(8){left:91%;animation-duration:18s;animation-delay:-15s}.fallLeaf:nth-child(odd){font-size:18px}.cozySide{position:fixed;right:max(8px,env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:18;pointer-events:none;display:flex;align-items:flex-end;gap:7px;filter:drop-shadow(0 5px 10px #63351d38)}.candle{font-size:34px;animation:candleGlow 1.8s ease-in-out infinite}.miniBook{position:relative;width:54px;height:36px;perspective:140px}.miniBook:before,.miniBook:after{content:"";position:absolute;bottom:0;width:27px;height:31px;background:#f7e6c7;border:2px solid #744333;box-sizing:border-box}.miniBook:before{left:0;border-radius:5px 1px 3px 5px;transform:skewY(-6deg)}.miniBook:after{right:0;border-radius:1px 5px 5px 3px;transform:skewY(6deg)}.bookPage{position:absolute;z-index:2;left:27px;bottom:3px;width:24px;height:27px;background:#fff8e9;border:1px solid #8d654e;border-radius:1px 5px 4px 1px;transform-origin:left center;animation:pageFlip 3.2s ease-in-out infinite}@keyframes leafFall{0%{transform:translate3d(0,-10vh,0) rotate(0deg)}35%{transform:translate3d(24px,35vh,0) rotate(110deg)}70%{transform:translate3d(-18px,78vh,0) rotate(250deg)}100%{transform:translate3d(30px,118vh,0) rotate(390deg)}}@keyframes candleGlow{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.05);filter:brightness(1.18)}}@keyframes pageFlip{0%,18%{transform:rotateY(0deg)}48%,62%{transform:rotateY(-165deg)}88%,100%{transform:rotateY(0deg)}}@media(prefers-reduced-motion:reduce){.fallLeaf,.candle,.bookPage{animation:none}.leafRain{display:none}}@media(max-width:720px){.field,.dates{grid-template-columns:1fr}.books{grid-template-columns:1fr}.hearts{justify-content:space-between}.head{align-items:flex-start;flex-direction:column}.card{padding-left:13px;padding-right:13px}.cozySide{right:7px;bottom:calc(10px + env(safe-area-inset-bottom));transform:scale(.82);transform-origin:right bottom}.fallLeaf{opacity:.30}}
</style></head><body><div class="leafRain" aria-hidden="true"><span class="fallLeaf">🍂</span><span class="fallLeaf">🍁</span><span class="fallLeaf">🍂</span><span class="fallLeaf">🍁</span><span class="fallLeaf">🍂</span><span class="fallLeaf">🍁</span><span class="fallLeaf">🍂</span><span class="fallLeaf">🍁</span></div><div class="cozySide" aria-hidden="true"><div class="candle">🕯️</div><div class="miniBook"><span class="bookPage"></span></div></div><main class="app"><section class="card"><h1>Книжный трекер</h1><div class="quoteBox"><div id="quote" class="quote">🍂 Загружаем осеннюю фразу…</div><button id="qbtn" class="qbtn" type="button">🍁 Другая фраза</button></div><form id="form" class="form"><div class="field"><label class="label" for="title"><span class="icon">📖</span>Название книги</label><input id="title" required placeholder="Введите название…"></div><div class="field"><label class="label" for="author"><span class="icon">✒️</span>Автор</label><input id="author" placeholder="Имя автора…"></div><div class="dates"><div><label class="label" for="start"><span class="icon">🗓️</span>Начало чтения</label><input id="start" type="date"></div><div><label class="label" for="end"><span class="icon">📕</span>Конец чтения</label><input id="end" type="date"></div></div><div class="rating"><div class="label"><span class="icon">♡</span>Общее впечатление</div><div class="hearts" id="hearts"><button type="button" class="heart" data-v="1">♡</button><button type="button" class="heart" data-v="2">♡</button><button type="button" class="heart" data-v="3">♡</button><button type="button" class="heart" data-v="4">♡</button><button type="button" class="heart" data-v="5">♡</button></div></div><div class="field" style="grid-template-columns:1fr"><label class="label" for="review"><span class="icon">☁️</span>Впечатления</label><textarea id="review" placeholder="Запишите мысли, любимые моменты, цитаты, настроение…"></textarea></div><div class="actions"><button class="btn save" id="saveBtn" type="submit">🍁 Сохранить книгу и отзыв</button><button class="btn newBook" id="newBook" type="button">＋ Новая книга</button><button class="btn clear" id="clear" type="button">Очистить форму</button></div><div id="status"></div></form><div id="runtime" class="runtime">⚠️ JavaScript не запущен.</div><div class="decor">🌿 ☕ 📚 🕯️ 🍂</div></section><section class="library" id="library"><div class="head"><h2>Моя осенняя полка</h2><div id="count" class="count">0 книг</div></div><div id="books" class="books"><div class="empty">Пока здесь пусто.</div></div></section><div class="ver">Safari/PWA build 6.5</div></main><script>
(function(){
  var K='autumnTracker61',L='autumnQuote61',rating=0,books=[],editIndex=-1;
  var Q=[
    ['«Осень, казалось, внезапно наступила в том году.»','— «Гарри Поттер и Дары Смерти»'],
    ['«Утро первого сентября было свежим и золотым.»','— «Гарри Поттер и Дары Смерти»'],
    ['Осень в Хогвартсе пахнет пергаментом, дождём и горячим чаем.','— осенняя фраза в атмосфере Хогвартса'],
    ['За окнами дождь, а в библиотеке самое время для новой тайны.','— осенняя фраза в атмосфере Хогвартса'],
    ['Холодный ветер делает свет Большого зала ещё теплее.','— осенняя фраза в атмосфере Хогвартса'],
    ['Осенний вечер создан для книги, свечи и немного волшебства.','— осенняя фраза в атмосфере Хогвартса'],
    ['Дождь по стеклу — лучший фон для истории о тайных коридорах.','— осенняя фраза в атмосфере Хогвартса'],
    ['Золотые листья и старые книги одинаково хорошо хранят время.','— осенняя фраза в атмосфере Хогвартса'],
    ['Туман над озером делает дорогу к замку ещё загадочнее.','— осенняя фраза в атмосфере Хогвартса'],
    ['Осенью библиотека кажется самым тёплым местом во всём замке.','— осенняя фраза в атмосфере Хогвартса'],
    ['Осеннее небо над башнями будто нарисовано чернилами.','— осенняя фраза в атмосфере Хогвартса'],
    ['Книга у камина — почти такое же волшебство, как хорошее заклинание.','— осенняя фраза в атмосфере Хогвартса']
  ];
  function $(x){return document.getElementById(x)}
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}
  function load(){try{var x=JSON.parse(get(K)||'[]');books=Array.isArray(x)?x:[]}catch(e){books=[]}}
  function word(n){var a=n%10,b=n%100;if(a===1&&b!==11)return'книга';if(a>=2&&a<=4&&!(b>=12&&b<=14))return'книги';return'книг'}
  function quote(){var last=parseInt(get(L),10),i=Math.floor(Math.random()*Q.length);if(Q.length>1&&!isNaN(last)&&i===last)i=(i+1)%Q.length;$('quote').innerHTML=esc(Q[i][0])+'<small>'+esc(Q[i][1])+'</small>';set(L,String(i))}
  function rate(v){rating=v;var h=document.querySelectorAll('.heart');for(var i=0;i<h.length;i++){h[i].className=i<v?'heart on':'heart';h[i].textContent=i<v?'♥':'♡'}}
  function resetForm(){editIndex=-1;$('form').reset();rate(0);$('saveBtn').textContent='🍁 Сохранить книгу и отзыв';$('newBook').style.display='none';$('newBook').style.display='none';$('status').textContent=''}
  function render(){
    $('count').textContent=books.length+' '+word(books.length);
    if(!books.length){$('books').innerHTML='<div class="empty">Пока здесь пусто.</div>';return}
    var out='';
    for(var i=books.length-1;i>=0;i--){
      var b=books[i],s=parseInt(b.rating,10)||0;
      out+='<button class="bookRow" type="button" data-open-book="'+i+'"><div class="bookTitle">'+esc(b.title)+'</div><div class="bookScore">'+Array(s+1).join('♥')+Array(6-s).join('♡')+'</div></button>';
    }
    $('books').innerHTML=out;
  }
  function openBook(i){
    if(isNaN(i)||!books[i])return;
    var b=books[i];
    editIndex=i;
    $('title').value=b.title||'';
    $('author').value=b.author||'';
    $('start').value=b.start||'';
    $('end').value=b.end||'';
    $('review').value=b.review||'';
    rate(parseInt(b.rating,10)||0);
    $('saveBtn').textContent='🍁 Сохранить изменения';
    $('newBook').style.display='inline-block';
    $('status').style.color='#7a4a28';
    $('status').textContent='Редактирование: '+(b.title||'книга');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  $('runtime').className='runtime ok';
  $('runtime').textContent='✓ Приложение запущено: кнопки и сохранение работают.';
  load();render();quote();
  $('qbtn').onclick=quote;
  $('clear').onclick=resetForm;
  $('newBook').onclick=function(){resetForm();$('title').focus();window.scrollTo({top:0,behavior:'smooth'})};
  var hs=document.querySelectorAll('.heart');
  for(var j=0;j<hs.length;j++)hs[j].onclick=function(){rate(parseInt(this.getAttribute('data-v'),10)||0)};
  $('form').onsubmit=function(e){
    e.preventDefault();
    var t=$('title').value.replace(/^\s+|\s+$/g,'');
    if(!t){$('status').style.color='#8d4028';$('status').textContent='Введите название книги.';return false}
    var data={title:t,author:$('author').value,start:$('start').value,end:$('end').value,rating:rating,review:$('review').value};
    if(editIndex>=0&&books[editIndex]){
      books[editIndex]=data;
      set(K,JSON.stringify(books));
      render();
      $('status').style.color='#52613c';
      $('status').textContent='✓ Изменения сохранены.';
      editIndex=-1;
      $('form').reset();rate(0);$('saveBtn').textContent='🍁 Сохранить книгу и отзыв';
    }else{
      books.push(data);
      var ok=set(K,JSON.stringify(books));
      render();
      $('status').style.color='#52613c';
      $('status').textContent=ok?'✓ Книга и отзыв сохранены.':'✓ Книга добавлена на полку; постоянное хранение недоступно.';
      $('form').reset();rate(0);
      setTimeout(function(){$('library').scrollIntoView({behavior:'smooth'})},80);
    }
    return false;
  };
  $('books').onclick=function(e){
    var t=e.target||e.srcElement;
    while(t&&t!==$('books')&&t.getAttribute('data-open-book')===null)t=t.parentNode;
    if(!t||t===$('books'))return;
    openBook(parseInt(t.getAttribute('data-open-book'),10));
  };
  window.addEventListener('pageshow',function(e){if(e.persisted){load();render();quote()}});
  if('serviceWorker'in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
})();
</script></body></html>
