    note: "Полный текст изменения затрагивает только первый абзац 8.2.7."

  - number: 5
    approval_order: "918/пр"
    approval_date: 2023-12-14
    effective_from: 2024-01-15
    official_card: "https://protect.gost.ru/sp/changesdetails/0d7e172f-7dbd-4f77-bd6d-5a66ca26f9ef"
