checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Оконные/дверные простенки каменных стен: отделение архитектурной модульной раскладки от обязательной проверки несущей способности по СП 15.13330.2020; ранние машинные триггеры перед передачей КР."

revision_dependencies:
  - {document: SP_15_13330_2020, verified_changes: [1]}
  - {document: SP_20_13330_2016, verified_changes: [1,2,3,4,5,6]}
  - {document: SP_70_13330_2012, target_2027_change: 8}
  - {document: GOST_28984_2011, role: modular_coordination_only}

no_universal_minimum:
  - id: masonry.pier.no_universal_min_width
    automation: forbidden_to_infer
    statement: "Для несущего каменного оконного/дверного простенка нельзя назначать универсальную минимальную ширину только по этажности, толщине стены, модулю или формату кирпича/блока. Требуется расчет по СП 15 с фактическими нагрузками и расчетной схемой."
    requires_calculation: true
    conflict_policy: "Пожарный, технологический или модульный минимум может увеличить геометрию, но не доказывает несущую способность."

SP15_pier_specifics:
  source: SP_15_13330_2020
  rules:
    - id: masonry.pier.small_section_working_condition
      clause: "6.14 a"
      automation: validation_only
      dimension_semantics: constructive_product
      statement: "Для столбов и простенков площадью сечения 0,3 м² и менее расчетные сопротивления кладки сжатию из таблиц 6.1-6.10 в расчете умножают на коэффициент условий работы γc=0,8. Это расчетный коэффициент, а не минимально допустимая площадь."
      trigger: {cross_section_area_m2: {max: 0.3}}
      values: {gamma_c: 0.8}
      requires_calculation: true
      conflict_policy: "Не интерпретировать как 'простенок >0,3 м² автоматически проходит'. Все остальные проверки СП 15 сохраняются."

    - id: masonry.pier.wall_flexibility
      clause: "7.5"
      automation: manual_calculation
      statement: "В стенах, ослабленных проемами, при расчете простенков коэффициент продольного изгиба φ принимают по гибкости стены."
      requires_calculation: true

    - id: masonry.pier.narrow_in_plane_check
      clause: "7.5"
      automation: manual_calculation
      statement: "Если ширина простенка меньше толщины стены, дополнительно выполняют расчет простенка в плоскости стены; расчетную высоту при этой проверке принимают равной высоте проема."
      conditions:
        trigger: "pier_width < wall_thickness"
        in_plane_effective_height: "opening_height"
      requires_calculation: true

    - id: masonry.pier.analysis_width_uniform_transfer
      clause: "9.13 a"
      automation: manual_calculation
      statement: "Если покрытие обеспечивает равномерную передачу давления по всей длине опирания на стену, расчетную ширину стены с проемами принимают равной ширине между проемами; для стены без проемов — ширине участка между осями пролетов."
      requires_calculation: true
      conflict_policy: "Это правило расчетной модели, а не команда увеличивать/уменьшать архитектурный простенок."

    - id: masonry.pier.analysis_width_concentrated_support
      clause: "9.13 b"
      automation: manual_calculation
      statement: "При передаче бокового давления в местах опирания ферм/прогонов действуют специальные правила расчетной ширины стены/полки пилястры: 1/3H в каждую сторону от края пилястры, но не более 6h и ширины стены между проемами; при отсутствии пилястр и сосредоточенной нагрузке 1/3H отсчитывают от края распределительной плиты."
      variables:
        H: "wall height from fixity level"
        h: "wall thickness"
      requires_calculation: true
      conflict_policy: "Не использовать 1/3H или 6h как архитектурную норму ширины простенка. Это пределы расчетной ширины участка/полки в заданной расчетной схеме."

    - id: masonry.pier.FEM_model_choice
      clause: "9.24a, Change 1"
      automation: validation_only
      statement: "При КЭ-расчете стены следует моделировать пластинчатыми или объемными конечными элементами. Стержневая аппроксимация столба/колонны/простенка допускается только при одновременном выполнении геометрических условий п.9.24а."
      all_conditions_for_bar_approximation:
        long_side_to_short_side_ratio_max: 2.0
        storey_height_to_thickness_ratio_min: 4.2
        storey_height_to_width_ratio_min: 4.2
      effective_height_definition: "distance between top and bottom floor-structure levels"
      requires_calculation: true
      conflict_policy: "Условия разрешают только выбор расчетной аппроксимации; они не являются критерием нормативности геометрии самого простенка."

    - id: masonry.pier.lintel_end_stress_concentration
      clause: "Appendix D, D.3"
      automation: validation_only
      statement: "При проверке изгиба из плоскости учитывать возможность концентрации растягивающих напряжений, в том числе у концов надоконных перемычек и в углах проемов."
      requires_calculation: true

architecture_precheck_algorithm:
  type: design_procedure
  steps:
    - "1. Определить материал кладки, толщину стены, конструктивную роль стены, этаж/расчетную высоту и высоту проема."
    - "2. Наложить обязательные пожарные простенки/пояса из rules/18_facade_fire_openings.yaml."
    - "3. Определить требуемые размеры проемов в свету/по изделию и узлы перемычек."
    - "4. Сформировать архитектурные кандидаты ширины простенка, согласованные по возможности с модульной сеткой ГОСТ 28984 и раскладкой выбранного изделия."
    - "5. Для каждого кандидата вычислить только диагностические признаки: площадь сечения, pier_width < wall_thickness, геометрические отношения для маршрутизации расчетной модели."
    - "6. Передать кандидату статус needs_structural_calculation с геометрией, нагрузками и всеми триггерами СП 15."
    - "7. После КР принимать только кандидата с подтвержденной несущей способностью/устойчивостью; если КР увеличивает простенок, перестроить фасадную модульную раскладку."
    - "8. После изменения ширины повторно проверить окно, естественное освещение/инсоляцию, пожарные зоны, теплотехнический узел и кладочную раскладку."

required_structural_inputs:
  - wall_material_and_masonry_strength
  - mortar_or_adhesive_system
  - wall_thickness
  - pier_width_candidate
  - pier_cross_section_area
  - opening_height
  - storey_structural_height
  - support_conditions
  - vertical_loads_from_upper_storeys
  - floor_and_roof_reactions
  - load_eccentricity
  - wind_or_other_horizontal_actions_when_applicable
  - local_bearing_actions
  - openings_and_adjacent_pier_geometry

BIM_status_fields:
  - pier_geometry_status
  - pier_modular_candidate
  - pier_section_area_m2
  - small_section_gamma_c_trigger
  - narrow_pier_in_plane_check_required
  - pier_fire_check_status
  - pier_structural_check_status
  - pier_KR_calculation_reference
  - pier_load_case_reference
  - lintel_mark_or_system
  - lintel_KR_approval

agent_logic:
  - "Никогда не выдавать 380, 510, 600, 640, 790 мм или любое другое распространенное число как нормативный минимум несущего простенка без расчета."
  - "Порог 0,3 м² означает применение γc=0,8 в расчете, а не минимально допустимое сечение."
  - "Кратность кирпичу/блоку используется для технологичности раскладки после обязательных ограничений, а не вместо расчета."
  - "Если pier_width < wall_thickness, автоматически поднимать флаг narrow_pier_in_plane_check_required."
  - "Пожарные размеры из rules/18_facade_fire_openings.yaml относятся только к соответствующим противопожарным случаям и не являются общей нормой простенка."
  - "Результат архитектурного precheck не маркировать structurally_verified до получения результата КР."

