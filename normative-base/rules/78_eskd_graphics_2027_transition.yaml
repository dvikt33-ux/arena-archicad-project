checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Подтвержденный переход графического ядра ЕСКД на национальные ГОСТ Р 2.301-2.307:2026 с 01.10.2027 и правом досрочного применения. Для целевого профиля 2027+ новые редакции применяются заранее."

policy:
  apply_future_confirmed_now: true
  effective_from: 2027-10-01
  early_application_allowed: true
  statement: "Поскольку проекты базы рассчитаны на реализацию в 2027+ и пользователь требует заранее учитывать официально утвержденные изменения 2027 года, новые ГОСТ Р 2026 используются как target standards уже на стадии настройки шаблона."

