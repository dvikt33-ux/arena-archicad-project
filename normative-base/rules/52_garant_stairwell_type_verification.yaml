checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Независимая проверка типов лестничных клеток и связанных геометрических ограничений по системе ГАРАНТ."

verified_documents:
  - document: FEDERAL_LAW_123_FZ
    role: "classification of stairwell types"
    garant_url: "https://base.garant.ru/12161584/f9b0119a4fce7561a213cdc9af189098/"
  - document: SP_1_13130_2020
    garant_url: "https://base.garant.ru/74019594/"
    verified_changes: [1,2,3]

classification:
  source: FEDERAL_LAW_123_FZ
  article: "40"
  types:
    - {type: "L1", definition: "обычная лестничная клетка с естественным освещением через остекленные или открытые проемы в наружных стенах на каждом этаже"}
    - {type: "L2", definition: "обычная лестничная клетка с естественным освещением через остекленные или открытые проемы в покрытии"}
    - {type: "N1", definition: "незадымляемая лестничная клетка с входом с этажа через наружную воздушную зону по открытым переходам"}
    - {type: "N2", definition: "незадымляемая лестничная клетка с подпором воздуха в лестничную клетку при пожаре"}
    - {type: "N3", definition: "незадымляемая лестничная клетка с входом на каждом этаже через тамбур-шлюз с подпором воздуха"}

rules:
  - id: garant.stairwell.N1_exit_direct_outside
    source: SP_1_13130_2020
    clause: "4.4.11"
    automation: validation_only
    statement: "Лестничная клетка типа Н1 должна иметь выход только непосредственно наружу; допускается выход через тепловой тамбур."

  - id: garant.stairwell.light_opening_general
    source: SP_1_13130_2020
    clause: "4.4.12 with change 1"
    automation: conditional
    dimension_semantics: clear
    statement: "Для лестничных клеток, для которых требуется естественное освещение через наружную стену, суммарная площадь остекления должна соответствовать актуальному п. 4.4.12; машинное правило применяется только после проверки применимости исключений для Л2, подземных/цокольных этажей и разрешенных неосвещенных незадымляемых клеток."
    values:
      glazing_area_min_m2: 1.2
      one_glazed_dimension_min_mm: 600

  - id: garant.stairwell.L2_top_light
    source: SP_1_13130_2020
    clause: "4.4.12"
    automation: conditional
    statement: "Для лестничной клетки Л2 верхнее естественное освещение обеспечивают через световые проемы в покрытии либо световую шахту в области применения пункта."
    values:
      roof_light_opening_area_min_m2: 4.0
      gap_between_flights_min_mm: 700
      alternative_light_shaft_horizontal_area_min_m2: 2.0

  - id: garant.stairwell.N1_air_zone_geometry
    source: SP_1_13130_2020
    clause: "4.4.14"
    automation: conditional
    dimension_semantics: clear
    values:
      transition_clear_width_min_mm: 1200
      guardrail_height_min_mm: 1200
      solid_pier_between_openings_min_mm: 1200
    statement: "Переход через наружную воздушную зону Н1 должен иметь ширину не менее 1,2 м и ограждение не менее 1,2 м; глухой простенок между проемами лестничной клетки и коридора этажа — не менее 1,2 м."

  - id: garant.stairwell.L1_height_scope
    source: SP_1_13130_2020
    clause: "4.4.15"
    automation: conditional
    values: {building_height_max_m: 28}
    statement: "Лестничные клетки Л1 допускаются в зданиях всех классов функциональной пожарной опасности высотой до 28 м, а также в прямо предусмотренном СП случае надстройки одним этажом."

  - id: garant.stairwell.L2_height_scope
    source: SP_1_13130_2020
    clause: "4.4.16"
    automation: conditional
    statement: "Л2 допускается только в ограниченной области: здания I-III степеней огнестойкости, С0/С1, классов Ф1-Ф4 и, как правило, высотой не более 9 м; увеличение до 12 м допускается только при выполнении специальных условий пункта."
    values:
      general_height_max_m: 9
      conditional_height_max_m: 12
    conflict_policy: "Не применять 12 м как обычный предел. Требуется проверка всех условий п.4.4.16 и исключений."

  - id: garant.stairwell.over_28m_smokefree_gate
    source: SP_1_13130_2020
    clause: "4.4.18"
    automation: conditional
    statement: "Для зданий высотой более 28 м в общей области СП требуются незадымляемые лестничные клетки; тип и допустимые замены зависят от функционального класса и специальных условий."
    values: {height_trigger_m: 28}
    requires_object_classification: true

  - id: garant.stairwell.N2_opening_restrictions
    source: SP_1_13130_2020
    clause: "4.4.13"
    automation: validation_only
    statement: "Стены Н2 не должны получать произвольные дополнительные проемы; допускаются только предусмотренные пунктом неоткрываемые окна, двери в защищаемые помещения/коридоры/холлы/вестибюли или наружу и отверстия подпора воздуха."

revision_notes:
  - "Изменение №1 скорректировало п.4.4.12; при коллизии краткого консолидированного отображения и текста изменения использовать текст изменения."
  - "Изменение №2 скорректировало специальные требования для Ф1.3, в том числе п.4.4.18; для МКД применять совместно с разделом 6 СП 1."
  - "Не использовать старый СП 1.13130.2009 как нормативную базу новой модели."

agent_logic:
  - "Тип лестничной клетки является классификацией пожарной безопасности, а не стилем библиотечного объекта Archicad."
  - "До генерации лестничной клетки определить высоту здания по пожарной семантике, функциональный класс, степень огнестойкости, класс конструктивной пожарной опасности и требование дымозащиты."
  - "Не заменять Н1 на Н2/Н3 или наоборот без проверки специального пункта для конкретного функционального класса."
  - "Не добавлять окна/двери в Н2 ради фасада или планировки без отдельной нормативной проверки."

