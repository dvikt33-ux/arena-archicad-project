  - "Текущий консолидированный текст 5.2/таблицы 5.1, 5.11 и 5.12 прочитан напрямую в ГАРАНТ 2026-10-04."
  - "А.1.4 и примечание 1 прочитаны напрямую на странице приложения А ГАРАНТа."
  - "ГАРАНТ отображает конфликтующие даты введения Изм. №1 и №2; для revision metadata используются официальные даты Росстандарта."
