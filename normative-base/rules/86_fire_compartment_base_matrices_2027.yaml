checked_at: 2026-10-01
target_profile: RU_2027_PLUS
primary_document: SP_2_13130_2020
verified_changes: [1, 2]
purpose: >-
  Базовые матрицы допустимой пожарной высоты и площади этажа в пределах пожарного отсека
  для многоквартирных жилых зданий Ф1.3, основной группы общественных зданий,
  предприятий бытового обслуживания Ф3.5 и предприятий торговли Ф3.1.
  Только базовые табличные значения; специальные увеличения и исключения требуют отдельного подтверждения.

revision_state:
  status: active
  official_card: https://protect.gost.ru/sp/details/90783c81-7eaa-4b90-b774-55ad27e6dfa1
  latest_verified_change: 2
  change_2_effective_from: 2026-01-01

scope_router:
  - id: fire.compartment.route_by_function
    source_clause: "6.5.1; 6.7.1"
    automation: mandatory_router
    routes:
      F1_3_multifamily_or_apartment_type_dormitory: table_6_8
      F3_1_trade: table_6_11
      F3_5_consumer_services: table_6_10
      public_general_within_6_7_1: table_6_9
    hard_gate: >-
      До выбора таблицы определить функциональный класс пожарной опасности и проверить,
      не устанавливает ли СП 2 либо специальный функциональный СП отдельные требования.
      Для высотных зданий в области СП 550 использовать rules/47_highrise_fire_2027.yaml.

common_semantics:
  fire_height: "пожарная высота по применимым пожарным нормам, не архитектурная высота до конька/парапета"
  compartment_area: "площадь этажа в пределах пожарного отсека"
  floor_count: "надземные этажи без верхнего технического этажа там, где это прямо указано таблицей"
  rule: >-
    Табличная строка задает допустимую комбинацию параметров, а не независимые максимумы.
    Нельзя взять высоту из одной строки и площадь отсека из другой.

