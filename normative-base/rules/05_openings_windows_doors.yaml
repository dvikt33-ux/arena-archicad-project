checked_at: 2026-09-30
primary_documents: [GOST_23166_2024, GOST_30971_2012, GOST_30674_2023, GOST_R_56926_2016]

opening_coordination:
  - id: opening.modular_preference
    source: GOST_28984_2011
    auto_rule: false
    statement: "Для размеров проемов и простенков предпочтительно использовать согласованную модульную систему, в частности мультимодули 3M/6M, если это совместимо с конструктивной системой и изделием."
  - id: opening.not_equal_window_block
    auto_rule: true
    statement: "Размер строительного проема не равен габариту оконного/дверного блока: модель должна хранить отдельные параметры блока, проектного монтажного зазора и проема."

window_mounting_joint:
  source: GOST_30971_2012
  clause: "5.2"
  status: active
  rules:
    - id: window.gap.design_required
      auto_rule: true
      statement: "Минимальный монтажный зазор выбирают с учетом конструкции оконного блока и свободного температурного расширения; проектный зазор рекомендуется дополнительно подтверждать расчетом температурного изменения."
    - id: window.gap.long_facade
      auto_rule: false
      statement: "Для ленточного остекления длиной более 6 м и фасадного остекления монтажный зазор назначают по техническому расчету/рекомендациям производителя профильной системы."
    - id: window.opening_project_geometry
      source_clause: "5.2.2"
      auto_rule: true
      statement: "Размеры и конфигурация оконных проемов должны соответствовать рабочей проектной документации."
    - id: window.opening_geometry_tolerance
      source_clause: "5.2.3"
      auto_rule: false
      max_deviation_vertical_horizontal_mm_per_m: 4.0
      note: "Это требование к выполненному проему/контролю, а не основание намеренно закладывать геометрическую ошибку в BIM-модель."
    - id: window.gap.max_recommended
      source_clause: "5.2.1"
      auto_rule: false
      recommended_max_mm: 60
      note: "Максимум определяется характеристиками материала центрального слоя; число 60 мм является рекомендуемым пределом, а не универсальным проектным зазором."

pvc_windows:
  document: GOST_30674_2023
  status: active
  effective_from: 2024-08-01
  scope_note: "ПВХ оконные/балконные блоки со стеклопакетами для стеновых проемов жилых, общественных и промышленных зданий высотой не более 75 м; также балконное остекление."
  correction: "ИУС 10-2024"

residential_windows:
  document: GOST_R_56926_2016
  status: active
  amendments: [1]
  corrections: ["ИУС 11-2022"]
  scope_note: "оконные и балконные конструкции жилых зданий высотой не более 75 м и другие случаи в области применения стандарта"

window_general:
  document: GOST_23166_2024
  status: active
  effective_from: 2024-04-01
  rule: "Габариты, схема открывания, масса и размеры створок должны проверяться по действующему стандарту и документации профильной системы/изготовителя; не создавать произвольный библиотечный оконный блок только по размеру проема."

doors:
  transition_on_check_date:
    current_on_2026_09_30: GOST_475_2016
    new_from_2026_10_01: GOST_475_2026
    policy: "Перед использованием деревянных/комбинированных дверных блоков проверять дату проекта. Не помечать ГОСТ 475-2026 действующим до 2026-10-01."
  fire_and_egress_policy:
    - "Размер эвакуационного выхода проверять по СП 1.13130.2020 и специальному СП здания, а не только по каталожному размеру двери."
    - "Хранить отдельно размер строительного проема, габарит коробки и размер прохода в свету."

agent_logic:
  - "Не вычислять ширину оконного простенка только как остаток между равными окнами: сначала проверить несущую схему, перевязку/материал кладки, перемычку, пожарные простенки при необходимости и теплотехнический узел."
  - "Для кирпичной стены согласовывать положение грани проема с раскладкой кладки, но производные кирпичные шаги не превращать в обязательный общий модуль фасада."
  - "При выборе библиотечного окна/двери сначала определить нормативную область применения изделия, затем габарит блока и монтажный узел, затем строительный проем."
  - "Не применять рекомендации производителя вместо обязательного расчета/нормы, но использовать их там, где норматив прямо отсылает к профильной системе."

sources:
  - https://protect.gost.ru/gost/details/09b731bf-531e-428b-8ef9-556ed2d1c110
  - https://protect.gost.ru/gost/details/9752bc68-35b0-4050-a283-5fe58e0469d9
  - https://protect.gost.ru/gost/details/9094369f-29f6-4a0a-80f6-fedf98c70679
