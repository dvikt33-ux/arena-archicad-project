checked_at: 2026-09-30
primary_documents: [GOST_25772_2025, SP_54_13330_2022, SP_118_13330_2022, SP_17_13330_2017]

metal_guardrail_types:
  source: GOST_25772_2025
  clause: "4.2, table 1"
  types:
    - {code: "МВ", purpose: "internal stair flight/stair"}
    - {code: "МН", purpose: "external stair flight/stair"}
    - {code: "МД", purpose: "stair in general-education and preschool organizations"}
    - {code: "ПВ", purpose: "internal stair landing"}
    - {code: "ПН", purpose: "external stair landing"}
    - {code: "ПД", purpose: "landing in general-education and preschool organizations"}
    - {code: "БП", purpose: "balcony/loggia, building height <=30 m"}
    - {code: "БВ", purpose: "balcony/loggia, building height >30 m"}
    - {code: "БД", purpose: "balcony/loggia of general-education and preschool organizations"}
    - {code: "БЛ", purpose: "balcony/loggia of smoke-free stairwell"}
    - {code: "КО", purpose: "roof without parapet"}
    - {code: "КП", purpose: "roof with parapet"}
    - {code: "КЭО", purpose: "operated roof without parapet"}
    - {code: "КЭП", purpose: "operated roof with parapet"}

standard_parameters:
  source: GOST_25772_2025
  clause: "5.1.1, table 3"
  auto_rule: conditional
  rows:
    - {type: "МВ", H_mm: 900, h_mm: 800, a_max_mm: 150, b_mm: 300}
    - {type: "МН", H_mm: 1200, h_mm: 1100, a_max_mm: 150, b_mm: 300}
    - {type: "МД", H_mm: 1200, h_mm: 1180, a_max_mm: 100}
    - {type: "ПВ", H_mm: 900, h_mm: 800, a_max_mm: 150, b_mm: 300}
    - {type: "ПН", H_mm: 1200, h_mm: 1100, a_max_mm: 150, b_mm: 300}
    - {type: "ПД", H_mm: 1200, h_mm: 1180, a_max_mm: 100}
    - {type: "БП", H_mm: 1000, h_mm: 900, a_max_mm: 110, b_mm: 300}
    - {type: "БВ", H_mm: 1100, h_mm: 1000, a_max_mm: 110, b_mm: 300}
    - {type: "БД", H_mm: 1200, h_mm: 1180, a_max_mm: 100}
    - {type: "БЛ", H_mm: 1200, h_mm: 1100, a_max_mm: 110, b_mm: 300}
    - {type: "КП", H_mm: "600/1200 minus parapet height where applicable", a_max_mm: 300}
    - {type: "КО", H_mm: "600/1200", a_max_mm: 300}
  critical_note: >-
    Таблица ГОСТ описывает стандартизованные металлические изделия. Проектная требуемая высота
    ограждения определяется также СП конкретного здания; применять большее/более строгое требование.

residential_project_requirements:
  source: SP_54_13330_2022
  clauses: ["6.4.4","6.4.5","6.4.11"]
  rules:
    - {case: "external stairs/landings, balconies, French balconies, loggias, terraces, dangerous floor level difference >=0.45 m", min_height_mm: 1200}
    - {case: "balcony/French balcony/terrace less than 0.45 m above ground planning level", min_height_mm: 900}
    - {case: "internal stair flights/landings", min_height_mm: 900}
    - {case: "internal stair gap >0.12 m clear", min_height_mm: 1200}
  roof_policy: "Высота/необходимость ограждения кровли зависит от уклона и высоты до карнизного свеса; применять п. 6.4.11 СП 54 совместно с СП 17.13330.2017 и профильными пожарными требованиями."

public_project_requirements:
  source: SP_118_13330_2022
  clause: "6.12"
  rules:
    - {case: "external balconies/loggias/galleries/type-3 stairs/terraces/operated roofs", min_height_mm: 1200}
    - {case: "internal guardrails incl. stairs and ramps", min_height_mm: 900}
    - {case: "stair/ramp flight gap >0.3 m OR floor level difference >1.0 m OR rooms where children may be present", min_height_mm: 1200}

roof_standard:
  document: SP_17_13330_2017
  status: active
  latest_verified_change: 5
  role: "roof design; do not infer roof buildup, slopes or safety elements from BIM library defaults"

agent_logic:
  - "Сначала классифицировать место ограждения и функциональное назначение здания, затем выбрать тип изделия."
  - "Высоту из ГОСТ на изделие не считать автоматически достаточной: проверить СП здания и требования безопасности/МГН."
  - "Не путать высоту изделия H, высоту поручня h и проектную высоту ограждения."
  - "Для детских/образовательных объектов не применять обычный тип МВ/ПВ/БП без проверки специальных требований."
  - "Парапет и металлическое ограждение кровли моделировать раздельно, если нормативная высота получается суммарно/с вычетом парапета."

sources:
  - https://protect.gost.ru/gost/details/0201c996-021b-408c-b36e-778f77f18f70
  - https://protect.gost.ru/sp/details/844352c5-dda6-4006-acd8-b6875d1ed6a8
