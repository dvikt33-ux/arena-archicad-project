agent_gate:
  - "Перед применением санитарного правила определить target_date и вид объекта/услуги."
  - "Не использовать SP_2_1_3678_20 для проекта 2027 как действующий документ."
  - "Не считать любой внутренний санузел автоматически 'общественным туалетом' по разделу 101 SP_2_1_4284_26; сначала проверить классификацию и область применения."
  - "После 2027-03-01 не применять числовые нормы SANPIN_1_2_3685_21 к новому проекту без подтвержденной правовой основы/официальной замены."

