key_scope_findings:
  - id: PARKING_IS_INDEPENDENT_PROFILE
    statement: >-
      SP113 parking scope is evaluated independently from TRK/MKD/public host class; an ordinary
      private IZHS garage or EV charger does not activate SP113 automatically.
  - id: MEDICAL_EMBEDDED_ZONE
    statement: >-
      SP158 explicitly covers medical-purpose premises embedded in residential, public and
      production buildings, so the medical profile attaches to the zone rather than replacing the host profile.
  - id: INDUSTRIAL_F5_EMBEDDED_ZONE
    statement: >-
      SP56 covers applicable F5.1/F5.2 rooms including embedded rooms in buildings of other functional
      fire classes; excluded special storage/production categories require separate routes.
  - id: HIGHRISE_IS_OVERLAY
    statement: >-
      SP267 supplements the underlying functional profile and never replaces MKD/public/mixed-use/hotel routing.
  - id: MIXED_USE_ZONE_ROUTING
    statement: >-
      SP160 and SP456 require independent classification of active functional zones and do not justify
      applying cinema/sport/hotel/parking rules to absent functions.

