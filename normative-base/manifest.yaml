    manifest: izh/manifest.yaml
    target_profile: RU_2027_PLUS
    scope: detached_single_family_houses_within_SP55_scope

hard_fail_states:
  - yaml_parse_error
  - duplicate_rule_id
  - missing_target_profile
  - source_status_unknown
  - superseded_document_used_as_current
  - rule_revision_below_official_latest
  - adjacent_discipline_revision_below_official_latest
  - functional_amendment_effective_status_ambiguous
  - sanitary_source_repealed
  - rule_expired_for_target
  - future_replacement_is_only_draft
  - future_document_not_active
  - required_calculation_missing
  - required_manufacturer_data_missing
  - dimension_semantics_unknown
  - object_classification_missing
  - package_scope_mismatch

release_gate:
  require:
    - all YAML files parse successfully
    - no duplicate machine rule ids across rules and loaded packages
    - no automatic rule references a superseded clause or superseded document for target 2027
    - numeric automatic rules have source document and clause or table
    - future transitions have official effective dates
    - core rule files match revision_watch_2027.yaml
    - adjacent discipline coordination inputs match revision_watch_adjacent_2027.yaml when used
    - special functional rules match functional_revision_audit_2027.yaml when used
    - sanitary references match sanitary_registry_2027.yaml when used
    - draft and accepted-but-not-active normative documents are never marked active
    - clear dimensions are validated as clear dimensions
    - pending topics remain fail-closed
    - loaded package target_profile matches RU_2027_PLUS
