checked_at: 2026-10-03
target_profile: RU_2027_PLUS
purpose: "Маршрутизатор специальных СП по функциональному назначению здания. Общие нормы не применяются вместо специальных требований конкретного типа объекта."

base_documents:
  - {document: SP_118_13330_2022, role: "general public buildings", verified_changes: [1,2,3,4,5]}
  - {document: SP_54_13330_2022, role: "multifamily residential buildings", verified_changes: [1,2]}
  - {document: SP_1_13130_2020, role: "egress", verified_changes: [1,2,3]}
  - {document: SP_59_13330_2020, role: "accessibility", verified_changes: [1,2,3,4]}

routing_rules:
  - id: functional.router.classification_required
    automation: forbidden_to_infer
    statement: "До применения специальных геометрических норм агент обязан определить функциональное назначение здания и, при смешанном объекте, назначение каждого пожарного отсека/функциональной части."
    requires_object_classification: true

  - id: functional.router.special_over_general
    automation: auto
    statement: "Специальный СП применяется в своей области совместно с общими СП; общий СП 118 не должен заменять специальные требования школы, сада, больницы, гостиницы, спорта, ТРК и т. п."

  - id: functional.router.single_family_to_SP55
    automation: auto
    statement: "Для одноквартирного жилого дома, подтвержденно входящего в область СП 55.13330.2016, загружать профиль IZHS/SP55; не подменять его профилем МКД СП 54 или общим общественным СП 118."
    requires_object_classification: true
    scope_gate: "object_within_SP55_scope"

