legacy_gate:
  - id: eskd2027.legacy_numeric_rules_block
    automation: forbidden_to_infer
    statement: "Числовые параметры линий, штриховок, шрифтов, масштабов и нанесения размеров из старых ГОСТ нельзя автоматически переносить в target 2027, если соответствующее положение нового ГОСТ Р 2026 еще не сверено по официальному полному тексту. Статус замены подтверждает смену источника, но не доказывает тождество конкретного числа."

  - id: eskd2027.spds_specific_rules_preserved
    automation: validation_only
    statement: "Прямые специальные требования ГОСТ Р 21.101-2026, ГОСТ 21.501-2018, ГОСТ 21.508-2020, ГОСТ 21.204-2020 и других СПДС сохраняются как самостоятельные правила. Общий переход ЕСКД не отменяет специальную строительную норму, если она прямо задает тип линии, размер, масштаб или обозначение."

  - id: eskd2027.current_text_required_for_template_constants
    automation: forbidden_to_infer
    statement: "До получения полного официального текста каждого ГОСТ Р 2.301-2.307:2026 не фиксировать в Archicad-шаблоне как нормативные те числовые константы, которые берутся только из заменяемого ЕСКД. Разрешены лишь значения, независимо подтвержденные специальным СПДС или новым официальным текстом."
    requires_manufacturer_data: false

agent_logic:
  - "При конфликте старого ЕСКД и подтвержденного target ГОСТ Р 2026 использовать target ГОСТ Р."
  - "Не считать право досрочного применения необязательным для нашей базы: target profile сознательно выбирает раннее применение, чтобы проект не устарел к реализации."
  - "Специальные строительные СПДС имеют приоритет в своей области; ЕСКД используется там и так, как на него ссылается СПДС."
  - "После появления официального полного текста новых ГОСТ Р выполнить постатейный аудит и только затем разрешить новые числовые auto-rules."

