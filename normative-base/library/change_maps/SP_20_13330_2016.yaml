    direct_text_url: "https://base.garant.ru/400437201/"
    direct_text_read: true
    impact_on_locator_10_2: none_found_in_full_change_text
    note: "Изменения раздела 10 затрагивают 10.4 и другие положения, но не 10.2."

  - number: 4
    approval_order: "430/пр"
    approval_date: 2022-05-30
    effective_from: 2022-06-29
    official_card: "https://protect.gost.ru/sp/changesdetails/2bfd1441-d243-49cf-a5a8-5c34de838b95"
    direct_text_url: "https://base.garant.ru/405001743/"
