    routing_paragraphs_1_and_2_affected: false

  - number: 6
    approval_order: "597/пр"
    approval_date: 2024-09-05
    effective_from: 2024-09-25
    official_card: "https://protect.gost.ru/sp/changesdetails/e26e8b63-c763-4846-a800-a2a79586c725"
    direct_text_url: "https://base.garant.ru/410503722/"
