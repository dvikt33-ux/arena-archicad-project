checked_at: 2026-10-02
target_profile: RU_2027_PLUS
package: CONSTRUCTION_NODE_ENGINE

graph_id: CONSTRUCTION_NODE_SELECTOR_GRAPH_V4

entrypoints:
  build_foundation_system: foundation_system_graph
  build_foundation_wall_connection: foundation_wall_graph
  build_floor_system: floor_system_graph
  build_floor_support_nodes: floor_support_graph
  build_column_foundation_node: column_foundation_graph
  build_column_floor_node: column_floor_graph
  build_beam_floor_node: beam_floor_graph
  build_stair_landing_node: stair_landing_graph
  build_parapet_node: parapet_graph
  build_facade_slab_edge_node: facade_edge_graph
  build_balcony_loggia_node: balcony_loggia_graph
  build_entrance_external_stair_node: entrance_external_stair_graph
  build_deformation_joint_node: deformation_joint_graph
  build_external_wall_system: external_wall_system_graph
  build_window_door_opening_nodes: opening_graph
  build_wall_continuity_nodes: wall_continuity_graph

foundation_system_graph:
  - gate: require_geotech_and_loads
    if_missing: blocked_waiting_for_geotech_or_KR
  - gate: approved_foundation_system_present
    if_true: dispatch_to_assembly_by_exact_system
    if_false: return_candidate_set_from_01_foundation_selector
  - gate: execution_requested
    require: KR_approved_foundation_system
    if_missing: blocked_waiting_for_KR

foundation_wall_graph:
  - key: foundation_system
  - key: wall_structural_material
  - key: basement_state
  - key: below_grade_state
  - key: external_envelope_state
  - route:
      when: ["foundation_system in {shallow_strip_rc,raft_rc}", "wall_structural_material=masonry"]
      node_candidates: [FDN_001_STRIP_RC_TO_MASONRY, FDN_003_RAFT_TO_EXTERNAL_MASONRY_WALL]
  - route:
      when: ["foundation_system in {shallow_strip_rc,raft_rc}", "wall_structural_material=reinforced_concrete"]
      node_candidates: [FDN_002_STRIP_RC_TO_RC_WALL]
  - route:
      when: ["foundation_system=raft_rc", "wall_structural_material=AAC"]
      node_candidates: [FDN_004_RAFT_TO_AAC_EXTERNAL_WALL]
  - route:
      when: ["basement_state=present", "wall_structural_material=reinforced_concrete"]
      node_candidates: [FDN_005_RAFT_TO_BASEMENT_RC_WALL]
  - route:
      when: ["foundation_system=pile_raft_rc"]
      node_candidates: [FDN_006_PILE_RAFT_TO_RC_WALL_OR_COLUMN]
  - route:
      when: ["foundation_system=isolated_pad_rc"]
      node_candidates: [FDN_007_ISOLATED_PAD_TO_COLUMN]
  - route:
      when: ["foundation_system=precast_strip_FBS_FL"]
      node_candidates: [FDN_008_PRECAST_FL_FBS_TO_WALL]
  - ambiguity_policy: choose_exact_host_and_material_signature_or_block

floor_system_graph:
  - gate: require_KR_floor_system_status
    if_missing: blocked_waiting_for_KR
  - gate: product_family_required_if_precast
    if_missing: blocked_waiting_for_product_data
  - dispatch:
      monolithic_rc_flat_slab: monolithic_rc_flat_slab
      monolithic_rc_beam_slab: monolithic_rc_beam_slab
      precast_hollow_core_PC: precast_hollow_core_PC
      precast_hollow_core_PB: precast_hollow_core_PB
      precast_solid_or_ribbed: precast_solid_or_ribbed

floor_support_graph:
  - route:
      when: ["floor_system=monolithic_rc_flat_slab", "support_material=reinforced_concrete_wall"]
      node_candidates: [FLR_001_MONOLITHIC_SLAB_TO_RC_WALL]
  - route:
      when: ["floor_system=monolithic_rc_beam_slab", "support_material=reinforced_concrete_beam"]
      node_candidates: [FLR_002_MONOLITHIC_SLAB_TO_RC_BEAM]
  - route:
      when: ["floor_system=precast_hollow_core_PC", "support_material=masonry"]
      node_candidates: [FLR_003_PC_TO_MASONRY_WALL, BRG_PC_END_ON_MASONRY]
  - route:
      when: ["floor_system=precast_hollow_core_PB", "support_material=masonry"]
      node_candidates: [FLR_004_PB_TO_MASONRY_WALL, BRG_PB_END_ON_MASONRY]
  - route:
      when: ["floor_system in {precast_hollow_core_PC,precast_hollow_core_PB}", "support_material=reinforced_concrete_wall"]
      node_candidates: [FLR_005_PRECAST_TO_RC_SUPPORT, BRG_PC_OR_PB_ON_RC_WALL]
  - route:
      when: ["floor_system in {precast_hollow_core_PC,precast_hollow_core_PB}", "support_material=reinforced_concrete_beam"]
      node_candidates: [FLR_005_PRECAST_TO_RC_SUPPORT, BRG_PC_OR_PB_ON_RC_BEAM]
  - overlay_if:
      external_envelope: FLR_006_SLAB_EDGE_EXTERNAL_WALL
      project_joint_present: FLR_008_FLOOR_DEFORMATION_JOINT
      MEP_penetration_requested: FLR_007_STRUCTURAL_FLOOR_OPENING

column_foundation_graph:
  - gate: require_KR_foundation_and_column_geometry
    if_missing: blocked_waiting_for_KR
  - route:
      when: ["foundation_system=isolated_pad_rc", "column_material=reinforced_concrete"]
      node_candidates: [COL_FDN_001_RC_COLUMN_TO_ISOLATED_PAD]
  - route:
      when: ["foundation_system=raft_rc", "column_material=reinforced_concrete"]
      node_candidates: [COL_FDN_002_RC_COLUMN_TO_RAFT]
  - route:
      when: ["foundation_system in {pile_cap_rc,pile_raft_rc}", "column_material=reinforced_concrete"]
      node_candidates: [COL_FDN_003_RC_COLUMN_TO_PILE_CAP]

column_floor_graph:
  - gate: require_KR_column_floor_joint
    if_missing: blocked_waiting_for_KR
  - route:
      when: ["floor_system=monolithic_rc_flat_slab", "column_material=reinforced_concrete"]
      node_candidates: [COL_FLR_001_RC_COLUMN_TO_FLAT_SLAB]
  - route:
      when: ["floor_system=monolithic_rc_beam_slab", "column_material=reinforced_concrete"]
      node_candidates: [COL_FLR_002_RC_COLUMN_TO_BEAM_SLAB_FRAME]

beam_floor_graph:
  - route:
      when: ["floor_system=monolithic_rc_beam_slab"]
      node_candidates: [BEAM_FLR_001_RC_BEAM_TO_MONOLITHIC_SLAB]
  - route:
      when: ["floor_system in {precast_hollow_core_PC,precast_hollow_core_PB,precast_solid_or_ribbed}"]
      node_candidates: [BEAM_FLR_002_RC_BEAM_TO_PRECAST_SLAB]

stair_landing_graph:
  - gate: require_KR_stair_geometry_and_AR_egress_check
    if_missing: blocked_waiting_for_KR_or_AR_check
  - route:
      when: ["stair_system=monolithic_rc", "landing_system=monolithic_rc"]
      node_candidates: [STR_LDG_001_MONOLITHIC_STAIR_TO_MONOLITHIC_LANDING]
  - route:
      when: ["stair_system=precast_rc"]
      node_candidates: [STR_LDG_002_PRECAST_FLIGHT_TO_PRECAST_LANDING]
  - overlay_if:
      support_material_reinforced_concrete_wall: STR_LDG_003_STAIR_TO_RC_WALL_SUPPORT

parapet_graph:
  - route:
      when: ["roof_type=flat", "parapet_material=reinforced_concrete"]
      node_candidates: [PAR_001_RC_PARAPET_TO_FLAT_ROOF_SLAB]
  - route:
      when: ["roof_type=flat", "parapet_material=masonry"]
      node_candidates: [PAR_002_MASONRY_PARAPET_TO_ROOF_EDGE]
  - overlay_if:
      project_joint_present: PAR_003_PARAPET_AT_DEFORMATION_JOINT

facade_edge_graph:
  - gate: require_KR_slab_edge_geometry
    if_missing: blocked_waiting_for_KR
  - route:
      when: ["facade_system=masonry_or_multilayer_masonry"]
      node_candidates: [FCD_EDGE_001_MASONRY_EXTERNAL_WALL_AT_SLAB_EDGE]
  - route:
      when: ["facade_system=ventilated_facade"]
      node_candidates: [FCD_EDGE_002_VENTILATED_FACADE_AT_SLAB_EDGE]
  - route:
      when: ["facade_system=curtain_wall"]
      node_candidates: [FCD_EDGE_003_CURTAIN_WALL_AT_SLAB_EDGE]

balcony_loggia_graph:
  - gate: require_KR_external_slab_geometry
    if_missing: blocked_waiting_for_KR
  - route:
      when: ["projection_type=cantilever", "structural_system=monolithic_rc"]
      node_candidates: [BAL_001_MONOLITHIC_CANTILEVER_SLAB_AT_FACADE]
  - route:
      when: ["projection_type=recessed_loggia"]
      node_candidates: [BAL_002_LOGGIA_SLAB_BETWEEN_SIDE_WALLS]
  - overlay_if:
      thermal_break_required: BAL_003_THERMAL_BREAK_CANTILEVER_INTERFACE
      guard_required: BAL_004_BALCONY_EDGE_RAILING_SUPPORT

entrance_external_stair_graph:
  - route:
      when: ["entrance_type=external_platform"]
      node_candidates: [ENT_001_ENTRANCE_PLATFORM_AT_EXTERNAL_DOOR]
  - overlay_if:
      independent_external_foundation: ENT_002_PORCH_FOUNDATION_SEPARATED_FROM_MAIN_BUILDING
      external_rc_stair_present: ENT_003_EXTERNAL_RC_STAIR_TO_PLATFORM
      canopy_present: ENT_004_CANOPY_SUPPORT_AT_ENTRANCE

deformation_joint_graph:
  - gate: require_KR_joint_axis_and_movement_range
    if_missing: blocked_waiting_for_KR
  - route:
      when: ["joint_scope=vertical_through_structure"]
      node_candidates: [JNT_001_STRUCTURAL_DEFORMATION_JOINT_VERTICAL]
  - overlay_if:
      finish_crosses_structural_joint: JNT_002_FLOOR_FINISH_JOINT_OVER_STRUCTURAL_JOINT
      envelope_crosses_structural_joint: JNT_003_FACADE_DEFORMATION_JOINT
      roof_crosses_structural_joint: JNT_004_ROOF_DEFORMATION_JOINT
      joint_below_grade: JNT_005_BELOW_GRADE_DEFORMATION_JOINT_WATERSTOP

external_wall_system_graph:
  - gate: require_wall_system_and_facade_system
    if_missing: blocked_waiting_for_AR_or_product_data
  - compose:
      base_transition_if_present: WALL_001_PLINTH_TO_EXTERNAL_WALL
      floor_edge_if_present: facade_edge_graph
      external_corner_if_present: WALL_002_EXTERNAL_CORNER_MASONRY_OR_MULTILAYER
      openings_if_present: opening_graph
      wall_top_if_eaves_or_cornice: WALL_003_EXTERNAL_WALL_TO_EAVES_OR_CORNICE
      facade_transition_if_present: WALL_004_FACADE_SYSTEM_TRANSITION_AT_CORNER_OR_RETURN
  - gate: validate_envelope_contours_after_composition
    require: [thermal_continuity, bulk_water, air_tightness_if_applicable, vapor_control_if_applicable, fire_if_applicable]
    if_missing: blocked_unresolved_envelope_contour

opening_graph:
  - gate: require_structural_opening_geometry
    if_missing: blocked_waiting_for_AR_or_KR
  - route:
      when: ["opening_type=window", "external_wall=true"]
      node_candidates: [OPN_001_WINDOW_BLOCK_IN_EXTERNAL_WALL]
  - route:
      when: ["opening_type=door", "external_wall=true"]
      node_candidates: [OPN_002_EXTERNAL_DOOR_BLOCK_IN_WALL]
  - overlay_if:
      facade_system_SFTK: OPN_003_WINDOW_OR_DOOR_IN_SFTK_FACADE
      facade_system_ventilated: OPN_004_WINDOW_OR_DOOR_IN_VENTILATED_FACADE
      lintel_system_precast_rc: OPN_HEAD_001_PRECAST_RC_LINTEL_OVER_MASONRY_OPENING
      lintel_system_project_specific: OPN_HEAD_002_MONOLITHIC_OR_STEEL_LINTEL_BY_KR
      exposed_window_sill: OPN_SILL_001_EXTERNAL_WINDOW_SILL_DRAINAGE_INTERFACE
      insulated_reveal_required: OPN_REVEAL_001_INSULATED_EXTERNAL_REVEAL
      quarter_required: OPN_QUARTER_001_MASONRY_OR_PRODUCT_QUARTER
  - gate: verify_product_mounting_joint_and_clearance_inputs
    if_missing: blocked_waiting_for_product_data_or_project_detail

wall_continuity_graph:
  - route:
      when: ["interface=plinth_to_external_wall"]
      node_candidates: [WALL_001_PLINTH_TO_EXTERNAL_WALL]
  - route:
      when: ["interface=external_corner"]
      node_candidates: [WALL_002_EXTERNAL_CORNER_MASONRY_OR_MULTILAYER]
  - route:
      when: ["interface=wall_top_eaves_or_cornice"]
      node_candidates: [WALL_003_EXTERNAL_WALL_TO_EAVES_OR_CORNICE]
  - route:
      when: ["interface=facade_system_transition"]
      node_candidates: [WALL_004_FACADE_SYSTEM_TRANSITION_AT_CORNER_OR_RETURN]

resolution_order:
  - hard_fail_gates
  - exact_project_KR_system
  - exact_product_family
  - host_material_and_geometry
  - exposure_and_envelope_overlays
  - node_specific_blockers
  - compile_execution_graph

no_match_result: blocked_no_verified_node
multiple_equal_match_result: blocked_ambiguous_node_selection
