  effective_from: 2027-03-01
  clauses:
    - "9.1.1"
    - "9.1.3"
    - "9.2.4"
    - "9.2.8"
    - "9.2.12"
    - "9.2.13"
    - "9.2.14"
    - "9.2.15"
    - "9.3.1"
    - "9.4.1"
    - "9.4.2"
