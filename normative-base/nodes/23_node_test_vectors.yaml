checked_at: 2026-10-02
target_profile: RU_2027_PLUS
package: CONSTRUCTION_NODE_ENGINE
suite_id: CONSTRUCTION_NODE_SELECTOR_TESTS_V2

tests:
  - test_id: foundation_missing_geotech_blocks
    intent: build_foundation_system
    inputs:
      structural_scheme: wall_bearing
      loads_revision: KR_LOADS_01
      engineering_geology_revision: null
    expected:
      status: blocked_waiting_for_geotech_or_KR

  - test_id: strip_masonry_selects_FDN001
    intent: build_foundation_wall_connection
    inputs:
      foundation_system: shallow_strip_rc
      wall_structural_material: masonry
      KR_support_zone_verified: true
      moisture_strategy_present: true
    expected:
      node_id: FDN_001_STRIP_RC_TO_MASONRY

  - test_id: raft_aac_selects_FDN004
    intent: build_foundation_wall_connection
    inputs:
      foundation_system: raft_rc
      wall_structural_material: AAC
      below_grade_AAC: false
      KR_support_zone_verified: true
      AAC_product_present: true
      moisture_separation_present: true
    expected:
      node_id: FDN_004_RAFT_TO_AAC_EXTERNAL_WALL

  - test_id: below_grade_aac_rejected
    intent: build_foundation_wall_connection
    inputs:
      foundation_system: raft_rc
      wall_structural_material: AAC
      below_grade_AAC: true
    expected:
      status: blocked_no_verified_node

  - test_id: pile_raft_without_pile_design_blocks
    intent: build_foundation_wall_connection
    inputs:
      foundation_system: pile_raft_rc
      pile_design_revision: null
    expected:
      status: blocked_waiting_for_KR

  - test_id: pc_masonry_selects_support_and_bearing_nodes
    intent: build_floor_support_nodes
    inputs:
      floor_system: precast_hollow_core_PC
      support_material: masonry
      verified_PC_mark: true
      KR_bearing_length: 1
      KR_support_check: true
    expected:
      node_ids: [FLR_003_PC_TO_MASONRY_WALL, BRG_PC_END_ON_MASONRY]

  - test_id: pb_missing_manufacturer_geometry_blocks
    intent: build_floor_support_nodes
    inputs:
      floor_system: precast_hollow_core_PB
      support_material: masonry
      manufacturer_PB_geometry: null
      KR_bearing_length: 1
    expected:
      status: blocked_waiting_for_product_data

  - test_id: precast_missing_bearing_length_blocks
    intent: build_floor_support_nodes
    inputs:
      floor_system: precast_hollow_core_PC
      support_material: reinforced_concrete_wall
      verified_product: true
      KR_bearing_length: null
    expected:
      status: blocked_waiting_for_KR

  - test_id: mep_opening_without_KR_blocks
    intent: build_floor_support_nodes
    inputs:
      floor_system: monolithic_rc_flat_slab
      MEP_penetration_requested: true
      KR_opening_approval: false
    expected:
      status: blocked_waiting_for_KR

  - test_id: no_structural_dimensions_guessed
    intent: build_foundation_system
    inputs:
      engineering_geology_revision: GEO_01
      loads_revision: LOADS_01
      approved_foundation_system: raft_rc
      KR_raft_geometry: null
    expected:
      status: blocked_waiting_for_KR
      forbidden_outputs: [foundation_thickness, reinforcement, concrete_class]

  - test_id: rc_column_to_raft_selects_node
    intent: build_column_foundation_node
    inputs:
      foundation_system: raft_rc
      column_material: reinforced_concrete
      KR_column_axis: AXIS_C4
      KR_raft_geometry: KR_RAFT_02
      KR_column_raft_joint: KR_JOINT_C4
      KR_punching_check_reference: KR_PUNCH_C4
    expected:
      node_id: COL_FDN_002_RC_COLUMN_TO_RAFT

  - test_id: flat_slab_column_missing_punching_blocks
    intent: build_column_floor_node
    inputs:
      floor_system: monolithic_rc_flat_slab
      column_material: reinforced_concrete
      KR_column_geometry: KR_COL_01
      KR_slab_geometry: KR_SLAB_01
      KR_column_slab_joint: KR_CS_01
      KR_punching_check_reference: null
    expected:
      status: blocked_waiting_for_KR
      forbidden_outputs: [drop_panel_geometry, punching_reinforcement]

  - test_id: beam_precast_missing_bearing_blocks
    intent: build_beam_floor_node
    inputs:
      floor_system: precast_hollow_core_PC
      verified_slab_product: true
      KR_beam_geometry: KR_BEAM_03
      KR_bearing_length: null
    expected:
      status: blocked_waiting_for_KR

  - test_id: monolithic_stair_selects_connection
    intent: build_stair_landing_node
    inputs:
      stair_system: monolithic_rc
      landing_system: monolithic_rc
      KR_stair_geometry: KR_STAIR_01
      KR_landing_geometry: KR_LDG_01
      KR_joint_definition: KR_STAIR_JOINT_01
      AR_clear_width_check: pass
    expected:
      node_id: STR_LDG_001_MONOLITHIC_STAIR_TO_MONOLITHIC_LANDING

  - test_id: stair_without_egress_check_blocks
    intent: build_stair_landing_node
    inputs:
      stair_system: monolithic_rc
      landing_system: monolithic_rc
      KR_stair_geometry: KR_STAIR_02
      KR_landing_geometry: KR_LDG_02
      AR_clear_width_check: null
    expected:
      status: blocked_waiting_for_KR_or_AR_check

  - test_id: rc_parapet_selects_flat_roof_node
    intent: build_parapet_node
    inputs:
      roof_type: flat
      parapet_material: reinforced_concrete
      KR_parapet_geometry: KR_PAR_01
      roof_waterproofing_system: SYS_WP_01
      thermal_edge_review: pass
      coping_or_top_termination_system: SYS_CAP_01
    expected:
      node_id: PAR_001_RC_PARAPET_TO_FLAT_ROOF_SLAB

  - test_id: ventilated_facade_selects_edge_node
    intent: build_facade_slab_edge_node
    inputs:
      facade_system: ventilated_facade
      KR_slab_edge_geometry: KR_EDGE_01
      verified_facade_system: VF_SYS_01
      manufacturer_anchor_layout_or_KR: VF_ANCHOR_01
      fire_cutoff_strategy: FIRE_EDGE_01
      thermal_review: pass
    expected:
      node_id: FCD_EDGE_002_VENTILATED_FACADE_AT_SLAB_EDGE

  - test_id: ventilated_facade_without_anchor_layout_blocks
    intent: build_facade_slab_edge_node
    inputs:
      facade_system: ventilated_facade
      KR_slab_edge_geometry: KR_EDGE_02
      verified_facade_system: VF_SYS_02
      manufacturer_anchor_layout_or_KR: null
      fire_cutoff_strategy: FIRE_EDGE_02
    expected:
      status: blocked_waiting_for_product_data
      forbidden_outputs: [anchor_type, anchor_spacing, bracket_geometry]

validation_policy:
  - referenced_expected_node_ids_must_exist
  - blocked_tests_must_not_require_generated_structural_dimensions
  - all_tests_must_target_RU_2027_PLUS
