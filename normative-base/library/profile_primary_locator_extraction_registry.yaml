registry_version: 2
checked_at: 2026-10-04
target_profile: RU_2027_PLUS
production_authority: false
policy: fail_closed
role: primary_profile_locator_extraction_queue

purpose: >-
  Машинная очередь первичного извлечения специальных требований для профилей, у которых уже
  есть официальная карточка и revision gate, но отсутствует dedicated machine-rule слой.
  Запись в этом реестре не является нормативным правилом и не разрешает числовое применение.

invariants:
  - extraction_target_never_counts_as_rule_coverage
  - official_card_never_proves_clause_or_table_text
  - amendment_card_summary_never_proves_unchanged_locator_text
  - no_numeric_value_without_direct_current_locator
  - general_SP118_or_host_building_rules_never_fill_missing_special_profile_requirement
  - embedded_special_zone_requires_explicit_zone_classification
  - unresolved_locator_returns_profile_requirement_pending_not_inferred_value
  - deleted_locator_is_not_a_current_extraction_target

states:
  blocked_pending_direct_current_locator: >-
    Current clause/table/appendix text has not been directly read in an accepted primary or
    authorized source. No production promotion is allowed.
  source_chain_ready_locator_pending: >-
    Document identity, active revision chain and official source route are established, but
    locator-level text still needs direct reading.

