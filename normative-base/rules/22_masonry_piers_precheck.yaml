checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Оконные/дверные простенки каменных стен: отделение архитектурной модульной раскладки от обязательной проверки несущей способности по СП 15.13330.2020."

revision_dependencies:
  - {document: SP_15_13330_2020, verified_changes: [1]}
  - {document: SP_20_13330_2016, verified_changes: [1,2,3,4,5,6]}
  - {document: SP_70_13330_2012, target_2027_change: 8}
  - {document: GOST_28984_2011, role: modular_coordination_only}

no_universal_minimum:
  - id: masonry.pier.no_universal_min_width
    automation: forbidden_to_infer
    statement: "Для несущего каменного оконного/дверного простенка нельзя назначать универсальную минимальную ширину только по этажности, толщине стены или формату кирпича. Требуется расчет по СП 15 с фактическими нагрузками и расчетной схемой."
    requires_calculation: true
    conflict_policy: "Пожарный или модульный минимум может увеличить геометрию, но не доказывает несущую способность."

SP15_pier_specifics:
  source: SP_15_13330_2020
  rules:
    - id: masonry.pier.wall_flexibility
      clause: "7.5"
      automation: manual_calculation
      statement: "В стенах, ослабленных проемами, при расчете простенков коэффициент продольного изгиба принимают по гибкости стены."
      requires_calculation: true

    - id: masonry.pier.narrow_in_plane_check
      clause: "7.5"
      automation: manual_calculation
      statement: "Для узкого простенка, ширина которого меньше толщины стены, дополнительно выполняют расчет простенка в плоскости стены; расчетную высоту при такой проверке принимают равной высоте проема."
      conditions:
        trigger: "pier_width < wall_thickness"
        in_plane_effective_height: "opening_height"
      requires_calculation: true

    - id: masonry.pier.analysis_width_with_openings
      clause: "9.13"
      automation: manual_calculation
      statement: >-
        При расчете стены с проемами расчетная ширина участка зависит от характера передачи
        нагрузки покрытия/перекрытия; при равномерной передаче она связана с шириной между
        проемами, а при сосредоточенной передаче действуют специальные ограничения СП 15.
      requires_calculation: true
      conflict_policy: "Не считать всю длину стены работающей с каждым простенком автоматически."

    - id: masonry.pier.FEM_model_choice
      clause: "9.24a, Change 1"
      automation: validation_only
      statement: >-
        При расчете методом конечных элементов стены аппроксимируют пластинчатыми/объемными
        элементами; применение стержневой аппроксимации к столбам/колоннам/простенкам допускается
        только при геометрических условиях пункта. Архитектурный агент не должен заменять этим
        полноценную расчетную модель.

    - id: masonry.pier.lintel_end_stress_concentration
      clause: "Appendix D, D.3"
      automation: validation_only
      statement: "При проверке изгиба из плоскости учитывать возможность концентрации растягивающих напряжений, в том числе у концов надоконных перемычек и в углах проемов."

architecture_precheck_algorithm:
  type: design_procedure
  steps:
    - "1. Определить материал кладки, толщину стены, конструктивную роль стены и этаж/расчетную высоту."
    - "2. Наложить обязательные пожарные простенки/пояса из rules/18_facade_fire_openings.yaml."
    - "3. Определить требуемые размеры проемов в свету/по изделию и узлы перемычек."
    - "4. Сформировать один или несколько архитектурных кандидатов ширины простенка, предпочтительно согласованных с модульной сеткой ГОСТ 28984 и раскладкой выбранного кладочного изделия."
    - "5. Передать каждому кандидату статус needs_structural_calculation с геометрией и расчетными исходными данными."
    - "6. После КР принимать только кандидата с подтвержденной несущей способностью/устойчивостью; если КР увеличивает простенок, перестроить фасадную модульную раскладку."
    - "7. После изменения ширины повторно проверить окно, естественное освещение, пожарные зоны, теплотехнический узел и кладочную раскладку."

required_structural_inputs:
  - wall_material_and_masonry_strength
  - mortar_or_adhesive_system
  - wall_thickness
  - pier_width_candidate
  - opening_height
  - storey_clear_or_structural_height
  - support_conditions
  - vertical_loads_from_upper_storeys
  - floor_and_roof_reactions
  - load_eccentricity
  - wind_or_other_horizontal_actions_when_applicable
  - local_bearing_actions
  - openings_and_adjacent_pier_geometry

BIM_status_fields:
  - pier_geometry_status
  - pier_modular_candidate
  - pier_fire_check_status
  - pier_structural_check_status
  - pier_KR_calculation_reference
  - pier_load_case_reference
  - lintel_mark_or_system
  - lintel_KR_approval

agent_logic:
  - "Никогда не выдавать 380, 510, 600, 640 мм или любое другое распространенное число как нормативный минимум несущего простенка без расчета."
  - "Кратность кирпичу/блоку используется для технологичности раскладки после выполнения обязательных ограничений, а не вместо расчета."
  - "Если pier_width < wall_thickness, автоматически поднимать отдельный флаг narrow_pier_in_plane_check_required."
  - "Пожарные 800/1000 мм из rules/18_facade_fire_openings.yaml относятся только к соответствующим противопожарным случаям и не являются общей нормой простенка."
  - "Результат архитектурного precheck не маркировать как structurally_verified до получения результата КР."

sources:
  - "https://protect.gost.ru/sp/details/88d859d2-0687-4825-9d5a-004160dce187"
