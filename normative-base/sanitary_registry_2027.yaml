    target_2027_policy: "Не переносить числовые требования после 01.03.2027 без подтвержденного заменяющего санитарного акта. Для проекта с расчетной нормативной датой до 01.03.2027 использовать только в пределах его фактической действительности."
    source_urls:
      - "https://base.garant.ru/400274954/"
