release_gate:
  require:
    - all_package_yaml_parse
    - target_profile_is_RU_2027_PLUS
    - no_duplicate_machine_rule_ids_with_global_rules
    - no_calculation_required_value_is_replaced_by_typical_default
    - no_draft_normative_source_is_active
    - no_material_specific_connection_is_reused_across_systems_without_pack_validation
    - no_structural_penetration_without_KR_gate
    - tapir_command_availability_verified_before_write
    - write_operations_have_readback_and_postconditions

completed_material_packs:
  - masonry_reinforced_concrete
  - AAC_reinforced_concrete
  - timber_structures

completed_audits:
  - exact_Tapir_critical_command_presence_audit

next_cycles:
