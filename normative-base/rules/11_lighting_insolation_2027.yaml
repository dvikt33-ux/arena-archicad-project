checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Естественное освещение и инсоляция для архитектурной модели с учетом нормативного перехода 01.03.2027."

current_technical_documents:
  - id: SP_52_13330_2016
    title: "Естественное и искусственное освещение"
    verified_changes: [1,2]
    target_role: calculation_and_design
  - id: GOST_R_21_514_2025
    title: "СПДС. Правила выполнения проектной документации по инсоляции и естественному освещению"
    effective_from: 2025-08-01
    target_role: documentation
    note: "Устанавливает правила оформления соответствующей проектной документации, а не заменяет санитарные нормативы продолжительности инсоляции."

sanitary_transition:
  current_document: SANPIN_1_2_3685_21
  valid_until: 2027-03-01
  target_2027_status: blocked_after_expiry
  replacement_on_check_date: draft_not_normative
  rule: >-
    Для модели/экспертизы после 01.03.2027 не переносить автоматически числовые санитарные
    требования СанПиН 1.2.3685-21. На дату аудита проект нового санитарного документа не является
    утвержденной заменой.
  agent_action_after_expiry: needs_official_sanitary_standard

historical_reference_only_until_2027_03_01:
  note: >-
    Действующие до 01.03.2027 санитарные параметры могут храниться только для проверки старых
    проектов и сравнительного аудита. Они не являются автоматическими правилами RU_2027_PLUS.
  automation: forbidden_for_target_2027_after_expiry

model_inputs_required:
  daylight:
    - room_function
    - window_geometry
    - glazing_geometry_and_visible_transmittance
    - room_geometry
    - calculation_plane
    - external_obstructions
    - site_orientation
    - geographic_location
    - applicable_SP52_requirements
  insolation:
    - room_or_site_function
    - geographic_location
    - true_orientation
    - window_or_calculation_point_geometry
    - surrounding_buildings_and_relief
    - applicable_official_sanitary_rule_on_project_date

agent_rules:
  - id: daylight.no_window_area_ratio_guess
    automation: forbidden_to_infer
    statement: "Не назначать площадь окна по универсальному отношению площади окна к площади пола без подтвержденной нормы для конкретного назначения; выполнять расчет естественного освещения."
  - id: insolation.no_duration_guess_2027
    automation: forbidden_to_infer
    statement: "После 01.03.2027 не подставлять продолжительность инсоляции из утратившего силу СанПиН 1.2.3685-21, пока официальная замена не утверждена и не проверена."
  - id: geometry.preserve_context
    automation: true
    statement: "Для проверки инсоляции и КЕО BIM-модель должна сохранять истинную ориентацию, координаты, геометрию проемов, затеняющие элементы, соседнюю застройку и расчетные поверхности."
  - id: documentation.standard
    automation: validation_only
    statement: "Оформление результатов расчета/графики выполнять по ГОСТ Р 21.514-2025."

fail_closed:
  if_official_2027_sanitary_replacement_missing: "do_not_assert_compliance"
  if_site_orientation_or_surroundings_missing: "insolation_unresolved"
  if_glazing_or_room_parameters_missing: "daylight_unresolved"

sources:
  - https://protect.gost.ru/gost/details/a5cfc429-8ea0-4f99-b3b8-2c895e9c858a
  - https://protect.gost.ru/sp/details/9c938e6d-bd3f-4c81-904f-ba8d4c14357b
