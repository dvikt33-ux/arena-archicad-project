purpose: "Контроль последней официально опубликованной редакции ключевых СП. Этот файл не заменяет правила; он блокирует применение rule-файла, если его revision_level ниже подтвержденного уровня."

policy:
  - "Источник уровня ревизии — официальная карточка Росстандарта/официальный орган, а не поисковая выдача или проект изменения."
  - "Проекты изменений хранятся только как watch_item и не применяются."
  - "Если официальная карточка получает новое изменение, затронутые rule-файлы переводятся в needs_reaudit до постатейной проверки."
  - "Номер изменения сам по себе не означает, что каждый пункт базового СП изменен; числовые правила перепроверяются по содержанию изменения."

