checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Отдельный контроль санитарных правил и СанПиН для проектов 2027+. Санитарные документы имеют собственные сроки действия и не смешиваются с уровнем изменений строительных СП."

policy:
  - "Проверять статус санитарного акта по официальному опубликованию/Роспотребнадзору и действующей правовой редакции."
  - "Если санитарный документ заменен до целевого периода, старый документ запрещается использовать как актуальный даже если строительный СП продолжает ссылаться на его старое обозначение."
  - "Прямая числовая норма строительного СП остается нормой этого строительного СП до его изменения; замена санитарного документа не отменяет автоматически прямые числа СП 118."
  - "Если санитарная норма истекает в 2027 и официальной замены нет, зависимые правила блокируются после даты истечения."

