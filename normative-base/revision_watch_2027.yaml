checked_at: 2026-10-01
target_profile: RU_2027_PLUS
purpose: "Контроль последней официально опубликованной редакции ключевых СП. Этот файл не заменяет правила; он блокирует применение rule-файла, если его revision_level ниже подтвержденного уровня или если документ уже заменен новой редакцией."

policy:
  - "Источник уровня ревизии — официальная карточка Росстандарта/официальный орган; ГАРАНТ используется как независимая текстовая и датировочная сверка."
  - "Проекты изменений хранятся только как watch_item и не применяются."
  - "Если официальная карточка получает новое изменение или новый заменяющий СП, затронутые rule-файлы переводятся в needs_reaudit до постатейной проверки."
  - "Номер изменения сам по себе не означает, что каждый пункт базового СП изменен; числовые правила перепроверяются по содержанию изменения."

