checked_at: 2026-09-30
purpose: "Базовый набор документов, которые архитектурный агент обязан определить до детализации модели."

working_documentation:
  - document: GOST_R_21_101_2026
    role: "общие требования СПДС к проектной и рабочей документации"
    effective_from: 2026-04-01
  - document: GOST_21_501_2018
    role: "рабочая документация архитектурных и конструктивных решений"

building_height_rules:
  residential_apartments:
    source: SP_54_13330_2022
    clause: "5.12"
    dimension_type: clear_floor_to_ceiling
    auto_rule: true
    cases:
      - {climatic_subdistricts: ["IA","IБ","IГ","IД","IVА"], min_mm: 2700}
      - {climatic_subdistricts: "other", min_mm: 2500}
    secondary_spaces:
      intra_apartment_corridors_halls_anterooms_mezzanine:
        min_mm: 2100
        note: "минимум определяется условиями безопасности передвижения; применять в области п. 5.12"
    attic_note: "Для комнат/кухонь на этажах с наклонными ограждениями или в мансарде стандарт допускает уменьшение нормируемой высоты на ограниченной площади; не автоматизировать без проверки полного условия пункта."
  public_buildings:
    source: SP_118_13330_2022
    clause: "4.26"
    dimension_type: clear_floor_to_ceiling_including_suspended_ceiling
    auto_rule: conditional
    general_min_mm: 3000
    applies_to: "new public-building rooms with permanent and/or mass occupancy"
    note: "П. 4.26 содержит специальные исключения для отдельных помещений/назначений. Перед назначением высоты агент обязан проверить полный пункт и профильную норму объекта."

climate_dependency:
  current_document: SP_131_13330_2025
  rule: "Климатический подрайон и климатические параметры всегда получать из действующего СП 131.13330.2025; не использовать таблицы СП 131.13330.2020."

thermal_envelope:
  current_document: SP_50_13330_2024
  rule: "Толщину наружной стены/утеплителя нельзя назначать по типовой цифре. Требуемые теплотехнические характеристики определять расчетом по СП 50.13330.2024 с климатическими данными СП 131.13330.2025 и характеристиками конкретных материалов."

acoustics_and_daylight:
  - {document: SP_51_13330_2011, topic: "защита от шума", amendments: [1,2,3,4]}
  - {document: SP_52_13330_2016, topic: "естественное и искусственное освещение"}

floors_finishes_roofs:
  - {document: SP_29_13330_2011, topic: "полы"}
  - {document: SP_71_13330_2017, topic: "изоляционные и отделочные покрытия"}
  - rule: "Состав пола, кровельного пирога и отделки не назначать только из библиотеки BIM: проверять назначение помещения, влажностный режим, нагрузки, пожарные, акустические и теплотехнические требования."

site_and_parking:
  - document: SP_42_13330_2026
    status: current
    effective_from: 2026-07-12
    replaces: SP_42_13330_2016
  - document: SP_113_13330_2023
    topic: "стоянки автомобилей"
    replaces: SP_113_13330_2016

mixed_use:
  - document: SP_160_1325800_2014
    topic: "многофункциональные здания и комплексы"
    scope_note: "область применения ограничена параметрами, указанными в самом СП; перед применением проверить соответствие объекта области действия"

agent_logic:
  - "Высота этажа != высота помещения в чистоте. Хранить отдельно отметки перекрытий, конструктивную толщину перекрытия, пол/потолок и чистую высоту."
  - "Не принимать 3000 мм как универсальную высоту этажа или помещения."
  - "До назначения ограждающих конструкций определить климатический подрайон, влажностный режим и функциональное назначение помещения."
  - "Перед применением общей нормы проверять специальные СП для функционального назначения объекта."
  - "Генплан с 2026-07-12 проверять по СП 42.13330.2026, а не по СП 42.13330.2016."

sources:
  - https://protect.gost.ru/gost/details/17bc12e8-6579-4145-b141-56855e772e7f
