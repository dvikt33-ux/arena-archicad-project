      официальный заменяющий санитарный документ для периода после этой даты не подтвержден как
      действующий. Значения прекращающего действие документа нельзя автоматически переносить на
      проектные проверки после 01.03.2027.
    replacement_status: not_officially_active_on_audit_date
    agent_action_after_2027_03_01: blocked_pending_official_replacement

