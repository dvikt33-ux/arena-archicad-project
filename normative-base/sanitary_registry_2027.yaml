checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Отдельный реестр санитарных правил Роспотребнадзора для проектов 2027+, не смешиваемый с реестром СП/ГОСТ Росстандарта."

policy:
  - "Санитарные правила проверяются по постановлению Главного государственного санитарного врача РФ и официальной публикации, а не по карточкам Росстандарта."
  - "Документ, прямо признанный утратившим силу новым постановлением, запрещается использовать как действующий источник проектных требований после даты утраты силы."
  - "Если строительный СП ссылается на утратившие силу санитарные правила, такая ссылка не оживляет отмененный документ; необходимо маршрутизировать санитарную проверку на действующий заменяющий акт и отдельно проверять, сохранилось ли требование."

