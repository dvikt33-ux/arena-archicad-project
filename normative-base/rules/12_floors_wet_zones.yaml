checked_at: 2026-09-30
target_profile: RU_2027_PLUS
primary_document: SP_29_13330_2011
purpose: "Проверенные архитектурные правила полов и мокрых зон без подстановки неподтвержденных конструкций."

revision_state:
  base_status: active
  verified_effective_changes: [1,2,3]
  change_4:
    status: approved_and_published_effective_date_not_shown_on_rosstandart_card
    approved: 2025-11-28
    registered: 2025-12-19
    official_card_effective_date: null
    target_policy: "Не использовать новые положения Изм. №4 как самостоятельные автоматические правила до однозначного подтверждения даты введения официальным источником."
    crosscheck_note: "СП 113.13330.2023 Изм. №4 уже ссылается на СП 29 с Изм. №1-4; это фиксируется как сигнал повторной проверки, но не подменяет прямой статус изменения СП 29."

slopes:
  - id: floor.liquid_exposure_slope
    source_clause: "4.5"
    automation: conditional
    applies_when: "medium_or_high_liquid_exposure"
    cases:
      - {covering: "seamless_or_tile_except_concrete", min_percent: 0.5, max_percent: 1.0}
      - {covering: "brick_or_concrete", min_percent: 1.0, max_percent: 2.0}
    drainage_rule: "Направление уклона должно обеспечивать отвод к лоткам, каналам и трапам без пересечения проездов и проходов."
    note: "Не применять эти проценты к помещениям без соответствующей интенсивности воздействия жидкостей."

bathrooms_toilets:
  - id: floor.wet_room_level_or_threshold
    source_clause: "4.8"
    automation: conditional
    general_rule:
      lower_floor_level_mm: {min: 15, max: 20}
      alternative_threshold_max_mm: 20
    accessibility_override:
      source: SP_59_13330_2020
      clause: "6.2.4"
      accessible_door_threshold_max_mm: 14
      priority_rule: >-
        На путях движения МГН дверные проемы не должны иметь порогов/перепадов; если порог
        необходим в допускаемом нормой случае, он не должен превышать 14 мм. Нельзя автоматически
        применять 20 мм из общего правила СП 29 к доступному маршруту.
    model_rule: "Разделять отметку чистого пола, геометрию порога и гидроизоляционный узел."

waterproofing:
  - id: floor.waterproofing_required
    source_clause: "7.1"
    automation: conditional
    statement: "Гидроизоляцию предусматривать при средней и большой интенсивности воздействия на пол жидкостей в случаях, перечисленных п. 7.1."
  - id: floor.waterproofing_continuity
    source_clause: "7.2"
    automation: validation_only
    statement: "Гидроизоляция должна быть непрерывной в конструкции пола и сопряжениях, где это требует п. 7.2; BIM-слой гидроизоляции не должен обрываться условно у стены/трапа."
  - id: floor.waterproofing_type
    source_clause: "7.3 as amended by Change 2"
    automation: conditional
    statement: >-
      При средней/большой интенсивности воздействия жидкостей применяют оклеечную или
      обмазочную гидроизоляцию; под сточными лотками, каналами и трапами при такой интенсивности
      требуется оклеечная гидроизоляция. Материал дополнительно проверять по агрессивности среды.

agent_logic:
  - "Не назначать состав пола по одному названию помещения: определить воздействие жидкостей, нагрузку, основание, акустику, теплотехнику и доступность."
  - "Не создавать порог 20 мм в санузле, если дверь относится к доступному маршруту МГН и действует более строгое ограничение 14 мм."
  - "Не считать уклон 1% универсальным для всех мокрых помещений; выбирать его только по применимому случаю п. 4.5."
  - "Толщины стяжек, покрытий и слоев, не подтвержденные отдельным пунктом и исходными нагрузками, не выдумывать."
  - "Изменение №4 к СП 29 держать в pending до однозначного подтверждения даты введения из официального источника."

sources:
  - https://protect.gost.ru/sp/details/a2711156-c40f-4d0f-89f1-7e3c366bc430
  - https://protect.gost.ru/sp/changesdetails/a3aee15e-eeed-4f0d-a35f-5507d1cbe5e4
