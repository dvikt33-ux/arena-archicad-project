profile: RU_2027_PLUS
target_year: 2027
checked_at: 2026-09-30
purpose: "Нормативный профиль для проектов, реализация которых начнется не ранее 2027 года."

selection_policy:
  - "Если будущая редакция или изменение официально утверждены и имеют точную дату вступления в силу в 2027 году, применять их при проектировании уже сейчас."
  - "Не применять проекты изменений, планы стандартизации и неутвержденные документы."
  - "Документ со статусом 'Принят', но без статуса 'Действует' и без подтвержденной применимой даты введения не становится активным правилом автоматически."
  - "Текущую редакцию, которая будет отменена или изменена до реализации проекта, хранить только как переходную/историческую."
  - "Если будущее изменение удаляет числовое правило без универсальной замены, старое число запрещается использовать автоматически. Возвращать needs_project_or_manufacturer_data или needs_calculation."
  - "Если действующий документ прекращает действие в 2027 году, а замена еще не утверждена, правила из него блокируются для периода после даты прекращения. Проект замены не использовать как норму."
  - "Для каждого решения проверять не только статус СП/ГОСТ, но и применимость требования к конкретному объекту."

legal_2027:
  requirements_registry:
    effective_logic_from: 2027-03-01
    basis: "Федеральный закон от 28.12.2025 №507-ФЗ; новая редакция ч. 5.2 ст. 49 ГрК РФ"
    rule: "Для экспертизы учитывать требования, включенные в Реестр требований на релевантную дату проекта/ГПЗУ/ППТ."
    automation: mandatory_validation

confirmed_transitions:
  - id: SP70_CHANGE8_DEFERRED
    document: SP_70_13330_2012
    amendment: 8
    effective_from: 2027-03-01
    target_profile_action: apply_now_for_2027_design
    affected_architectural_clause: "9.2.4"
    effect: "Пункт 9.2.4 исключается. Числа горизонтального/вертикального шва 12/10 мм более не использовать как нормативное автоматическое правило целевого профиля 2027."
    source_url: "https://protect.gost.ru/sp/changesdetails/c1b0a1c8-73c5-480b-a9dc-0ad44d636d09"

  - id: GOST475_2026
