checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Железобетонные перемычки над проемами: актуальная типология ГОСТ 948-2016 с Изм. №1 и правила безопасного применения в BIM."

source_document:
  id: GOST_948_2016
  title: "Перемычки железобетонные для зданий с кирпичными стенами. Технические условия"
  status: active
  effective_from: 2017-03-01
  verified_amendments:
    - {type: amendment, number: 1, effective_from: 2025-06-01}
    - {type: correction_to_amendment, issue: "ИУС 1-2026", effective_from: 2026-01-22}
  official_status_url: "https://protect.gost.ru/gost/details/33107f24-da2a-4700-8d8e-a3fdcba7ffb4"

current_types_after_change_1:
  source_clause: "4.1"
  note: "Для профиля 2027 использовать актуальные обозначения после Изменения №1; старые ПБ/ПП/ПГ/ПФ не создавать как текущие типы."
  families:
    - code: PRB
      ru_code: "ПРБ"
      definition: "брусковая перемычка шириной до 250 мм включительно"
    - code: PRP
      ru_code: "ПРП"
      definition: "плитная перемычка шириной более 250 мм"
    - code: PRG
      ru_code: "ПРГ"
      definition: "балочная перемычка с четвертью для опирания или примыкания плит перекрытий"
    - code: PRF
      ru_code: "ПРФ"
      definition: "фасадная перемычка, выходящая на фасад и предназначенная для проемов с четвертями при толщине выступающей части кладки в проеме 250 мм и более"

brick_height_table_mapping:
  source_clauses: ["4.2", "4.3"]
  rules:
    - brick_height_mm: 65
      tables: {PRB: 1, PRP: 2, PRG: 3, PRF: 4}
    - brick_height_mm: 88
      tables: {PRB: 5, PRP: 6, PRF: 7}
  note: "Типоразмер извлекать именно из соответствующей таблицы актуальной редакции ГОСТ."

product_geometry:
  - id: lintel.table_lookup_required
    automation: conditional
    statement: "Если марка сборной перемычки выбрана проектом КР, длину, ширину, высоту и иные геометрические параметры брать из актуальной таблицы ГОСТ 948-2016 для этой марки; не реконструировать размеры из сокращенной марки на глаз."
    dimension_semantics: nominal_product
    requires_calculation: false

  - id: lintel.PRB_PRP_technological_taper
    source_clause: "4.4"
    automation: validation_only
    statement: "Для ПРБ и ПРП допускается технологический уклон боковых и торцевых граней; нижняя грань может быть короче верхней по длине до 20 мм и по ширине до 8 мм. Это производственный допуск формы, а не проектный монтажный зазор."
    values:
      max_length_difference_mm: 20
      max_width_difference_mm: 8

selection_boundary:
  - id: lintel.no_span_only_selection
    automation: forbidden_to_infer
    statement: "Запрещено выбирать марку железобетонной перемычки только по ширине строительного проема. Требуются расчетная схема, нагрузки, материал/толщина кладки, опирание и решение КР."
    requires_calculation: true

  - id: lintel.bearing_not_typical_constant
    automation: forbidden_to_infer
    statement: "Длину опирания перемычки на кладку не назначать универсальным числом из практики. Опирание подтверждается расчетом и проектом конструкций с учетом типа перемычки и кладки."
    requires_calculation: true

  - id: lintel.opening_vs_product
    automation: conditional
    statement: "В BIM хранить отдельно ширину строительного проема, марку/габарит перемычки и расчетные опорные зоны. Габарит изделия не является шириной проема."
    dimension_semantics: not_applicable

  - id: lintel.quarter_coordination
    automation: validation_only
    statement: "Для ПРГ/ПРФ четверть является частью геометрии конкретного типа изделия; ее положение согласовывать с перекрытием/фасадным узлом и кладкой, а не добавлять произвольно после выбора обычной брусковой перемычки."

scope_and_material:
  standard_scope:
    - "железобетонные перемычки из тяжелого бетона для проемов кирпичных стен зданий различного назначения"
    - "допускается применение в стенах из искусственных и природных камней"
  additional_design_required:
    - "агрессивная среда"
    - "расчетная сейсмичность 7 баллов и более"
  agent_action: "При специальных условиях не считать стандартную библиотечную марку достаточным проектным решением."

BIM_required_parameters:
  - lintel_standard
  - lintel_mark
  - lintel_family
  - product_length_mm
  - product_width_mm
  - product_height_mm
  - wall_material
  - wall_thickness_mm
  - brick_or_unit_height_mm
  - opening_structural_width_mm
  - bearing_left_mm_confirmed_by_KR
  - bearing_right_mm_confirmed_by_KR
  - load_capacity_confirmed_by_KR
  - quarter_geometry_if_applicable

agent_logic:
  - "Сначала построить/проверить проем и классифицировать стену; затем получить подтвержденную КР марку перемычки; только после этого вставлять библиотечный объект точной геометрии."
  - "Не растягивать стандартную сборную перемычку параметрически до произвольной длины: сменить на существующую марку либо использовать отдельное рассчитанное монолитное/стальное решение."
  - "Не заменять расчет КР выбором ближайшей большей табличной перемычки."
  - "Старые обозначения ПБ/ПП/ПГ/ПФ разрешены только при чтении исторической документации; новая модель 2027+ должна использовать ПРБ/ПРП/ПРГ/ПРФ для ГОСТ 948-2016 в актуальной редакции."

sources:
  - "https://protect.gost.ru/gost/details/33107f24-da2a-4700-8d8e-a3fdcba7ffb4"
  - "https://protect.gost.ru/gost/changesdetails/cb101978-ea9c-4deb-a6da-856c6becaf3a"
  - "https://protect.gost.ru/gost/changesdetails/d5e1a9dd-9b7e-4d8b-a53d-8ae9814faf20"
