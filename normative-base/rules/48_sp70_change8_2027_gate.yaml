    - "9.4.5"
    - "9.5.1"
    - "9.5.4"
    - "9.5.5"
    - "9.5.6"
    - "9.5.7"
    - "9.5.8"
    - "9.6.3"
    - "9.6.5"
    - "9.6.6"
    - "9.6.7"
    - "9.7.2"
    - "9.7.4"
    - "9.7.5"
    - "9.7.8"
    - "9.16.1"
    - "9.16.4"
    - "9.17.3"
    - "9.17.4"
    - "9.18.2"
    - "9.18.5"
  note: "Перечень пунктов раздела 9, прямо перечисленных приказом №353/пр как вводимые с 01.03.2027."

other_deferred_coordination_groups:
  effective_from: 2027-03-01
  groups:
    - sections: ["1", "3"]
      role: "область применения, общие требования, исполнительная документация"
    - sections: ["4", "5", "6"]
      role: "стальные, бетонные и сборные железобетонные конструкции; смежный КР/монтажный слой"
    - sections: ["7", "8"]
      role: "легкие ограждающие и деревянные конструкции"
    - sections: ["10", "11"]
      role: "прочие строительные конструкции и работы"
    - appendices: ["А", "Б", "В", "Г", "Д", "Е", "И", "Ф"]
      role: "приложения, прямо включенные в отложенную часть изменения"
  rule: "Если другой rule-файл цитирует пункт из этих групп, проверять точный номер по полному перечню Изменения №8 перед использованием в 2027+."

already_revalidated:
  - clause: "9.2.4"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Прежние универсальные 12 мм горизонтального и 10 мм вертикального шва не используются как нормативное правило."
    files: ["rules/01_masonry.yaml", "rules/24_masonry_opening_layout.yaml"]

  - clause: "9.6.3"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Пункт исключен с 01.03.2027; геометрию керамического изделия брать непосредственно из действующего ГОСТ 530/данных изделия, а не через удаленный пункт СП 70."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.6.5"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Старые 8-12 мм и 10-16 мм не являются нормативными defaults 2027."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.6.6"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Старое опирание плиты 120 мм/раствор 15 мм/7-8 дней не применять как норму 2027."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.6.7"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Необходимость подушек/поясов определяется КР, а не удаленным пунктом."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.2"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Пункт исключен; геометрию силикатных изделий брать непосредственно из ГОСТ 379-2025/подтвержденного изделия."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.4"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Старые швы 2/12/16 мм не являются нормативными defaults 2027."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.5"
    change8_2027_revalidated: true
    status: removed_from_2027_profile
    consequence: "Старое опирание через раствор до 15 мм M100+ не использовать как норму 2027."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.8"
    change8_2027_revalidated: true
    status: revalidated_against_2027_text
    consequence: "С 01.03.2027 устойчивость панельных перегородок при монтаже обеспечивать по ППР; старую универсальную анкерную схему не переносить."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"

not_in_deferred_list_but_change8_revalidated:
  - clause: "9.2.1"
    status: "Новая формулировка действует основной частью Изменения №8; используется после отдельной сверки."
  - clause: "9.6.4"
    status: "Исключен основной частью Изменения №8 до целевого 2027; старые M75/7-9 см не использовать как актуальное универсальное правило."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.3"
    status: "Исключен основной частью Изменения №8 до целевого 2027."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.7.6"
    status: "Переписан основной частью Изменения №8: контрольный ряд — по проектной/рабочей документации с геометрической проверкой; старые 80-123 мм не переносить."
    file: "rules/56_sp70_large_format_silicate_2027.yaml"
  - clause: "9.2.2"
    status: "Изменением №8 не изменен; правило целого кирпича в узких простенках сохраняется в своей области применения."
  - clause: "9.2.3"
    status: "Изменением №8 не изменен; ограничение кирпича-половняка сохраняется в своей области применения."
  - clause: "9.2.5"
    status: "Изменением №8 не изменен; повторно проверять при будущих изменениях."

machine_gate:
  hard_fail_state: sp70_change8_2027_clause_not_revalidated
  trigger: "source.document == SP_70_13330_2012 AND source.clause intersects masonry_and_architectural_deferred_clauses AND change8_2027_revalidated != true"
  allowed_resolution_states: [revalidated_against_2027_text, removed_from_target_profile, blocked_pending_clause_revalidation]

agent_logic:
  - "Перед применением любого пункта раздела 9 СП 70 сначала проверить его наличие в deferred_clauses и already_revalidated."
  - "Не считать, что Изменение №8 целиком действует с 04.07.2026: для перечисленных пунктов официальная дата — 01.03.2027."
  - "Не считать, что отсутствие нового числового правила разрешает использовать старое значение."
  - "Удаленный пункт не может служить default для нового объекта 2027+, даже если число привычно по практике."

sources:
