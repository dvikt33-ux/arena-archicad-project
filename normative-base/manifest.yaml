manifest_version: 89
checked_at: 2026-10-02
target_profile: RU_2027_PLUS

load_order:
  - priority: 1
    file: target_2027.yaml
    role: future confirmed transitions and 2027 overrides
  - priority: 2
    file: revision_watch_2027.yaml
    role: official latest revision levels of architectural/core documents
  - priority: 3
    file: revision_watch_adjacent_2027.yaml
    role: official revision levels of adjacent structural, construction and engineering documents
  - priority: 4
    file: functional_revision_audit_2027.yaml
    role: verified revision levels and ambiguity gates for special functional codes
  - priority: 5
    file: registry.yaml
    role: base document identity and audit-date status
  - priority: 6
    file: registry_additions_2027.yaml
    role: verified additions and revision-metadata overrides discovered after the first registry pass
  - priority: 7
    file: sanitary_registry_2027.yaml
    role: sanitary rules and replacement status for the 2027 target profile
  - priority: 8
    file: schema/dimension_selection_policy.yaml
    role: dimension semantics and conflict policy
  - priority: 9
    files: rules/*.yaml
    role: verified architectural and BIM rules
  - priority: 10
    file: izh/manifest.yaml
    role: detached-house construction-system and node-engineering package; material-specific recipes inherit all global 2027 gates
  - priority: 11
    file: AUDIT.md
    role: human-readable audit trail

precedence_rules:
  - target_2027.yaml overrides current-date status when an officially confirmed transition applies to 2027.
  - revision_watch_2027.yaml invalidates an architectural/core rule whose claimed revision is below official_latest_change or whose source document is superseded.
  - revision_watch_adjacent_2027.yaml blocks coordination with stale KR/POS/engineering inputs but does not authorize the architectural agent to perform those discipline calculations.
  - functional_revision_audit_2027.yaml overrides stale special-code revision metadata and can block amendment-specific rules when effective status is ambiguous.
  - registry_additions_2027.yaml may supplement or update revision metadata for the same document id but must not change document identity without explicit replacement metadata.
  - sanitary_registry_2027.yaml overrides stale sanitary references when a sanitary act is repealed or replaced.
  - Special functional, fire, accessibility or sanitary requirements apply within their explicit scope before general rules.
  - Direct numeric requirements cannot be replaced by modular rounding.
  - Calculation requirements cannot be replaced by typical values.
  - Manufacturer or product geometry cannot be invented from common market sizes.
  - Draft, accepted-but-not-active, or otherwise unapproved future documents never become active rules.
  - Expired or repealed rules without an applicable official replacement produce blocked or unresolved state.
  - IZH material packs may specialize global rules but cannot weaken a global hard-fail or bypass KR/thermal/MEP calculation gates.

