checked_at: 2026-10-01
target_profile: RU_2027_PLUS
primary_document: SP_29_13330_2011
purpose: "Проверенные архитектурные правила полов и мокрых зон с учетом Изменения №4 для профиля 2027+."

revision_state:
  base_status: active
  verified_effective_changes: [1,2,3,4]
  change_4:
    status: active
    approved: 2025-11-28
    effective_from: 2025-12-30
    effective_basis: "Изменение №4 введено с даты официального опубликования; опубликованная редакция/правовые базы фиксируют начало действия 2025-12-30. В карточке Росстандарта поле даты введения оставлено пустым, поэтому дата не выводится из карточки автоматически."
    rosstandart_url: "https://protect.gost.ru/sp/changesdetails/a3aee15e-eeed-4f0d-a35f-5507d1cbe5e4"
    legal_text_url: "https://base.garant.ru/413424280/"
    verification_note: "Дата 2025-11-28 является датой утверждения приказа, а не датой начала действия; прежняя запись исправлена аудитом 2026-10-01."

slopes:
  - id: floor.liquid_exposure_slope
    source_clause: "4.5"
    automation: conditional
    applies_when: "medium_or_high_liquid_exposure"
    cases:
      - {covering: "seamless_or_tile_except_concrete", min_percent: 0.5, max_percent: 1.0}
      - {covering: "brick_or_concrete", min_percent: 1.0, max_percent: 2.0}
    drainage_rule: "Направление уклона должно обеспечивать отвод к лоткам, каналам и трапам без пересечения деформационных швов здания."
    note: "Не применять эти проценты к помещениям без соответствующей интенсивности воздействия жидкостей."

  - id: floor.parking_space_slope_to_aisle
    source_clause: "4.5, Change 4"
    automation: conditional
    effective_from: 2025-12-30
    applies_when: "car_parking"
    statement: "В помещениях стоянок автомобилей под машино-местами предусматривают уклоны полов в сторону проездов."

  - id: floor.parking_aisle_no_slope_with_side_drains
    source_clause: "4.5, Change 4"
    automation: conditional
    effective_from: 2025-12-30
    applies_when: "car_parking"
    statement: "Уклон пола в проездах стоянки допускается не предусматривать при устройстве водоотводных лотков с обеих сторон по краю проезда."

bathrooms_toilets:
  - id: floor.wet_room_level_or_threshold
    source_clause: "4.8"
    automation: conditional
    general_rule:
      lower_floor_level_mm: {min: 15, max: 20}
      alternative_threshold_max_mm: 20
    accessibility_override:
      source: SP_59_13330_2020
      clause: "6.2.4"
      accessible_door_threshold_max_mm: 14
      priority_rule: >-
        На путях движения МГН дверные проемы не должны иметь порогов/перепадов; если порог
        необходим в допускаемом нормой случае, он не должен превышать 14 мм. Нельзя автоматически
        применять 20 мм из общего правила СП 29 к доступному маршруту.
    model_rule: "Разделять отметку чистого пола, геометрию порога и гидроизоляционный узел."

waterproofing:
  - id: floor.waterproofing_required
    source_clause: "7.1"
    automation: conditional
    statement: "Гидроизоляцию предусматривать при средней и большой интенсивности воздействия на пол жидкостей в случаях, перечисленных п. 7.1."
  - id: floor.waterproofing_continuity
    source_clause: "7.2"
    automation: validation_only
    statement: "Гидроизоляция должна быть непрерывной в конструкции пола и сопряжениях, где это требует п. 7.2; BIM-слой гидроизоляции не должен обрываться условно у стены/трапа."
  - id: floor.waterproofing_upturn
    source_clause: "7.2"
    automation: conditional
    applies_when: "waterproofing according to clause 7 is required and floor adjoins wall/foundation/pipe/other projecting construction"
    min_height_above_floor_covering_mm: 200
    statement: "В области применения п. 7.2 гидроизоляцию в примыканиях продолжают непрерывно на выступающую конструкцию не менее чем на 200 мм от уровня покрытия пола; при возможном попадании струи воды на стену — на всю высоту замачивания."
  - id: floor.waterproofing_type
    source_clause: "7.3 as amended"
    automation: conditional
    statement: >-
      При средней/большой интенсивности воздействия жидкостей применяют предусмотренную СП
      гидроизоляцию; под сточными лотками, каналами и трапами тип гидроизоляции проверять по
      актуальной редакции пункта и агрессивности среды.

agent_logic:
  - "Не назначать состав пола по одному названию помещения: определить воздействие жидкостей, нагрузку, основание, акустику, теплотехнику и доступность."
  - "Не создавать порог 20 мм в санузле, если дверь относится к доступному маршруту МГН и действует более строгое ограничение 14 мм."
  - "Не считать уклон 1% универсальным для всех мокрых помещений; выбирать его только по применимому случаю п. 4.5 либо по специальной норме помещения, например СП 30 для душевой."
  - "Для стоянок 2027+ учитывать Изменение №4, действующее с 2025-12-30: уклон машино-мест к проезду; проезд без уклона допускается только при боковых водоотводных лотках."
  - "Толщины стяжек, покрытий и слоев, не подтвержденные отдельным пунктом и исходными нагрузками, не выдумывать."

