      category: food_universal_assortment
      sales_area_m2: {max: 400}
      min_loading_places: 1
    - id: trk.loading.food_universal_400_1000
      category: food_universal_assortment
      sales_area_m2: {min_exclusive: 400, max: 1000}
      min_loading_places: 2
    - id: trk.loading.food_universal_1001_1500
      category: food_universal_assortment
      sales_area_m2: {min: 1001, max: 1500}
      min_loading_places: 3
    - id: trk.loading.food_universal_1501_plus
