registry_version: 1
checked_at: 2026-10-04
target_profile: RU_2027_PLUS
production_authority: false
role: profile_rule_coverage_inventory

purpose: >-
  Отделяет наличие нормативного профиля/карточки документа от фактического покрытия machine rules.
  Реестр не доказывает правильность чисел и не повышает locator evidence state. Он показывает,
  для каких типов объектов уже существует самостоятельный production rule-layer, где покрытие
  только частичное, а где специальные нормы пока представлены лишь маршрутизацией/metadata.

coverage_states:
  substantive_existing: >-
    Есть несколько самостоятельных профильных rule-секций/файлов с архитектурными требованиями.
    Это не означает locator-level PASS: доказательность каждого числового правила проверяется отдельно.
  partial_special_function: >-
    Есть содержательные правила только по части функций/тем профиля; нельзя считать профиль полным.
  shared_general_only: >-
    Есть общие межпрофильные правила, но нет достаточного самостоятельного слоя primary document.
  coverage_gap_no_dedicated_rules: >-
    Primary document зарегистрирован, но dedicated machine-rule слой по нему пока отсутствует.
  overlay_existing: >-
    Есть содержательный overlay, который применяется поверх базового функционального профиля.

invariants:
  - document_card_presence_never_counts_as_rule_coverage
  - shared_SP118_rules_never_count_as_complete_special_profile_coverage
  - coverage_state_never_counts_as_locator_evidence_PASS
  - coverage_gap_is_fail_closed_for_missing_special_requirement
  - missing_dedicated_profile_must_not_be_filled_by_analogy_from_another_object_class
  - rule_file_reference_must_exist_on_branch
  - highrise_overlay_never_replaces_underlying_functional_profile
  - embedded_special_zone_rules_apply_only_to_classified_zone

