agent_gate:
  - "Перед согласованием отверстий, фундаментов, свай, стальных элементов, огнезащиты и инженерных проходок проверить revision_level профильного задания."
  - "Перед координацией ОВ, ВК, НВК, газоснабжения, теплоснабжения/ИТП, ЭОМ, ПДВ, ВПВ, АУПТ и СПС проверить document identity и revision_level по engineering_design/fire_system_design."
  - "Для общественного газоснабжения проверять идентичность ГОСТ Р 58095.0-2024; версию 2018 блокировать как superseded."
  - "Для теплогенераторов общественных зданий до 100 кВт проверять СП 282.1325800.2023; СП 282.2016 блокировать. Для >100-360 кВт проверять СП 281 с Изм. №1-2."
  - "Для СП 6.13130.2025 дополнительно требовать применение поправки 2026 к п.6.4, даже при revision_level=0."
  - "Для СП 402 п.5.5 не разрешать коллизию плита + проточный водонагреватель выбором одной из двух цифр без официального основания."
  - "Для участков в районах вечной мерзлоты дополнительно проверять актуальность СП 445 и отложенного на 01.03.2027 пункта 13.3."
  - "При несовпадении revision_level вернуть needs_discipline_reaudit, а не подгонять архитектуру под устаревшее решение."
  - "Не переносить числовые требования этих СП/ГОСТ в архитектурный auto-rule без отдельной постатейной проверки их области применения."
