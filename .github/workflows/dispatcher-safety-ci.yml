name: Dispatcher safety regression
on:
  push:
    branches:
      - fix/dispatcher-state-hardening-inline-20261017
  pull_request:
    paths:
      - '.agent-handoff/**'
      - '.github/workflows/dispatcher-safety-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile reviewed modules
        run: |
          python -m py_compile \
            .agent-handoff/dispatcher.py \
            .agent-handoff/control_reply_handoff.py
      - name: Offline regression suite (no CDP or GitHub writes)
        run: python -m unittest discover -s .agent-handoff/tests -p 'test_*.py' -v

  windows-compatibility:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows PowerShell 5.1 syntax and encoding
        shell: powershell
        run: |
          $script = '.agent-handoff/install-dispatcher-state-hardening.ps1'
          $bytes = [IO.File]::ReadAllBytes((Resolve-Path $script))
          if ($bytes | Where-Object { $_ -gt 127 }) { throw 'Installer is not ASCII' }
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -ne 0) { throw ($parseErrors | Out-String) }
      - name: Windows no-browser Python regressions
        shell: powershell
        run: |
          python -m py_compile .agent-handoff/dispatcher.py .agent-handoff/control_reply_handoff.py
          python -m unittest discover -s .agent-handoff/tests -p 'test_*.py' -v
