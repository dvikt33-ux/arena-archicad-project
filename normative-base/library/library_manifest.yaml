known_safety_gaps:
  - id: SP55_MISSING_FROM_GLOBAL_REVISION_WATCH
    status: open
    severity: high
    statement: >-
      IZH_NODE_ENGINEERING declares scope detached_single_family_houses_within_SP55_scope,
      but SP_55_13330_2016 is absent from revision_watch_2027.yaml as of the inspected
      normative-base-v1 state. Library routing therefore treats SP55 revision verification
      as mandatory before any SP55-dependent production release.
    effect: fail_closed_for_unverified_SP55_locators
  - id: SP64_MISSING_FROM_DECLARED_REVISION_WATCH
    status: open
    severity: high
    statement: >-
      izh/00_scope_inputs_2027.yaml declares revision_watch_2027.yaml as the revision gate
      for SP_64_13330_2017, but that document is absent from the declared watch file.
    effect: timber_structural_locators_require_manual_revision_confirmation
  - id: GLOBAL_ROUTER_HAS_NO_IZHS_SP55_ROUTE
    status: open
    severity: high
    statement: >-
      rules/28_functional_code_router.yaml has a multifamily residential route to SP54 but no
      explicit single-family/IZHS route to SP55. The IZH package has an internal SP55 scope gate,
      so the global and package routers are not fully reconciled.
    effect: explicit_IZH_package_selection_required
  - id: SP20_10_2_CURRENT_TEXT_CONFLICT
    status: open
    severity: high
    statement: >-
      Current public renderings used in the 2026-10-03 audit conflict on the operative text
      of SP 20.13330.2016 clause 10.2. Official revision metadata is verified, but clause 10.2
      remains blocked until the actual current locator is read directly.
    effect: no_automatic_snow_value_from_clause_10_2
  - id: SP55_9_18_DIRECT_TEXT_NOT_VERIFIED
    status: open
    severity: high
    statement: >-
      Official amendment metadata is verified, while secondary current copies are insufficient
      under project evidence policy to prove the exact current text of clause 9.18.
    effect: no_production_daylight_ratio_from_SP55_9_18
