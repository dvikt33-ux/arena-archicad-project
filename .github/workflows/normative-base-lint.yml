name: Normative Base Lint

on:
  push:
    branches: [normative-base-v1]
    paths:
      - 'normative-base/**'
      - '.github/workflows/normative-base-lint.yml'
  pull_request:
    paths:
      - 'normative-base/**'
      - '.github/workflows/normative-base-lint.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2
      - name: Validate normative base
        run: python normative-base/tools/validate.py
      - name: Validate functional-zone scopes
        run: python normative-base/tools/validate_functional_scope.py
      - name: Validate engineering-system scopes
        run: python normative-base/tools/validate_engineering_scope.py
      - name: Validate multi-profile functional coverage
        run: python normative-base/tools/validate_multi_profile_catalog.py
      - name: Validate profile rule coverage inventory
        run: python normative-base/tools/validate_profile_rule_coverage.py
      - name: Validate P0 primary locator extraction queue
        run: python normative-base/tools/validate_primary_locator_extraction.py
      - name: Validate P1 profile locator extraction queue
        run: python normative-base/tools/validate_p1_locator_extraction.py
      - name: Validate revision conflicts
        run: python normative-base/tools/validate_revision_conflicts.py
      - name: Validate TRK loading evidence consistency
        run: python normative-base/tools/validate_trk_loading_evidence.py
      - name: Validate library integration
        run: python normative-base/tools/validate_library_integration.py
