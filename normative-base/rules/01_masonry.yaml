checked_at: 2026-09-30
target_profile: RU_2027_PLUS
primary_documents: [GOST_530_2012, SP_70_13330_2012, SP_15_13330_2020]

sp70_revision_state:
  latest_change: 8
  target_effective_date: 2027-03-01
  policy: "Для новых проектов 2027+ применять части Изменения №8, вводимые с 2027-03-01, уже на стадии проектирования."

ceramic_products:
  source: GOST_530_2012
  nominal_sizes_mm:
    brick_KR:
      - {format: "1NF", length: 250, width: 120, height: 65}
      - {format: "0.7NF", length: 250, width: 85, height: 65}
      - {format: "1.4NF", length: 250, width: 120, height: 88}
      - {format: "0.5NF", length: 250, width: 60, height: 65}
      - {format: "1.3NF", length: 288, width: 138, height: 65}
      - {format: "1.8NF", length: 288, width: 138, height: 88}
      - {format: "0.8NF", length: 250, width: 120, height: 55}
    horizontal_void_brick_KRG:
      - {format: "1.4NF", length: 250, width: 120, height: 88}
      - {format: "1.8NF", length: 250, width: 200, height: 70}
  note: "Для керамических камней использовать точный ряд размеров стандарта конкретного изделия; не подменять его бытовыми названиями типа 'двойной кирпич'."

bonding:
  source: SP_70_13330_2012_change_8
  clause: "9.2.1"
  auto_rule: conditional
  multirow_bonding:
    - {material: "single brick", header_course: 1, stretcher_courses: 6}
    - {material: "thickened brick", header_course: 1, stretcher_courses: 4}
    - {material: "regular-shaped stones", header_course: 1, stretcher_courses: 3}
  bearing_note: >-
    При многорядной перевязке тычковые ряды под опорными частями балок, прогонов, плит
    перекрытий, балконов, мауэрлатов и других сборных конструкций обязательны; при однорядной
    (цепной) перевязке допускается опирание сборных конструкций на ложковые ряды.

mortar_joints_2027:
  source: SP_70_13330_2012_change_8
  affected_clause: "9.2.4"
  effective_from: 2027-03-01
  auto_rule: false
  status: removed_for_target_profile
  statement: >-
    Пункт 9.2.4 исключается с 2027-03-01. Значения 12 мм для горизонтального и 10 мм для
    вертикального шва не являются нормативным автоматическим правилом для профиля RU_2027_PLUS.
  agent_action: needs_project_or_manufacturer_data
  prohibited_inference:
    - "Не выводить шаг 1NF как 250+10=260 мм на основании исключенного п. 9.2.4."
    - "Не выводить высотный шаг ряда как 65+12=77 мм или 88+12=100 мм на основании исключенного п. 9.2.4."
    - "Не назначать ширину простенка кратной прежнему шву 10 мм как нормативное требование."

construction_rules:
  - id: masonry.small_piers_whole_brick
    source: SP_70_13330_2012
    clause: "9.2.2"
    auto_rule: false
    statement: >-
      Кирпичные столбы, пилястры и простенки шириной в два с половиной кирпича и менее,
      а также рядовые кирпичные перемычки и карнизы выполнять из отборного целого кирпича,
      если это требование сохранено применимой редакцией для конкретного проекта.
  - id: masonry.half_brick_limit
    source: SP_70_13330_2012
    clause: "9.2.3"
    auto_rule: false
    statement: >-
      Использование кирпича-половняка проверять по актуальной редакции СП 70 и технологии
      выполнения работ; не превращать старое технологическое допущение в геометрическое правило BIM.
  - id: masonry.joints_fill
    source: SP_70_13330_2012
    clause: "9.2.5"
    auto_rule: false
    statement: >-
      Требования к заполнению швов проверять по редакции СП 70, применимой к дате реализации.

geometry_helpers:
  policy: >-
    Геометрические шаги кладки разрешено вычислять только после задания фактического/проектного
    шва из подтвержденной технологии, рабочей документации или документации изготовителя.
  formula_running_pitch: "unit_length + project_vertical_joint"
  formula_course_pitch: "unit_height + project_horizontal_joint"
  normative_status: derived_geometry_not_normative_dimension

agent_logic:
  - "Перед расчетом простенка определить формат кирпича/камня, тип перевязки, толщину стены, конструктивную роль и положение проема относительно координационной сетки."
  - "Не назначать ширину несущего простенка только по кратности кладочному изделию: несущая способность проверяется по СП 15.13330.2020 и КР."
  - "Для профиля 2027 не использовать 260/77/100 мм как нормативные шаги."
  - "Не применять правила обычной кирпичной кладки к крупноформатным блокам, тонкошовным растворам и клеевым составам без профильного стандарта изделия и технологии."
  - "Опирание плит, перемычек и балок не назначать по универсальному типовым числу без проверки КР и документации изделия."
  - "Если проектная толщина шва не задана подтвержденным источником, возвращать unresolved, а не подставлять 10/12 мм."

sources:
  - https://protect.gost.ru/gost/details/e3f3ca57-13cb-493c-a047-21814635e7fc
  - https://protect.gost.ru/sp/details/2239acf1-711f-4f1f-aaa7-902fa06a8a60
  - https://protect.gost.ru/sp/changesdetails/c1b0a1c8-73c5-480b-a9dc-0ad44d636d09
