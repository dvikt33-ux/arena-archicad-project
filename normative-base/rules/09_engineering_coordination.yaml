checked_at: 2026-09-30
purpose: "Нормативные границы, из-за которых архитектурная модель должна резервировать шахты, помещения, проходы и проемы, но не генерировать инженерные размеры без профильного расчета."

current_documents:
  - {id: SP_60_13330_2020, topic: "heating ventilation air conditioning", status: active, latest_verified_change: 6}
  - {id: SP_7_13130_2013, topic: "HVAC fire safety", status: active, verified_changes: [1,2,3]}
  - {id: SP_30_13330_2020, topic: "internal water supply and sewerage", status: active, latest_verified_change: 5}
  - {id: SP_256_1325800_2016, topic: "electrical installations of residential and public buildings", status: active, latest_verified_change: 9}

architecture_coordination_rules:
  - id: mep.shafts_not_arbitrary
    automation: validation_only
    statement: "Габариты инженерных шахт и ниш нельзя назначать по универсальному шаблону; они зависят от состава систем, огнестойкости ограждений, монтажных зазоров и обслуживания."
  - id: mep.penetration_structural_gate
    automation: forbidden_to_infer
    statement: "Проемы/отверстия в несущих стенах, плитах, балках и ригелях под инженерные сети должны быть согласованы с КР; агент не должен вырезать их автоматически после построения несущей схемы."
  - id: mep.fire_compartment_penetration
    automation: validation_only
    statement: "Пересечение противопожарных преград инженерными коммуникациями требует отдельной проверки пожарных требований и узла заделки; обычный BIM-проем не является достаточным решением."
  - id: mep.ventilation_architecture
    automation: validation_only
    statement: "Архитектура должна резервировать места для венткамер, шахт, воздухозабора/выброса и обслуживания по профильному проекту; не выводить размеры из площади здания простым коэффициентом."
  - id: mep.wet_zones
    automation: conditional
    statement: "Положение санитарных приборов и стояков координировать с конструкциями, гидроизоляцией, шумоизоляцией и трассировкой; геометрия стояка не должна появляться постфактум путем произвольного отверстия в плите."
  - id: mep.electrical_rooms
    automation: validation_only
    statement: "Электрощитовые/электротехнические зоны и трассы определять по профильному разделу и СП 256; архитектурный агент резервирует подтвержденные габариты, но не рассчитывает их сам."

agent_logic:
  - "Перед выпуском АР выполнять междисциплинарную проверку проемов и шахт с КР/ОВ/ВК/ЭОМ."
  - "Не создавать отверстие в несущей конструкции только потому, что инженерная трасса пересекает ее в модели."
  - "Каждый инженерный проем должен иметь владельца/основание: система, отметка, габарит, огнезаделка при необходимости и согласование КР."
  - "Если инженерные исходные данные отсутствуют, резервировать только явно согласованную зону либо возвращать unresolved, не выдумывать сечение шахты."

