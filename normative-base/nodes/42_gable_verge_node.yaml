checked_at: 2026-10-02
target_profile: RU_2027_PLUS
package: ROOF_NODE_ENGINEERING
node_family: gable_verge
purpose: executable_node_for_sloping_free_roof_edge_at_gable

applicability:
  edge_class: sloping_free_edge_to_gable
  allowed_roof_forms: [gable, cross_gable, complex_pitched]
  requires_covering_adapter: true

required_inputs:
  - roof_plane_guid
  - verge_curve
  - covering_system_id
  - wall_or_gable_host_guid_if_present
  - roof_build_up_reference
  - structural_roof_scheme_reference
  - KR_edge_member_geometry_if_structural
  - ventilation_mode
  - underroof_water_control_layer

selection_logic:
  - id: roof.verge.classify_free_edge
    automation: true
    when: {edge_class: sloping_free_edge_to_gable}
    select: gable_verge
  - id: roof.verge.no_false_abutment
    automation: true
    statement: "Свободный фронтонный торец не маршрутизировать как wall_abutment только потому, что рядом существует фронтонная стена; тип определяется фактическим пересечением слоев и геометрией кромки."

rules:
  - id: roof.verge.covering_adapter_required
    automation: true
    statement: "Торцевой наружный элемент, подрезка покрытия, уплотнение и способ фиксации задаются только adapter выбранной кровельной системы или проверенным проектным узлом."
    result_on_missing: roof_required_manufacturer_detail_missing
  - id: roof.verge.KR_edge_member_required_if_loadbearing
    automation: conditional
    when: {edge_contains_structural_member: true}
    statement: "Лобовая/торцевая доска, крайнее стропило, прогон, ферма, ЛСТК-профиль и их крепления создаются только из КР; архитектурный узел не назначает сечение и крепеж."
    result_on_missing: roof_KR_input_missing
  - id: roof.verge.water_exit_required
    automation: true
    statement: "Подкровельная и наружная вода на фронтонном торце не должна возвращаться под покрытие, в утеплитель или стеновую полость; должен существовать подтвержденный путь наружу."
    result_on_failure: roof_water_path_unresolved
  - id: roof.verge.envelope_continuity
    automation: validation_only
    statement: "Если тепловой контур доходит до фронтонной кромки, тепло-, воздухо- и парорегулирующие слои замыкаются на стеновой/торцевой контур без автоматической подмены конструктивными элементами."

geometry_operations:
  - classify_actual_edge_topology
  - reference_KR_edge_members_without_modification
  - terminate_covering_using_selected_adapter
  - place_verified_verge_flashing_or_product_component
  - route_underroof_water_to_exterior
  - close_thermal_air_vapor_contours_if_applicable
  - preserve_required_ventilation_path

postconditions:
  - edge_class_is_gable_verge
  - covering_adapter_present
  - no_unapproved_structural_geometry_created
  - water_path_exits_to_exterior
  - envelope_contours_checked
  - ventilation_not_silently_blocked
