<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCOLLAB — настройки</title><style>:root{--navy:#0b2545;--navy2:#13315c;--blue:#0079c1;--blue2:#005d96;--sky:#4cc2ff;--bg:#e9edf2;--card:#fff;--ink:#1c2733;--muted:#64748b;--green:#1e9e6a;--red:#d64545;--amber:#b7791f}*{box-sizing:border-box}body{font-family:'Segoe UI',system-ui,Roboto,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 2px 8px #0004;position:sticky;top:0;z-index:5}.wrap{max-width:960px;margin:0 auto;padding:0 16px}.head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.brand .t{font-size:20px;font-weight:700;letter-spacing:2px}.brand .s{font-size:12px;color:var(--sky)}.hact{display:flex;gap:10px;align-items:center}.gear{color:#fff;text-decoration:none;font-size:22px;opacity:.85}.gear:hover{opacity:1}.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;font-size:16px;font-weight:600;padding:10px 26px;cursor:pointer}.btn:hover{background:var(--blue2)}.btn.big{font-size:17px;padding:12px 30px;box-shadow:0 0 0 2px #ffffff33}.btn.small{font-size:13px;padding:5px 14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}.card{background:var(--card);border-radius:10px;padding:12px 16px;box-shadow:0 1px 4px #0001;border-top:3px solid var(--blue)}.card span{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}.card b{font-size:26px;display:block;margin-top:2px}.card.bad{border-top-color:var(--red)}.card.warn{border-top-color:var(--amber)}section{background:var(--card);border-radius:10px;padding:4px 16px 14px;margin:14px 0;box-shadow:0 1px 4px #0001}h2{font-size:15px;text-transform:uppercase;letter-spacing:1px;color:var(--navy);border-bottom:2px solid var(--sky);padding-bottom:6px}h3{font-size:13px;color:var(--navy);margin:14px 0 4px}table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid #e5eaf0;padding:7px 8px;font-size:13px;text-align:left}th{color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:1px}.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;color:#fff;background:var(--muted)}.pill.hard{background:var(--red)}.pill.soft{background:var(--blue)}.note{padding:10px 14px;border-radius:8px;margin:10px 0;font-size:14px}.note.ok{background:#d9f2e6}.note.warn{background:#fff3cd}.note.err{background:#f8d7da}.pulse{animation:pl 1.2s infinite}@keyframes pl{0%,100%{opacity:1}50%{opacity:.45}}input[type=text],input[type=password]{padding:6px 8px;border:1px solid #cbd5e1;border-radius:6px;width:200px;font-size:13px}input[type=text].wide{width:340px;max-width:100%}input[type=checkbox]{width:18px;height:18px;vertical-align:middle}form.inline{display:inline}footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 0 26px}footer a{color:var(--blue)}.empty{color:var(--muted);font-size:13px;padding:6px 0}.frow{display:flex;gap:10px;align-items:center;margin:8px 0;flex-wrap:wrap}.frow label{width:230px;font-size:13px;color:var(--muted)}.hint{font-size:12px;color:var(--muted)}</style></head><body>
<header><div class="wrap head"><div class="brand"><svg width="38" height="38" viewBox="0 0 36 36"><path d="M18 3 32 11v14L18 33 4 25V11z" fill="#4cc2ff"/><path d="M18 3 32 11 18 19 4 11z" fill="#d8f1ff"/><path d="M18 19v14L4 25V11z" fill="#0079c1"/></svg>

<div class="wrap"><div class="note ok">nastroyki sohraneny</div><section><h2>⚙ accollab.json</h2>
<form method="post" action="/settings"><h3>Проект</h3><div class="frow"><label>Проект (project_id)</label><input type="text" class="wide" name="project_id" value="tropa"></div><div class="frow"><label>Автор (author)</label><input type="text" class="wide" name="author" value="anna"></div><h3>Пути</h3><div class="frow"><label>Файл базы (store)</label><input type="text" class="wide" name="store" value="accollab.db"></div><div class="frow"><label>Исходящие (outbox_dir)</label><input type="text" class="wide" name="outbox_dir" value="outbox"></div><div class="frow"><label>Входящие (inbox_dir)</label><input type="text" class="wide" name="inbox_dir" value="inbox"></div><h3>Демон и Archicad</h3><div class="frow"><label>Опрос, сек (poll_s)</label><input type="text" class="wide" name="poll_s" value="5"></div><div class="frow"><label>Порт Archicad, 0=авто (archicad_port)</label><input type="text" class="wide" name="archicad_port" value="19724"></div><div class="frow"><label>Таймаут команд, сек (archicad_timeout)</label><input type="text" class="wide" name="archicad_timeout" value="60"></div><div class="frow"><label>Порт этой страницы (serve_port)</label><input type="text" class="wide" name="serve_port" value="8472"></div><h3>Relay</h3><div class="frow"><label>Relay URL (пусто = нет)</label><input type="text" class="wide" name="relay_url" value=""></div><div class="frow"><label>Таймаут relay, сек (relay_timeout)</label><input type="text" class="wide" name="relay_timeout" value="30"></div><h3>Telegram</h3><div class="frow"><label>Telegram chat_id (пусто = нет)</label><input type="text" class="wide" name="telegram_chat_id" value="@tropa_chan"></div><div class="frow"><label>Telegram API base</label><input type="text" class="wide" name="telegram_api_base" value="https://api.telegram.org"></div><div class="frow"><label>Таймаут Telegram, сек (telegram_timeout)</label><input type="text" class="wide" name="telegram_timeout" value="30"></div><h3>Бэкапы</h3><div class="frow"><label>Каталог бэкапов (пусто = нет)</label><input type="text" class="wide" name="backup_dir" value=""></div><div class="frow"><label>Сколько бэкапов хранить (backup_keep)</label><input type="text" class="wide" name="backup_keep" value="5"></div><h3>Поведение</h3><div class="frow"><label>Лок по умолчанию, сек (lock_ttl_s)</label><input type="text" class="wide" name="lock_ttl_s" value="20"></div><div class="frow"><label>Правила BIM, all/коды (bim_rules)</label><input type="text" class="wide" name="bim_rules" value="all"></div><div class="frow"><label>Мой цвет подсветки, hex (own_color)</label><input type="text" class="wide" name="own_color" value=""></div><h3>Галки</h3><div class="frow"><label>Подсветка присутствия (presence_enabled)</label><input type="hidden" name="presence_enabled" value="0"><input type="checkbox" name="presence_enabled" value="1" checked></div><div class="frow"><label>Авто-чекпоинт перед чужими (auto_checkpoint)</label><input type="hidden" name="auto_checkpoint" value="0"><input type="checkbox" name="auto_checkpoint" value="1" checked></div><div class="frow"><label>Уведомлять о конфликтах в Telegram (telegram_notify)</label><input type="hidden" name="telegram_notify" value="0"><input type="checkbox" name="telegram_notify" value="1"></div><h3>Секреты (пусто = не менять)</h3><div class="frow"><label>Секрет relay (пуст)</label><input type="password" class="wide" name="relay_secret" value=""></div><div class="frow"><label>Токен Telegram-бота (задан)</label><input type="password" class="wide" name="telegram_bot_token" value=""></div><div class="frow"><label>Подпись Telegram (пуст)</label><input type="password" class="wide" name="telegram_secret" value=""></div>
<p><input type="submit" class="btn" value="Сохранить"></p></form>
<p class="hint">Пути и порты вступают после перезапуска serve/демона, галки —
сразу со следующим тиком. Файл лежит рядом с базой.</p>
</section></div></body></html>
