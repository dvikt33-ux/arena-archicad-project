checked_at: 2026-09-30
target_profile: RU_2027_PLUS
purpose: "Не допускать проектирование кладки по замененным стандартам и отделять каталог изделия, системную геометрию и расчетную несущую схему."

AAC_autoclaved:
  document: GOST_31360_2024
  status: active_for_target_2027
  effective_from: 2025-01-01
  replaces: GOST_31360_2007
  corrections: ["ИУС 10-2024","ИУС 11-2025","ИУС 9-2025"]
  scope: "неармированные блоки из автоклавного ячеистого бетона в области применения стандарта"
  maximum_product_dimensions_mm:
    source_clause: "4.2.2"
    qualifier: "как правило, не должны превышать"
    length: 1500
    width: 650
    height: 1000
  geometry_policy:
    - "Максимальные размеры не являются рекомендуемым модулем стены или стандартным BIM-типоразмером."
    - "Конкретный размер блока брать из подтвержденной документации изготовителя/поставщика в рамках действующего ГОСТ."
    - "Шов определять по применяемой технологии кладки; не переносить старые 12/10 мм обычной кирпичной кладки в профиль 2027."
  agent_logic:
    - "Не использовать ГОСТ 31360-2007."
    - "Не выбирать толщину наружной стены только по ширине блока: выполнить проверки СП 15, СП 50, пожарных и акустических требований."
    - "Не считать 600/625 мм универсальным нормативным шагом газобетона без выбранного конкретного изделия."

silicate_masonry:
  document: GOST_379_2025
  status: active_for_target_2027
  effective_from: 2026-05-01
  replaces: GOST_379_2015
  correction: "ИУС 6-2026"

  exact_defined_products:
    - {type: "single_silicate_brick", length_mm: 250, width_mm: 120, height_mm: 65}
    - {type: "thickened_silicate_brick", length_mm: 250, width_mm: 120, height_mm: 88}
    - {type: "silicate_stone", length_mm: 250, width_mm: 120, height_mm: 138}
    - {type: "euro_silicate_brick", length_mm: 250, width_mm: 85, allowed_heights_mm: [65,60]}

  product_families_from_appendix_A:
    - "silicate_blocks"
    - "enlarged_silicate_blocks"
    - "U_shaped_silicate_blocks"
    - "silicate_partition_slabs"
    - "enlarged_silicate_partition_slabs"

  appendix_A_semantics:
    status: verified
    rule: >-
      Приложение А приводит рекомендуемые номинальные размеры. Стандарт допускает изготовление
      изделий других номинальных размеров при соблюдении установленных предельных отклонений.
      Следовательно, приложение А является нормативным каталогом рекомендуемой координации, но не
      основанием объявлять любой иной подтвержденный изготовителем размер запрещенным.
    tongue_and_groove_note: "Для блоков и перегородочных плит с пазогребневым соединением в таблице А.1 указана системная длина изделия; не смешивать ее с длиной брутто."

  dimensional_tolerances:
    source_clause: "5.2.5.2"
    ordinary_masonry_mortar:
      length_width_height_mm: 2
      bearing_faces_parallelism_mm: 2
    adhesive_or_thin_joint_mortar:
      length_width_mm: 2
      height_mm: 1
      bearing_faces_parallelism_mm: 1
    model_use: >-
      Допуски относятся к изготовлению изделия. Нельзя намеренно моделировать отклонение как
      проектный размер, но категория технологии важна для точности раскладки и выбора шва.

  agent_logic:
    - "Не использовать ГОСТ 379-2015."
    - "Различать кирпич, камень, блок, укрупненный блок, U-блок, перегородочную плиту и укрупненную плиту как разные семейства BIM-элементов."
    - "Для пазогребневого изделия хранить system_length и gross_length отдельными параметрами."
    - "Не выводить прочность стены из геометрии изделия; марку/класс и расчет проверять отдельно."
    - "Перед автогенерацией полной раскладки выбрать фактический товарный тип/изделие; если он не выбран, допускается только координационная схема, но не детальная порядовка."

structural_calculation:
  - document: SP_15_13330_2020
    role: "расчет каменных и армокаменных конструкций"
  - document: SP_70_13330_2012
    role: "требования к выполнению кладки и несущих/ограждающих конструкций с учетом Изменения №8 и профиля 2027"

