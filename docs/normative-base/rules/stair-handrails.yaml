rules:
  - id: FIRE.STAIR.HANDRAIL.TRIGGERS
    state: active
    source: SP-1.13130.2020
    clause: "4.3.5 as amended by Amendment 3"
    scope: "Лестницы на путях эвакуации в области применения пункта."
