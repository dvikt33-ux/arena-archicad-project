catalog_scope_rules:
  - id: ceramic.catalog.standard_rows_are_reference_not_closed_whitelist
    source: {document: GOST_530_2012, clause: "4.2.1, table 3 note 1"}
    automation: validation_only
    statement: "ГОСТ допускает по согласованию изготовителя с потребителем доборные изделия и изделия иных номинальных размеров при соблюдении установленных предельных отклонений. Поэтому отсутствие размера в таблице 2/3 не доказывает автоматически его недопустимость; нестандартный размер требует реального изготовителя/документации и не может быть выдуман агентом."
    requires_manufacturer_data: true

  - id: ceramic.catalog.no_invented_product
    automation: forbidden_to_infer
    statement: "Агент не создает новый керамический типоразмер только для закрытия остатка стены. Вне табличного каталога требуется подтвержденный продукт/ТУ/документация изготовителя."
    requires_manufacturer_data: true

  - id: ceramic.catalog.ground_state_explicit
    automation: auto
    statement: "Для камней с различной толщиной 219/229 мм параметр ground_state должен быть явным; нельзя автоматически подменять нешлифованный камень шлифованным или наоборот, поскольку меняются номинальная толщина и формат NF."

joint_semantics_2027:
  - id: ceramic.catalog.table_note_12mm_not_global_joint_rule
    source: {document: GOST_530_2012, clause: "4.2.1, table 3 note 1"}
    automation: forbidden_to_infer
    statement: "Упоминание 12 мм постельного шва в примечании таблицы 3 ГОСТ 530 используется в контексте формирования номинального размерного ряда изделий. Для профиля 2027 оно не восстанавливает исключенный с 01.03.2027 п.9.2.4 СП 70 и не дает права автоматически назначать 12 мм как универсальную фактическую толщину горизонтального шва кладки."
    conflict_policy: "Фактическую/проектную толщину шва получать из актуальной технологии кладки, проекта, применимого СП и документации конкретной системы/изготовителя."

  - id: ceramic.catalog.format_not_course_pitch
    automation: auto
    statement: "Формат NF и номинальная толщина изделия не являются готовым шагом ряда кладки. Высотный шаг для BIM-раскладки вычисляют только после подтверждения технологии шва."

structural_and_thermal_gates:
  - id: ceramic.catalog.wall_thickness_not_product_width_only
    automation: forbidden_to_infer
    statement: "Толщину несущей/наружной стены нельзя назначить только выбором ширины керамического камня. Требуются расчет каменной конструкции по СП 15, теплотехнический расчет по СП 50 и проектный состав стены."
    requires_calculation: true

  - id: ceramic.catalog.strength_not_geometry
    automation: forbidden_to_infer
    statement: "Марку по прочности, морозостойкость, класс средней плотности и расчетную несущую способность нельзя выводить из одного типоразмера/NF. Использовать полное обозначение конкретного изделия и расчет КР."
    requires_manufacturer_data: true
    requires_calculation: true

BIM_required_parameters:
  - ceramic_product_family
  - ceramic_product_standard
  - manufacturer_product_id
  - nominal_length_or_nonworking_mm
  - nominal_width_or_working_mm
  - nominal_thickness_mm
  - NF_format
  - ground_state
  - tongue_and_groove_state_if_applicable
  - facing_or_common_or_clinker_class
  - solid_or_hollow_class
  - strength_grade
  - density_class
  - frost_resistance_grade
  - confirmed_joint_system_reference
  - confirmed_horizontal_joint_mm
  - confirmed_vertical_joint_mm

library_generation_policy:
  - "Сначала создавать параметрические типы для точных строк таблиц 2/3, сохраняя family/format/ground_state как свойства, а не только геометрические размеры."
  - "Нестандартный размер добавлять в библиотеку только из подтвержденной карточки производителя/ТУ, с source_reference и manufacturer_product_id."
  - "Доборный КМД хранить как отдельное семейство и не имитировать произвольной обрезкой обычного КМ, если требуется стандартный/подтвержденный доборный элемент."
  - "После выбора библиотечного элемента раскладку проемов/простенков выполнять через rules/24_masonry_opening_layout.yaml; несущие простенки — через rules/22_masonry_piers_precheck.yaml."

agent_logic:
  - "Не использовать устаревшие таблицы ГОСТ 530-95 или ГОСТ 530-2007."
  - "Не называть любой крупный керамический блок 'двойным кирпичом': использовать нормативное семейство КМ/КМД и точные размеры."
  - "Не путать рабочий и нерабочий размер пазогребневого камня."
  - "Не использовать 12 мм из примечания ГОСТ 530 как универсальный проектный шов после перехода SP70 Change 8 в 2027."
  - "Геометрическая совместимость с модулем не доказывает несущую, теплотехническую или пожарную пригодность стены."

sources:
